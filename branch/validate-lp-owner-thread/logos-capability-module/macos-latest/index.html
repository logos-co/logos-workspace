diated by the\ncapability module built from the commit under test, a green run is real\nevidence that this change keeps module loading and inter-module composition \u2014\nthe things the capability layer gates \u2014 working end to end.\n\n**What you'll build:** Two modules \u2014 a `greeter_module` callee and an `orchestrator_module` caller \u2014 run together in a `logoscore` whose capability broker is built from this commit, with the caller driving the callee over IPC.\n\n**What you'll learn:**\n\n- How the capability module sits under every module load and every cross-module call\n- How one module declares another as a dependency (`metadata.json` + `flake.nix` input)\n- How the SDK generates a typed `modules().<dep>` wrapper with sync, async, and event APIs\n- How to build `logoscore` with a specific `logos-capability-module` commit pinned across its closure\n- How to load two modules in `logoscore` and chain calls so the caller drives the callee through the capability layer\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **git** \u2014 nix flakes only see files tracked by git.\n- A Linux or macOS machine.", "execs": []}, {"md": "## Step 1: Create the callee: greeter_module\n\n`greeter_module` is an ordinary `core` module written in the pure-C++\n(`interface: universal`) style: you write one plain class, and the builder\ngenerates the Qt plugin glue. Every `public` method becomes callable over\nIPC, and the `logos_events:` block declares an event other modules can\nsubscribe to. The greeter is a plain payload module \u2014 nothing about it\nreferences the capability module; that layer is exercised when it is loaded\nand called.", "execs": []}, {"md": "### 1.1 metadata.json\n\n`dependenci a9d5737fca461482c204f594339da24e2\";\n  };\n\n  outputs = inputs@{ logos-module-builder, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n    };\n}\n```", "execs": [{"kind": "file", "cmd": "write greeter_module/flake.nix", "status": "pass", "note": "Wrote greeter_module/flake.nix"}]}, {"md": "### 1.4 src/greeter_module_impl.h \u2014 the class\n\nPlain C++ inheriting `LogosModuleContext`. The `///` doc comments\nbecome each method's description; the `logos_events:` block declares\nthe `greeted` event (the token expands to `public` under a normal\ncompile, and the generator emits the event body).\n\n```cpp\n#pragma once\n\n#include <cstdint>\n#include <string>\n\n#include <logos_module_context.h>  // LogosModuleContext base + logos_events\n\n// A simple callee module. The orchestrator composes these methods over\n// IPC. It also emits a `greeted` event so the caller can exercise a\n// typed event subscription.\nclass GreeterModuleImpl : public LogosModuleContext {\npublic:\n    GreeterModuleImpl() = default;\n    ~GreeterModuleImpl() = default;\n\n    /// Returns a greeting for the given name.\n    std::string greet(const std::string& name);\n\n    /// Adds two integers and returns the sum.\n    int64_t addInts(int64_t a, int64_t b);\n\n    /// Returns how many times greet() has been called on this instance.\n    int64_t greetCount() const;\n\n    /// Greets the name and also emits a `greeted` event carrying it.\n    void greetNotify(const std::string& name);\n\nlogos_events:\n    /// Emitted by greetNotify() with the produced greeting string.\n    void greeted(const std::string& greeting);\n\nprivate:\n    int64_t m_greetCount = 0;\n};\n```", "execs": [{"kind": "file", "cmd": "write greeter_module/src/greeter_module_impl.h", "status": "pass", "note": "Wrote greeter_module/src/greeter_module_impl.h"}]}, {"md": "### 1.5 src/greeter_module_impl.cpp \u2014 the implementation\n\nPlain e reply arrives on the daemon's event\nloop; the next call, `asyncGreeting()`, reads what the callback stashed:\n\n```bash\nlogoscore call orchestrator_module startAsyncGreet Async\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call orchestrator_module startAsyncGreet Async", "status": "fail", "exit_code": 4, "output": "{\"code\":\"RPC_FAILED\",\"message\":\"callModuleMethod('orchestrator_module','startAsyncGreet') RPC call failed.\",\"status\":\"error\"}\n", "note": "exit code 4"}]}, {"md": "```bash\nsleep 1\n```", "execs": [{"kind": "run", "cmd": "sleep 1", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 5.8 Read the async reply\n\n```bash\nlogoscore call orchestrator_module asyncGreeting\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call orchestrator_module asyncGreeting", "status": "fail", "exit_code": 4, "output": "{\"code\":\"METHOD_FAILED\",\"message\":\"Call to orchestrator_module.asyncGreeting failed.\",\"status\":\"error\"}\n", "note": "exit code 4"}]}, {"md": "### 5.9 Subscribe to the greeter's event\n\n`subscribeGreeted()` registers a typed callback on `greeter_module`'s\n`greeted` event. Then `greeter_module.greetNotify(...)` makes the\ngreeter emit it, and `lastGreetedEvent()` reads what the subscription\ncaptured. Because the daemon keeps both modules loaded, the event fires\nbetween the calls:\n\n```bash\nlogoscore call orchestrator_module subscribeGreeted\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call orchestrator_module subscribeGreeted", "status": "fail", "exit_code": 4, "output": "{\"code\":\"RPC_FAILED\",\"message\":\"callModuleMethod('orchestrator_module','subscribeGreeted') RPC call failed.\",\"status\":\"error\"}\n", "note": "exit code 4"}]}, {"md": "### 5.10 Trigger the event from the greeter\n\n```bash\nlogoscore call greeter_module greetNotify Events\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call greeter_module greetNotify Events", "status <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
