  .exec { margin-bottom: 14px; }
  .exec:last-child { margin-bottom: 0; }
  .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }

x build 'github:logos-co/logos-package-manager#cli' -o lgpm", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-package-manager/8a6b72f28b1e73b6d753eaabe7eba13bf425f04e' into the Git cache...\nthis path will be fetched (422.7 KiB download, 1.1 MiB unpacked):\n  /nix/store/mvqb0zlmlynaql883w9229gxmahd9ixn-logos-package-manager-cli-1.0.0\ncopying path '/nix/store/mvqb0zlmlynaql883w9229gxmahd9ixn-logos-package-manager-cli-1.0.0' from 'https://logos-co.cachix.org'...\n", "note": ""}]}, {"md": "## Step 3: Build and install this wallet module\n\nBuild **this** wallet module's `.lgx` straight from its flake's `#lgx` output\nand install it into a local `./modules` directory with `lgpm`. Every module\nbuilt with\n[`logos-module-builder`](https://github.com/logos-co/logos-module-builder)\nexposes a ready-to-install `#lgx`.\n\n> The `` in the URL is what pins the build to a specific commit: the\n> doc-test runner expands it to a concrete ref. Locally that is this\n> checkout's `HEAD` (see `run.sh`); in CI it is the commit being tested. With\n> no pin it falls back to the latest `master`.", "execs": []}, {"md": "### 3.1 Build the module's .lgx\n\nBuild the `#lgx` output and link it as `./wallet-lgx`. (This compiles the\nmodule and its SDK dependencies through Nix, so the first build is slow.)\n\n```bash\n# From inside the clone this is simply: nix build '.#lgx'\nnix build 'github:logos-co/logos-wallet-module/26339364cb706bc56d71a76822f15cded743a60f#lgx' -o wallet-lgx\n```\n\nThe `.lgx` package is now under `./wallet-lgx/`:\n\n```bash\nls wallet-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-wallet-module/26339364cb706bc56d71a76822f15cded743a60f#lgx' -o wallet-lgx", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-wallet-module/26339364cb706bc56d71a76822f15cded743a60f' into the Git cache...\nunpacking 'github:logos-co/logos-module-builder/4f53bc34b884c5f1fc23021a7ffe4c381574994d?narHash=sha256-Dz2EnyIe5STjXevvmhTJz29VR5cGanwQwjHvvgi9iJg%3D' into the Git cache...\nunpacking 'github:logos-co/logos-cpp-sdk/d633575677a3d19a8bf1d5ff687398dace532938?narHash=sha256-wJ7Bv3TL754bZcTL2qilI0JahiVag7fLDzw8Y6Qz0pk%3D' into the Git cache...\nunpacking 'github:logos-co/logos-module/337223f2a72710d8052ca750510cd25d33e05047?narHash=sha256-Ugngv17u5CA3lOSNHN6nJ%2B/WpIyNn8yui0M2VDdkENk%3D' into the Git cache...\nunpacking 'github:logos-co/logos-plugin-qt/b30f00cbbcce8a979ddffb9ad18356d37a30d259?narHash=sha256-evfXNeRTneUl86IUMsIQfGrazoQlaJHElL7zfuesC/Y%3D' into the Git cache...\nunpacking 'github:logos-co/logos-standalone-app/f6e13eabd144b4cf87b533cce7318536cbd03123?narHash=sha256-HJfrILACOcdkhT8nvK7LvzcGor6uZv5IYbACkfHGv%2B0%3D' into the Git cache...\nunpacking 'github:logos-co/logos-design-system/75201e56002327864544b729ad0077bca7e5b03d?narHash=sha256-fXPDvB4VoS9k0oiW3CjN1w2cw9noqcloftXKMc8E0ng%3D' into the Git cache...\nunpacking 'github:logos-co/logos-test-framework/55b15075b5990b3c043030a3e404c7f11d57c32b?narHash=sha256-BnnrAjYJHW994WYAhd6e6/T7igLqJm4utjhqx1a6kLw%3D' into the Git cache...\nunpacking 'github:logos-co/nix-bundle-lgx/9d6f9016c865b9d2793672bc3c45a50b59753c78?narHash=sha256-ku5gG6qKIZeWzJ/jNOxfsx1rwJ3kPrCw8/wnBKq1Uyw%3D' into the Git cache...\nunpacking 'github:logos-co/logos-package/9e3730d5c0e3ec955761c05b50e3a6047ee4030b?narHash=sha256-toDnGXUthRcQm7vcEYzb2bLI7FE1tbfzH8Ie2Cnb9mk%3D' into the Git cache...\nunpacking 'github:logos-co/nix-bundle-dir/cd214dbf15487d80967389847ae2210468be6ebf?narHash=sha256-bpaTvz//R8WFP5xnnDLv3a9l7unDmBwJjCewx3wCjzM%3D' into the Git cache...\nunpacking 'github:logos-co/nix-bundle-logos-module-install/87afbb0241a6f7c1865a12f855dce63c68d1dd7f?narHash=sha256-osJph/UNShD8/i80ajUugizxJW0P4IEaZzSOsaSWCsI%3D' into the Git cache...\nunpacking 'github:logos-co/logos-package-manager/e5c25989861f4487c3dc8c7b3bc0062bcbc3221f?narHash=sha256-9LRXf/Wy500rNO9IhDSH%2BPSuadS3TguNFCbcbI4YYZU%3D' into the Git cache...\nunpacking 'github:logos-co/nix-bundle-appimage/7343f6df1ebab357f51f23dff0af9d7e468638cb?narHash=sha256-UEUlp3VRXBcj2YlOMTQdeW3qjyGJl2V3%2BGMf8IXwSWA%3D' into the Git cache...\nunpacking 'github:status-im/go-wallet-sdk/f6c0924394c5bdf361bd16b739a80432e68291f5?narHash=sha256-XUWdi2m9bOhHlwk8KTr/mVkwtRxutiQVX7en0QxbVJw%3D' into the Git cache...\nthis path will be fetched (5.7 MiB download, 5.7 MiB unpacked):\n  /nix/store/jvdfm2fmpi4cgp257z6pm6zz13j6rx8b-logos-wallet_module-module-lib-lgx-1.0.1\ncopying path '/nix/store/jvdfm2fmpi4cgp257z6pm6zz13j6rx8b-logos-wallet_module-module-lib-lgx-1.0.1' from 'https://logos-co.cachix.org'...\n", "note": ""}, {"kind": "run", "cmd": "ls wallet-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "wallet-lgx/logos-wallet_module-module-lib.lgx\n", "note": ""}]}, {"md": "### 3.2 Seed the modules directory with the bundled capability module\n\n`wallet_module` is loaded through the host's capability layer, so the\nmodules directory also needs the `capability_module` that ships with\n`logoscore`. Copy it across first.\n\n```bash\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n\n```", "execs": [{"kind": "run", "cmd": "mkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 3.3 Install the .lgx with lgpm\n\nInstall the freshly-built package into `./modules`. `wallet_module` is a\n`core` module, so it goes to `--modules-dir`. The package is unsigned (a\nlocal dev build), so we pass `--allow-unsigned`.\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file wallet-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file wallet-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "Installing from file: wallet-lgx/logos-wallet_module-module-lib.lgx... done\nInstalled to: ./modules\n", "note": ""}]}, {"md": "### 3.4 Confirm the install\n\nScan the directory and confirm the module landed:\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "status": "pass", "exit_code": 0, "output": "Found 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ncapability_module              1.0.0           core       security       \nwallet_module                  1.0.1           core       wallet         \n", "note": ""}]}, {"md": "## Step 4: Run the daemon and call the module\n\nStart `logoscore` in daemon mode pointed at `./modules`, then use the client\nsubcommands to load `wallet_module`, introspect it, and call several of its\noffline transaction helpers. Daemon output is captured in `logs.txt`.", "execs": []}, {"md": "### 4.1 Write a sample transaction\n\nThe transaction helpers take a JSON-encoded transaction. Write a minimal\nlegacy (EIP-155, chainId 1) transaction to `tx.json`; we pass it to the\nmethods below with logoscore's `@file` argument syntax.\n\n```json\n{\n  \"type\": \"0x0\",\n  \"nonce\": \"0x0\",\n  \"gasPrice\": \"0x3b9aca00\",\n  \"gas\": \"0x5208\",\n  \"to\": \"0x70997970c51812dc3a010c7d01b50e0d17dc79c8\",\n  \"value\": \"0x0\",\n  \"input\": \"0x\",\n  \"chainId\": \"0x1\",\n  \"v\": \"0x26\",\n  \"r\": \"0x1\",\n  \"s\": \"0x1\"\n}\n```", "execs": [{"kind": "file", "cmd": "write tx.json", "status": "pass", "note": "Wrote tx.json"}]}, {"md": "### 4.2 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands below connect to\nthis running process via the config written under `~/.logoscore/`.", "execs": [{"kind": "run", "cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "```bash\nsleep 3\n```", "execs": [{"kind": "run", "cmd": "sleep 3", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.3 Inspect the startup log\n\nReview the daemon's startup output:\n\n```bash\ncat logs.txt\n```", "execs": [{"kind": "run", "cmd": "cat logs.txt", "status": "pass", "exit_code": 0, "output": "[2026-06-16 21:33:46.300] [warning] Module capability_module carries no usable logos_protocol_version (pre-protocol build) \u2014 loading permissively\n[2026-06-16 21:33:46.615] [info] Module loaded: capability_module\nLogoscore daemon started (pid 4414, instance f13314be905f)\nDaemon state: /tmp/doctest-test-d2qgof2a/.logoscore/daemon/state.json\nLocal client config: /tmp/doctest-test-d2qgof2a/.logoscore/client/config.json\n", "note": ""}]}, {"md": "### 4.4 Check daemon status\n\nVerify the daemon is running:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"pid\":4414,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"wallet_module\",\"status\":\"not_loaded\"},{\"name\":\"capability_module\",\"status\":\"loaded\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":1,\"not_loaded\":1}}\n", "note": ""}]}, {"md": "### 4.5 List discovered modules\n\n`wallet_module` should be visible in the scan directory:\n\n```bash\nlogoscore list-modules\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore list-modules", "status": "pass", "exit_code": 0, "output": "[{\"name\":\"wallet_module\",\"status\":\"not_loaded\"},{\"name\":\"capability_module\",\"status\":\"loaded\"}]\n", "note": ""}]}, {"md": "### 4.6 Load the module\n\nLoad `wallet_module` into the running daemon:\n\n```bash\nlogoscore load-module wallet_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore load-module wallet_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies_loaded\":[],\"module\":\"wallet_module\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.7 Confirm the module is loaded\n\nRe-run `status`; the module that was `not_loaded` before now reports\n`loaded`:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"pid\":4414,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"wallet_module\",\"status\":\"loaded\"},{\"name\":\"capability_module\",\"status\":\"loaded\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":2,\"not_loaded\":0}}\n", "note": ""}]}, {"md": "### 4.8 Introspect the module with module-info\n\n`module-info` lists the `Q_INVOKABLE` methods the module exposes \u2014 the\nsame methods you can `call`:\n\n```bash\nlogoscore module-info wallet_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore module-info wallet_module", "status": "pass", "exit_code": 0, "output": "{\"events\":[],\"methods\":[{\"isInvokable\":true,\"name\":\"ethClientInit\",\"parameters\":[{\"name\":\"rpcUrl\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"ethClientInit(QString)\"},{\"isInvokable\":true,\"name\":\"ethClientClose\",\"parameters\":[{\"name\":\"rpcUrl\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"ethClientClose(QString)\"},{\"isInvokable\":true,\"name\":\"ethClientGetClients\",\"returnType\":\"QStringList\",\"signature\":\"ethClientGetClients()\"},{\"isInvokable\":true,\"name\":\"ethClientRpcCall\",\"parameters\":[{\"name\":\"rpcUrl\",\"type\":\"QString\"},{\"name\":\"method\",\"type\":\"QString\"},{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"ethClientRpcCall(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"ethClientChainId\",\"parameters\":[{\"name\":\"rpcUrl\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"ethClientChainId(QString)\"},{\"isInvokable\":true,\"name\":\"ethClientGetBalance\",\"parameters\":[{\"name\":\"rpcUrl\",\"type\":\"QString\"},{\"name\":\"address\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"ethClientGetBalance(QString,QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorTransferETH\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorTransferETH(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorTransferERC20\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorTransferERC20(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorApproveERC20\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorApproveERC20(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorTransferFromERC721\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorTransferFromERC721(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorSafeTransferFromERC721\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorSafeTransferFromERC721(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorApproveERC721\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorApproveERC721(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorSetApprovalForAllERC721\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorSetApprovalForAllERC721(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorTransferERC1155\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorTransferERC1155(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorBatchTransferERC1155\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorBatchTransferERC1155(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorSetApprovalForAllERC1155\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorSetApprovalForAllERC1155(QString)\"},{\"isInvokable\":true,\"name\":\"transactionJsonToRlp\",\"parameters\":[{\"name\":\"txJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"transactionJsonToRlp(QString)\"},{\"isInvokable\":true,\"name\":\"transactionRlpToJson\",\"parameters\":[{\"name\":\"rlpHex\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"transactionRlpToJson(QString)\"},{\"isInvokable\":true,\"name\":\"transactionGetHash\",\"parameters\":[{\"name\":\"txJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"transactionGetHash(QString)\"}],\"name\":\"wallet_module\",\"status\":\"loaded\"}\n", "note": ""}]}, {"md": "### 4.9 Hash a transaction\n\n`transactionGetHash` computes the hash of the transaction in `tx.json`.\nThe `@tx.json` argument tells logoscore to load the file's contents as the\nargument. The result is a real `0x\u2026` keccak hash from the go-wallet-sdk:\n\n```bash\nlogoscore call wallet_module transactionGetHash @tx.json\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call wallet_module transactionGetHash @tx.json", "status": "pass", "exit_code": 0, "output": "{\"method\":\"transactionGetHash\",\"module\":\"wallet_module\",\"result\":\"0xd1a53a05d3f0b7bfa3cf27870faf2d7f960008e554b2eb30489b168baa8642df\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.10 Encode the transaction to RLP\n\n`transactionJsonToRlp` serialises the transaction to its RLP hex\nencoding:\n\n```bash\nlogoscore call wallet_module transactionJsonToRlp @tx.json\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call wallet_module transactionJsonToRlp @tx.json", "status": "pass", "exit_code": 0, "output": "{\"method\":\"transactionJsonToRlp\",\"module\":\"wallet_module\",\"result\":\"0xe380843b9aca008252089470997970c51812dc3a010c7d01b50e0d17dc79c88080260101\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.11 Build an ETH transfer transaction\n\n`txGeneratorTransferETH` builds an unsigned ETH-transfer transaction from\na small JSON parameter object. Write the parameters to `transfer.json` and\npass them to the generator with `@transfer.json`:\n\n```json\n{\n  \"to\": \"0x70997970c51812dc3a010c7d01b50e0d17dc79c8\",\n  \"value\": \"1000000000000000000\",\n  \"nonce\": 0,\n  \"gasLimit\": 21000,\n  \"gasPrice\": \"1000000000\",\n  \"chainID\": \"1\"\n}\n```\n\n```bash\nlogoscore call wallet_module txGeneratorTransferETH @transfer.json\n```", "execs": [{"kind": "file", "cmd": "write transfer.json", "status": "pass", "note": "Wrote transfer.json"}]}, {"md": "### 4.12 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.13 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"f13314be905f\",\"status\":\"not_running\",\"version\":\"1.0\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}, {"meta": {"name": "Driving the Wallet UI Against This Module", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Driving the Wallet UI Against This Module\n\nThe companion to the [headless runtime doc-test](wallet-module-runtime.md):\ninstead of calling `wallet_module` through the `logoscore` daemon, this one\ndrives the real **[`logos-wallet-ui`](https://github.com/logos-co/logos-wallet-ui)**\ndesktop app against **this** commit of the module.\n\n`logos-wallet-ui` is a QML UI plugin built with\n[`logos-app-builder`](https://github.com/logos-co/logos-app-builder), so its\nflake exposes a standalone app (`apps.default`) that `nix run` launches in its\nown window with all backend module dependencies bundled and auto-loaded. The\nUI declares `wallet_module` as a flake input, so we build the app with an\n`--override-input` that points that input at the commit under test. The UI then\ntalks to **this** module over the Logos IPC bridge, exactly as it would in\n`logos-basecamp`.\n\nThe app is launched headless (`QT_QPA_PLATFORM=offscreen`) and driven through\nthe QML inspector via [`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp):\nwe wait for the UI to come up, point it at a public Base mainnet RPC\nendpoint, initialise an EthClient and ask the module for the chain ID \u2014 a real\n`eth_chainId` round-trip that must return `8453` \u2014 and capture screenshots that\nare embedded in the rendered tutorial and the CI report.\n\n**What you'll build:** The `logos-wallet-ui` standalone app, built against this `wallet_module` commit and driven headlessly through its QML UI.\n\n**What you'll learn:**\n\n- How a UI built with `logos-app-builder` exposes a standalone `nix run` app\n- How to override the UI's module input so it runs against a specific module commit\n- How to drive a headless Qt/QML app with logos-qt-mcp (wait, type, click, assert)\n- How to exercise a real module call end-to-end (init an EthClient, read the chain ID)\n- How to capture screenshots of the running UI for documentation and CI reports\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required.", "execs": []}, {"md": "## How the standalone UI app works\n\n`logos-wallet-ui` is a QML UI plugin (`wallet_ui`) that declares\n`wallet_module` as a dependency. Because it is built with\n`logos-app-builder`, its flake's `apps.default` is a self-contained desktop\napp:\n\n```\n+--------------------+   backend.getChainId(rpcUrl)         +-----------------+\n|     wallet_ui      | ----------------------------------->  |  wallet_module  |\n|  WalletView.qml    |   IPC (Logos API bridge)              |   C++ plugin    |\n+--------------------+                                       +-----------------+\n          ^                                                          ^\n          \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 bundled & launched by \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                          logos-app-builder standalone app\n```\n\nThe standalone app bundles `wallet_module` and loads it automatically at\nstartup. On launch the backend immediately calls `wallet_module` to set up\nits default EthClients; only when those calls succeed does the status reach\n**Ready** \u2014 so a Ready status is itself proof that the UI is talking to the\nmodule. By overriding the `wallet_module` input at build time we make that\nbackend **this** commit.", "execs": []}, {"md": "## Step 1: Clone the UI\n\nClone [`logos-wallet-ui`](https://github.com/logos-co/logos-wallet-ui). We\nclone over HTTPS so the step works in CI; over SSH the URL is\n`git@github.com:logos-co/logos-wallet-ui.git`.", "execs": []}, {"md": "### 1.1 git clone\n\n```bash\ngit clone --depth 1 https://github.com/logos-co/logos-wallet-ui.git\n```", "execs": [{"kind": "run", "cmd": "git clone --depth 1 https://github.com/logos-co/logos-wallet-ui.git", "status": "pass", "exit_code": 0, "output": "Cloning into 'logos-wallet-ui'...\n", "note": ""}]}, {"md": "## Step 2: Build the qt-mcp test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness the\ndoc-test uses to connect to the app's QML inspector and drive it. Build it\nonce and link it as `./result-mcp`.", "execs": []}, {"md": "### 2.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-qt-mcp' -o result-mcp\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-qt-mcp' -o result-mcp", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-qt-mcp/d87b65a0e9c836ed633453cb3998e02b179922ee' into the Git cache...\nthese 11 paths will be fetched (24.1 MiB download, 124.0 MiB unpacked):\n  /nix/store/ddx7976jyll30xjbasghv9jailswprcp-bash-interactive-5.3p3\n  /nix/store/083x1zrd8rnrkq1plphxvc2vdzgk8dvj-icu4c-76.1-dev\n  /nix/store/c829k68fsf2pz2hd4acar8plin4dn78z-libuv-1.51.0\n  /nix/store/r5sn5xvbjwr9c3xd56wl5ad06f6x1ggb-libuv-1.51.0-dev\n  /nix/store/4vn40pqpl3hx839x4arl6q67msnpalqj-logos-qt-mcp\n  /nix/store/6zdgga8jx741p46wmx8xyibwz3x3fps6-ncurses-6.5\n  /nix/store/r4557ald6zn4dzmvgh8na9vwnwzgrjgc-nodejs-22.19.0\n  /nix/store/qiir04g2blvd7nzw501v8h44w4qjyzj2-readline-8.3p1\n  /nix/store/gmwaym3dwkrb9987z8xg4njl2kmm2dvc-sqlite-3.50.2-bin\n  /nix/store/w3ibvzff0yrpg8abrl8n2fxn0d9fpfpc-sqlite-3.50.2-dev\n  /nix/store/29mcvdnd9s6sp46cjmqm0pfg4xs56rik-zlib-1.3.1-dev\ncopying path '/nix/store/083x1zrd8rnrkq1plphxvc2vdzgk8dvj-icu4c-76.1-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/c829k68fsf2pz2hd4acar8plin4dn78z-libuv-1.51.0' from 'https://cache.nixos.org'...\ncopying path '/nix/store/29mcvdnd9s6sp46cjmqm0pfg4xs56rik-zlib-1.3.1-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/6zdg <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }

  const sum = DATA.summary;

    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");

  });

      const long = out.split("\n").length > 12;

        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
</body>
</html>
