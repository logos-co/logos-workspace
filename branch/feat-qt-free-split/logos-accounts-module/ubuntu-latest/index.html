\n`lgpm` installs `.lgx` packages into a modules directory and scans what is\ninstalled. Build it from the `logos-package-manager` flake and link it as\n`./lgpm`.", "execs": []}, {"md": "### 2.1 Build lgpm\n\n```bash\nnix build 'github:logos-co/logos-package-manager#cli' -o lgpm\n```\n\nThe executable is at `./lgpm/bin/lgpm`.", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-package-manager/8a6b72f28b1e73b6d753eaabe7eba13bf425f04e' into the Git cache...\nthis path will be fetched (422.7 KiB download, 1.1 MiB unpacked):\n  /nix/store/mvqb0zlmlynaql883w9229gxmahd9ixn-logos-package-manager-cli-1.0.0\ncopying path '/nix/store/mvqb0zlmlynaql883w9229gxmahd9ixn-logos-package-manager-cli-1.0.0' from 'https://logos-co.cachix.org'...\n", "note": ""}]}, {"md": "## Step 3: Build and install this accounts module\n\nBuild **this** accounts module's `.lgx` straight from its flake's `#lgx`\noutput and install it into a local `./modules` directory with `lgpm`. Every\nmodule built with\n[`logos-module-builder`](https://github.com/logos-co/logos-module-builder)\nexposes a ready-to-install `#lgx`.\n\n> The `` in the URL is what pins the build to a specific commit: the\n> doc-test runner expands it to a concrete ref. Locally that is this\n> checkout's `HEAD` (see `run.sh`); in CI it is the commit being tested. With\n> no pin it falls back to the latest `master`.", "execs": []}, {"md": "### 3.1 Build the module's .lgx\n\nBuild the `#lgx` output and link it as `./accounts-lgx`. (This compiles\nthe module and its SDK dependencies through Nix, so the first build is\nslow.)\n\n```bash\n# From inside the clone this is simply: nix build '.#lgx'\nnix build 'github:logos-co/logos-accounts-module/f847190ffb8aedd0244104b3e3d218c1fde21138#lgx' -o accounts-lgx\n```\n\nThe `.lgx` package is now under `./accounts-lgx/`:\n\n```bash\nls accounts-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-accounts-module/f847190ffb8aedd0244104b3e3d218c1fde21138#lgx' -o accounts-lgx", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-accounts-module/f847190ffb8aedd0244104b3e3d218c1fde21138' into the Git cache...\nunpacking 'github:logos-co/logos-module-builder/d3616e8410320a2bddc39e56348c64e7dfffb918?narHash=sha256-VfvZW5efQtgt8QOJhS35btP6beG%2BE/UrnfP9YMRItEw%3D' into the Git cache...\nunpacking 'github:logos-co/logos-cpp-sdk/1468180b2567f4c59346bb94f74951e76341f5c5?narHash=sha256-HxkzOs2xv0grkNAJMBLXKDjVl8Z%2Bz3YFn%2BsC4eFKy/8%3D' into the Git cache...\nunpacking 'github:logos-co/logos-module/73cd9c4b2646dedb1b624a3178b32a7af1670047?narHash=sha256-PrVdkHNN2PPXoUEJoJUKv61t6IeQ3iQSRarIpFr9GHE%3D' into the Git cache...\nunpacking 'github:logos-co/logos-plugin-qt/78a04d603d910d864a26b158eca0882321258d44?narHash=sha256-RaJzt4sx6WrLtwhRhkGki/I%2BBvt8fuC%2Bp%2BoCcuLTm3g%3D' into the Git cache...\nunpacking 'github:logos-co/logos-module/337223f2a72710d8052ca750510cd25d33e05047?narHash=sha256-Ugngv17u5CA3lOSNHN6nJ%2B/WpIyNn8yui0M2VDdkENk%3D' into the Git cache...\nunpacking 'github:logos-co/logos-standalone-app/84d24c6a0d5c73bb81160e2a13de9995caa34c0f?narHash=sha256-2zQcNzbO3RnC8zZBB2y1s1ItZNwYzqgJjlevYjzKQHQ%3D' into the Git cache...\nunpacking 'github:logos-co/logos-cpp-sdk/2a21637e0238b4e629f4b707d13f0b803810cc7d?narHash=sha256-XrYR9l3YZSfX/f90Fsedzz3XZufWfP75OaJQnHIH29Q%3D' into the Git cache...\nunpacking 'github:logos-co/logos-design-system/75201e56002327864544b729ad0077bca7e5b03d?narHash=sha256-fXPDvB4VoS9k0oiW3CjN1w2cw9noqcloftXKMc8E0ng%3D' into the Git cache...\nunpacking 'github:logos-co/logos-test-framework/55b15075b5990b3c043030a3e404c7f11d57c32b?narHash=sha256-BnnrAjYJHW994WYAhd6e6/T7igLqJm4utjhqx1a6kLw%3D' into the Git cache...\nunpacking 'github:logos-co/nix-bundle-lgx/9d6f9016c865b9d2793672bc3c45a50b59753c78?narHash=sha256-ku5gG6qKIZeWzJ/jNOxfsx1rwJ3kPrCw8/wnBKq1Uyw%3D' into the Git cache...\nunpacking 'github:logos-co/logos-package/9e3730d5c0e3ec955761c05b50e3a6047ee4030b?narHash=sha256-toDnGXUthRcQm7vcEYzb2bLI7FE1tbfzH8Ie2Cnb9mk%3D' into the Git cache...\nunpacking 'github:logos-co/nix-bundle-dir/cd214dbf15487d80967389847ae2210468be6ebf?narHash=sha256-bpaTvz//R8WFP5xnnDLv3a9l7unDmBwJjCewx3wCjzM%3D' into the Git cache...\nunpacking 'github:status-im/go-wallet-sdk/0938a704506b0ff444378045d17be9e19e699d80?narHash=sha256-2bi2c7EOh/94/0MLcXqtaVBWOixXXYwmZ8CLdcOF99E%3D' into the Git cache...\nthis path will be fetched (5.8 MiB download, 5.8 MiB unpacked):\n  /nix/store/mrhkrkhjpsp3jc0k9d7j6n3d45p34lig-logos-accounts_module-module-lib-lgx-1.0.0\ncopying path '/nix/store/mrhkrkhjpsp3jc0k9d7j6n3d45p34lig-logos-accounts_module-module-lib-lgx-1.0.0' from 'https://logos-co.cachix.org'...\n", "note": ""}, {"kind": "run", "cmd": "ls accounts-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "accounts-lgx/logos-accounts_module-module-lib.lgx\n", "note": ""}]}, {"md": "### 3.2 Seed the modules directory with the bundled capability module\n\n`accounts_module` is loaded through the host's capability layer, so the\nmodules directory also needs the `capability_module` that ships with\n`logoscore`. Copy it across first.\n\n```bash\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n\n```", "execs": [{"kind": "run", "cmd": "mkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 3.3 Install the .lgx with lgpm\n\nInstall the freshly-built package into `./modules`. `accounts_module` is\na `core` module, so it goes to `--modules-dir`. The package is unsigned\n(a local dev build), so we pass `--allow-unsigned`.\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file accounts-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file accounts-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "Installing from file: accounts-lgx/logos-accounts_module-module-lib.lgx... done\nInstalled to: ./modules\n", "note": ""}]}, {"md": "### 3.4 Confirm the install\n\nScan the directory and confirm the module landed:\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "status": "pass", "exit_code": 0, "output": "Found 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\naccounts_module                1.0.0           core       accounts       \ncapability_module              1.0.0           core       security       \n", "note": ""}]}, {"md": "## Step 4: Run the daemon and call the module\n\nStart `logoscore` in daemon mode pointed at `./modules`, then use the client\nsubcommands to load `accounts_module`, introspect it, and call several of its\nmethods. Daemon output is captured in `logs.txt`.", "execs": []}, {"md": "### 4.1 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands below connect to\nthis running process via the config written under `~/.logoscore/`.", "execs": [{"kind": "run", "cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "```bash\nsleep 3\n```", "execs": [{"kind": "run", "cmd": "sleep 3", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.2 Inspect the startup log\n\nReview the daemon's startup output:\n\n```bash\ncat logs.txt\n```", "execs": [{"kind": "run", "cmd": "cat logs.txt", "status": "pass", "exit_code": 0, "output": "[2026-06-12 14:14:27.548] [info] Module loaded: capability_module\nLogoscore daemon started (pid 4363, instance 2c50438c5283)\nDaemon state: /home/runner/.logoscore/daemon/state.json\nLocal client config: /home/runner/.logoscore/client/config.json\n", "note": ""}]}, {"md": "### 4.3 Check daemon status\n\nVerify the daemon is running:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"pid\":4363,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"capability_module\",\"status\":\"loaded\"},{\"name\":\"accounts_module\",\"status\":\"not_loaded\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":1,\"not_loaded\":1}}\n", "note": ""}]}, {"md": "### 4.4 List discovered modules\n\n`accounts_module` should be visible in the scan directory:\n\n```bash\nlogoscore list-modules\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore list-modules", "status": "pass", "exit_code": 0, "output": "[{\"name\":\"capability_module\",\"status\":\"loaded\"},{\"name\":\"accounts_module\",\"status\":\"not_loaded\"}]\n", "note": ""}]}, {"md": "### 4.5 Load the module\n\nLoad `accounts_module` into the running daemon:\n\n```bash\nlogoscore load-module accounts_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore load-module accounts_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies_loaded\":[],\"module\":\"accounts_module\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.6 Confirm the module is loaded\n\nRe-run `status`; the module that was `not_loaded` before now reports\n`loaded`:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"pid\":4363,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"capability_module\",\"status\":\"loaded\"},{\"name\":\"accounts_module\",\"status\":\"loaded\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":2,\"not_loaded\":0}}\n", "note": ""}]}, {"md": "### 4.7 Introspect the module with module-info\n\n`module-info` lists the `Q_INVOKABLE` methods the module exposes \u2014 the\nsame methods you can `call`:\n\n```bash\nlogoscore module-info accounts_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore module-info accounts_module", "status": "pass", "exit_code": 0, "output": "{\"events\":[],\"methods\":[{\"isInvokable\":true,\"name\":\"initKeystore\",\"parameters\":[{\"name\":\"dir\",\"type\":\"QString\"},{\"name\":\"scryptN\",\"type\":\"int\"},{\"name\":\"scryptP\",\"type\":\"int\"}],\"returnType\":\"bool\",\"signature\":\"initKeystore(QString,int,int)\"},{\"isInvokable\":true,\"name\":\"closeKeystore\",\"parameters\":[{\"name\":\"privateKey\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"closeKeystore(QString)\"},{\"isInvokable\":true,\"name\":\"keystoreAccounts\",\"returnType\":\"QStringList\",\"signature\":\"keystoreAccounts()\"},{\"isInvokable\":true,\"name\":\"keystoreNewAccount\",\"parameters\":[{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"keystoreNewAccount(QString)\"},{\"isInvokable\":true,\"name\":\"keystoreImport\",\"parameters\":[{\"name\":\"keyJSON\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"},{\"name\":\"newPassphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"keystoreImport(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"keystoreExport\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"},{\"name\":\"newPassphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"keystoreExport(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"keystoreDelete\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"keystoreDelete(QString,QString)\"},{\"isInvokable\":true,\"name\":\"keystoreHasAddress\",\"parameters\":[{\"name\":\"address\",\"type\": ssphrase(QString,QString,int,QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeystoreFind\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"url\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeystoreFind(QString,QString)\"},{\"isInvokable\":true,\"name\":\"createExtKeyFromMnemonic\",\"parameters\":[{\"name\":\"phrase\",\"type\":\"QString\"},{\"name\":\"passphrase\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"createExtKeyFromMnemonic(QString,QString)\"},{\"isInvokable\":true,\"name\":\"deriveExtKey\",\"parameters\":[{\"name\":\"extKeyStr\",\"type\":\"QString\"},{\"name\":\"pathStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"deriveExtKey(QString,QString)\"},{\"isInvokable\":true,\"name\":\"extKeyToECDSA\",\"parameters\":[{\"name\":\"extKeyStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"extKeyToECDSA(QString)\"},{\"isInvokable\":true,\"name\":\"ecdsaToPublicKey\",\"parameters\":[{\"name\":\"privateKeyECDSAStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"ecdsaToPublicKey(QString)\"},{\"isInvokable\":true,\"name\":\"publicKeyToAddress\",\"parameters\":[{\"name\":\"publicKeyStr\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"publicKeyToAddress(QString)\"},{\"isInvokable\":true,\"name\":\"createRandomMnemonic\",\"parameters\":[{\"name\":\"length\",\"type\":\"int\"}],\"returnType\":\"QString\",\"signature\":\"createRandomMnemonic(int)\"},{\"isInvokable\":true,\"name\":\"createRandomMnemonicWithDefaultLength\",\"returnType\":\"QString\",\"signature\":\"createRandomMnemonicWithDefaultLength()\"},{\"isInvokable\":true,\"name\":\"lengthToEntropyStrength\",\"parameters\":[{\"name\":\"length\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"lengthToEntropyStrength(int)\"}],\"name\":\"accounts_module\",\"status\":\"loaded\"}\n", "note": ""}]}, {"md": "### 4.8 Generate a random mnemonic\n\n`createRandomMnemonic` takes a word count and returns a fresh BIP-39\nphrase \u2014 a real round-trip through the go-wallet-sdk C library wrapped by\nthe module, dispatched over liblogos' IPC:\n\n```bash\nlogoscore call accounts_module createRandomMnemonic 12\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module createRandomMnemonic 12", "status": "pass", "exit_code": 0, "output": "{\"method\":\"createRandomMnemonic\",\"module\":\"accounts_module\",\"result\":\"column stomach luggage panic inhale indicate fire angle vendor best useful exhaust\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.9 Generate a default-length mnemonic\n\n`createRandomMnemonicWithDefaultLength` takes no arguments and returns a\nphrase of the SDK's default length:\n\n```bash\nlogoscore call accounts_module createRandomMnemonicWithDefaultLength\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module createRandomMnemonicWithDefaultLength", "status": "pass", "exit_code": 0, "output": "{\"method\":\"createRandomMnemonicWithDefaultLength\",\"module\":\"accounts_module\",\"result\":\"term sound theme denial dance exhibit chase nose leaf street extra later\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.10 Map a word count to entropy strength\n\n`lengthToEntropyStrength` maps a mnemonic word count to its entropy\nstrength in bits \u2014 12 words is 128 bits. This exercises an `int`\nround-trip:\n\n```bash\nlogoscore call accounts_module lengthToEntropyStrength 12\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module lengthToEntropyStrength 12", "status": "pass", "exit_code": 0, "output": "{\"method\":\"lengthToEntropyStrength\",\"module\":\"accounts_module\",\"result\":128,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nlogoscore call accounts_module lengthToEntropyStrength 24\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module lengthToEntropyStrength 24", "status": "pass", "exit_code": 0, "output": "{\"method\":\"lengthToEntropyStrength\",\"module\":\"accounts_module\",\"result\":256,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.11 Create and use a keystore\n\nInitialise a keystore in a fresh directory (`scryptN`=4096, `scryptP`=6\nkeep the test fast), then create a new account in it. `keystoreNewAccount`\nreturns the new account's address:\n\n```bash\nlogoscore call accounts_module initKeystore ./ks 4096 6\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module initKeystore ./ks 4096 6", "status": "pass", "exit_code": 0, "output": "{\"method\":\"initKeystore\",\"module\":\"accounts_module\",\"result\":true,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nlogoscore call accounts_module keystoreNewAccount test-passphrase\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module keystoreNewAccount test-passphrase", "status": "pass", "exit_code": 0, "output": "{\"method\":\"keystoreNewAccount\",\"module\":\"accounts_module\",\"result\":\"{\\\"address\\\":\\\"0x6a81a793EE1Af0E3947F1aA75860Ec7275455d0b\\\",\\\"url\\\":\\\"keystore:///tmp/doctest-test-dzp5qq3l/ks/UTC--2026-06-12T14-14-30.507912151Z--6a81a793ee1af0e3947f1aa75860ec7275455d0b\\\"}\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.12 List the keystore's accounts\n\n`keystoreAccounts` returns the accounts now present in the keystore \u2014 the\none we just created:\n\n```bash\nlogoscore call accounts_module keystoreAccounts\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module keystoreAccounts", "status": "pass", "exit_code": 0, "output": "{\"method\":\"keystoreAccounts\",\"module\":\"accounts_module\",\"result\":[\"{\\\"address\\\":\\\"0x6a81a793EE1Af0E3947F1aA75860Ec7275455d0b\\\",\\\"url\\\":\\\"keystore:///tmp/doctest-test-dzp5qq3l/ks/UTC--2026-06-12T14-14-30.507912151Z--6a81a793ee1af0e3947f1aa75860ec7275455d0b\\\"}\"],\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.13 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.14 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"2c50438c5283\",\"status\":\"not_running\",\"version\":\"1.0\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}, {"meta": {"name": "Driving the Accounts UI Against This Module", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Driving the Accounts UI Against This Module\n\nThe companion to the [headless runtime doc-test](accounts-module-runtime.md):\ninstead of calling `accounts_module` through the `logoscore` daemon, this one\ndrives the real **[`logos-accounts-ui`](https://github.com/logos-co/logos-accounts-ui)**\ndesktop app against **this** commit of the module.\n\n`logos-accounts-ui` is a QML UI plugin built with\n[`logos-app-builder`](https://github.com/logos-co/logos-app-builder), so its\nflake exposes a standalone app (`apps.default`) that `nix run` launches in its\nown window with all backend module dependencies bundled and auto-loaded. The\nUI declares `accounts_module` as a flake input, so we build the app with an\n`--override-input` that points that input at the commit under test. The UI then\ntalks to **this** module over the Logos IPC bridge, exactly as it would in\n`logos-basecamp`.\n\nThe app is launched headless (`QT_QPA_PLATFORM=offscreen`) and driven through\nthe QML inspector via [`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp):\nwe wait for elements to appear, type into inputs, click buttons, assert on the\nresults the module returns, and capture screenshots that are embedded in the\nrendered tutorial and the CI report.\n\n**What you'll build:** The `logos-accounts-ui` standalone app, built against this `accounts_module` commit and driven headlessly through its QML UI.\n\n**What you'll learn:**\n\n- How a UI built with `logos-app-builder` exposes a standalone `nix run` app\n- How to override the UI's module input so it runs against a specific module commit\n- How to drive a headless Qt/QML app with logos-qt-mcp (wait, type, click, assert)\n- How to capture screenshots of the running UI for documentation and CI reports\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required.", "execs": []}, {"md": "## How the standalone UI app works\n\n`logos-accounts-ui` is a QML UI plugin (`accounts_ui`) that declares\n`accounts_module` as a dependency. Because it is built with\n`logos-app-builder`, its flake's `apps.default` is a self-contained desktop\napp:\n\n```\n+----------------------+   backend.createRandomMnemonic()   +-------------------+\n|     accounts_ui      | --------------------------------->  |  accounts_module  |\n|  AccountsView.qml    |   IPC (Logos API bridge)            |   C++ plugin      |\n+----------------------+                                     +-------------------+\n           ^                                                          ^\n           \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 bundled & launched by \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                           logos-app-builder standalone app\n```\n\nThe standalone app bundles every module dependency (here `accounts_module`)\nand loads it automatically at startup \u2014 so when the QML calls\n`backend.lengthToEntropyStrength(12)`, the call travels over the Logos bridge\nto the real module and comes back with `128`. By overriding the\n`accounts_module` input at build time we make that backend **this** commit.", "execs": []}, {"md": "## Step 1: Clone the UI\n\nClone [`logos-accounts-ui`](https://github.com/logos-co/logos-accounts-ui).\nWe clone over HTTPS so the step works in CI; over SSH the URL is\n`git@github.com:logos-co/logos-accounts-ui.git`.", "execs": []}, {"md": "### 1.1 git clone\n\n```bash\ngit clone --depth 1 https://github.com/logos-co/logos-accounts-ui.git\n```", "execs": [{"kind": "run", "cmd": "git clone --depth 1 https://github.com/logos-co/logos-accounts-ui.git", "status": "pass", "exit_code": 0, "output": "Cloning into 'logos-accounts-ui'...\n", "note": ""}]}, {"md": "## Step 2: Build the qt-mcp test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness the\ndoc-test uses to connect to the app's QML inspector and drive it. Build it\nonce and link it as `./result-mcp`.", "execs": []}, {"md": "### 2.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-qt-mcp' -o result-mcp\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-qt-mcp' -o result-mcp", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-qt-mcp/369bab6f4f23ac6175a7f93139cbfacc3ab0fcdb' into the Git cache...\nthese 11 paths will be fetched (24.1 MiB download, 124.0 MiB unpacked):\n  /nix/store/ddx7976jyll30xjbasghv9jailswprcp-bash-intera <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
