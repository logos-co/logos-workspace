ods \u2014 verifying real values round-trip\n   out of the Rust code over liblogos' IPC.\n\nA green run is real evidence that the Rust-module build pipeline (cargo \u2192\nstatic archive \u2192 `c-ffi` codegen \u2192 Qt plugin \u2192 loadable module) works and that\nthe module is callable through a real `logoscore` daemon.\n\n**What you'll build:** A `rust_provider_module` whose logic is pure Rust, packaged as `.lgx`, installed with `lgpm`, and called through a `logoscore` daemon.\n\n**What you'll learn:**\n\n- How to write a Logos module whose implementation is pure Rust (no C++)\n- How the `c-ffi` interface generates the Qt plugin glue from a C header\n- How a module's flake compiles the Rust `staticlib` in `preConfigure` and exposes a ready-to-install `.lgx`\n- How to install an `.lgx` into a modules directory with `lgpm`\n- How to start the `logoscore` daemon, load the module, introspect it, and call its methods\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine.** Nix provides the Rust toolchain (cargo, rustc) during the build, so you don't need a separate Rust install.", "execs": []}, {"md": "## Step 1: Build logoscore\n\nBuild the `logoscore` CLI from its published flake. The result is symlinked\nto `./logos/`. `logoscore` is the headless frontend for `logos-liblogos`, so\nthis one build brings in the whole module-runtime stack the daemon needs.", "execs": []}, {"md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli' --out-link ./logos\n```\n\nThe build produces `logos/bin/logoscore` plus bundled runtime libraries\nand a `logos/modules/` directory containing the built-in\n`capability_module` (required for the auth handshake when ng path '/nix/store/9kyzp181869cwhk7b47wpvlmi6vi17fa-logos-liblogos-build-0.1.0' from 'https://logos-co.cachix.org'...\ncopying path '/nix/store/jvm81w0xd2svlpsjzjy4h45fi32bapfk-logos-liblogos-modules-0.1.0' from 'https://logos-co.cachix.org'...\ncopying path '/nix/store/0b200q70l2g21q8lwd0wpafnhpbddif0-logos-liblogos-bin-0.1.0' from 'https://logos-co.cachix.org'...\ncopying path '/nix/store/69gl9xymib3bvkfkv26hw4n964iym90j-logos-liblogos' from 'https://logos-co.cachix.org'...\ncopying path '/nix/store/xpszj8k7k2sc19mmpfnakra107k76431-logos-logoscore-cli-bin-0.1.0' from 'https://logos-co.cachix.org'...\ncopying path '/nix/store/nagbsyhgkm470kkwi3n1f9kh3n46dc0r-logos-logoscore-cli' from 'https://logos-co.cachix.org'...\n", "note": ""}]}, {"md": "## Step 2: Build the lgpm package manager\n\n`lgpm` installs `.lgx` packages into a modules directory and scans what is\ninstalled. Build it from the `logos-package-manager` flake and link it as\n`./lgpm`.", "execs": []}, {"md": "### 2.1 Build lgpm\n\n```bash\nnix build 'github:logos-co/logos-package-manager#cli' -o lgpm\n```\n\nThe executable is at `./lgpm/bin/lgpm`.", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-package-manager/8a6b72f28b1e73b6d753eaabe7eba13bf425f04e' into the Git cache...\nthis path will be fetched (422.7 KiB download, 1.1 MiB unpacked):\n  /nix/store/mvqb0zlmlynaql883w9229gxmahd9ixn-logos-package-manager-cli-1.0.0\ncopying path '/nix/store/mvqb0zlmlynaql883w9229gxmahd9ixn-logos-package-manager-cli-1.0.0' from 'https://logos-co.cachix.org'...\n", "note": ""}]}, {"md": "## Step 3: Write the Rust library\n\nThe module's logic lives in a small Rust crate compiled to a **static\narchive** (`crate-type = [\"staticlib\"]`). Each public function is declared\n`#[no_mangle] pub extern \"C\"` so it is exported with a stable C symbol the\nLogos build can link against and generate glue for.\n\nLay the crate out under `rust-lib/`:\n\n```\nrust-provider-module/\n\u251c\u2500\u2500 flake.nix                 # Nix build (compiles the crate, wraps it as a module)\n\u251c\u2500\u2500 metadata.json             # Module metadata + c-ffi codegen config\n\u251c\u2500\u2500 CMakeLists.txt            # Links the static archive into the plugin\n\u2514\u2500\u2500 rust-lib/\n    \u251c\u2500\u2500 Cargo.toml            # crate-type = [\"staticlib\"]\n    \u251c\u2500\u2500 src/lib.rs            # the Rust functions\n    \u2514\u2500\u2500 include/\n        \u2514\u2500\u2500 rust_provider.h   # C header the codegen reads\n```", "execs": []}, {"md": "### 3.1 Create the crate manifest\n\nCreate `rust-lib/Cargo.toml`. The crate compiles to a static archive with no dependencies:\n\n```toml\n[package]\nname = \"rust_provider\"\nversion = \"1.0.0\"\nedition = \"2021\"\n\n[lib]\ncrate-type = [\"staticlib\"]\n```", "execs": [{"kind": "file", "cmd": "write rust-lib/Cargo.toml", "status": "pass", "note": "Wrote rust-lib/Cargo.toml"}]}, {"md": "### 3.2 Write the Rust functions\n\nCreate `rust-lib/src/lib.rs`. Every exported function uses\n`#[no_mangle] pub extern \"C\"` so it lands in the static archive with a\npredictable C symbol. Integers are `i64` (the type the codegen maps onto\nthe wire), and the one string-returning function (`greet`) hands back a\nheap C string with a matching free function:\n\n```rust\nuse std::ffi::{CStr, CString};\nuse std::os::raw::c_char;\n\n/// Add two integers.\n#[no_mangle]\npub extern \"C\" fn rust_provider_add(a: i64, b: i64) -> i64 {\n    a + b\n}\n\n/// Multiply two integers (saturating on overflow).\n#[no_mangle]\npub extern \"C\" fn rust_provider_multiply(a: i64, b: i64) -> i64 {\n    a.saturating_mul(b)\n}\n\n/// Compute n! (factorial). Returns -1 on overflow or negative input.\n#[no_mangle]\npub extern \"C\" fn rust_provider_factorial(n: i64) -> i64 {\n    if n < 0 {\n        return -1;\n    }\n    if n <= 1 {\n        return 1;\n    }\n    let mut result: i64 = 1;\n    for i in 2..=n {\n        result = match result.checked_mul(i) {\n            Some(v) => v,\n            None => return -1,\n        };\n    }\n    result\n}\n\n/// Compute the nth Fibonacci number. Returns -1 on overflow or negative input.\n#[no_mangle]\npub extern \"C\" fn rust_provider_fibonacci(n: i64) -> i64 {\n    if n < 0 {\n        return -1;\n    }\n    if n == 0 {\n        return 0;\n    }\n    if n == 1 {\n        return 1;\n    }\n    let (mut a, mut b) = (0i64, 1i64);\n    for _ in 2..=n {\n        let next = match a.checked_add(b) {\n            Some(v) => v,\n            None => return -1,\n        };\n        a = b;\n        b = next;\n    }\n    b\n}\n\n/// Return 1 if n is prime, 0 otherwise.\n#[no_mangle]\npub extern \"C\" fn rust_provider_is_prime(n: i64) -> i64 {\n    if n < 2 {\n        return 0;\n    }\n    if n == 2 {\n        return 1;\n    }\n    if n % 2 == 0 {\n        return 0;\n    }\n    let mut i = 3i64;\n    while i * i <= n {\n        if n % i == 0 {\n            return 0;\n        }\n        i += 2;\n    }\n    1\n}\n\n/// Greet the given name. Returns a heap-allocated C string.\n/// The caller must free the returned pointer with rust_provider_free_string().\n#[no_mangle]\npub extern \"C\" fn rust_provider_greet(name: *const c_char) -> *mut c_char {\n    let name_str = if name.is_null() {\n        \"World\".to_string()\n    } else {\n        unsafe { CStr::from_ptr(name) }\n            .to_str()\n            .unwrap_or(\"World\")\n            .to_string()\n    };\n    let greeting = format!(\"Hello, {}! (from Rust provider)\", name_str);\n    CString::new(greeting)\n        .unwrap_or_else(|_| CString::new(\"Hello! (from Rust provider)\").unwrap())\n        .into_raw()\n}\n\n/// Free a string previously returned by rust_provider_greet().\n#[no_mangle]\npub extern \"C\" fn rust_provider_free_string(ptr: *mut c_char) {\n    if ptr.is_null() {\n        return;\n    }\n    unsafe {\n        drop(CString::from_raw(ptr));\n    }\n}\n\n/// Return the provider library version string. Static \u2014 do NOT free.\n#[no_mangle]\npub extern \"C\" fn rust_provider_version() -> *const c_char {\n    b\"1.0.0\\0\".as_ptr() as *const c_char\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_add() {\n        assert_eq!(rust_provider_add(2, 3), 5);\n    }\n\n    #[test]\n    fn test_factorial() {\n        assert_eq!(rust_provider_factorial(5), 120);\n    }\n\n    #[test]\n    fn test_is_prime() {\n        assert_eq!(rust_provider_is_prime(7), 1);\n        assert_eq!(rust_provider_is_prime(4), 0);\n    }\n}\n```", "execs": [{"kind": "file", "cmd": "write rust-lib/src/lib.rs", "status": "pass", "note": "Wrote rust-lib/src/lib.rs"}]}, {"md": "### 3.3 Write the C header\n\nCreate `rust-lib/include/rust_provider.h`. This is the **source of truth\nfor the module's IPC API**: the `c-ffi` codegen reads it to discover the\nexported functions and their signatures, then generates a Qt plugin that\ndispatches IPC calls to them. The signatures must match the Rust\n`extern \"C\"` functions exactly.\n\n```c\n#ifndef RUST_PROVIDER_H\n#define RUST_PROVIDER_H\n\n#include <stdint.h>\n\n#ifdef __cplusplus\nextern \"C\" {\n#endif\n\n/** Add two integers. */\nint64_t rust_provider_add(int64_t a, int64_t b);\n\n/** Multiply two integers (saturating on overflow). */\nint64_t rust_provider_multiply(int64_t a, int64_t b);\n\n/** Compute n! (factorial). Returns -1 on overflow or negative input. */\nint64_t rust_provider_factorial(int64_t n);\n\n/** Compute the nth Fibonacci number. Returns -1 on overflow or negative input. */\nint64_t rust_provider_fibonacci(int64_t n);\n\n/** Return 1 if n is prime, 0 otherwise. */\nint64_t rust_provider_is_prime(int64_t n);\n\n/**\n * Greet the given name.\n * Returns a heap-allocated C string that must be freed with rust_provider_free_string().\n * Passing NULL uses \"World\" as the name.\n */\nchar* rust_provider_greet(const char* name);\n\n/** Free a string returned by rust_provider_greet(). */\nvoid rust_provider_free_string(char* ptr);\n\n/** Return the Rust library version string (static, do not free). */\nconst char* rust_provider_version(void);\n\n#ifdef __cplusplus\n}\n#endif\n\n#endif /* RUST_PROVIDER_H */\n```\n\nThe codegen derives each IPC method name by stripping the module's name\nstem (`rust_provider_`) from the C function name. So `rust_provider_add`\nis callable as `add`, `rust_provider_is_prime` as `is_prime`, and so on \u2014\nthe remaining name keeps its `snake_case` form.\n\n> **One exception:** the version accessor `rust_provider_version` is\n> exposed as `libVersion()` (the codegen's conventional name for a\n> module's version method), not `version`. You'll call it as `libVersion`\n> below. The pair `rust_provider_free_string` / the `*const c_char`\n> plumbing behind `greet` are handled internally by the generated glue \u2014\n> you call `greet` and get a string back.", "execs": [{"kind": "file", "cmd": "write rust-lib/include/rust_provider.h", "status": "pass", "note": "Wrote rust-lib/include/rust_provider.h"}]}, {"md": "## Step 4: Configure the Logos module\n\nThree small config files turn the Rust crate into a Logos module:\n`metadata.json` (declares the module and points the codegen at the header),\n`CMakeLists.txt` (links the static archive into the generated plugin), and\n`flake.nix` (compiles the crate and drives `mkLogosModule`).", "execs": []}, {"md": "### 4.1 `metadata.json` \u2014 module + codegen config\n\n`interface: \"c-ffi\"` selects the C-header-driven codegen, and\n`codegen.c_header` points at the header you wrote. `nix.packages.build`\nlists `cargo` and `rustc` so the Rust toolchain is available during the\nbuild.\n\n```json\n{\n  \"name\": \"rust_provider_module\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Example Logos module with logic implemented in pure Rust \u2014 provides math operations callable by other modules\",\n  \"author\": \"Logos Core Team\",\n  \"type\": \"core\",\n  \"interface\": \"c-ffi\",\n  \"category\": \"general\",\n  \"main\": \"rust_provider_module_plugin\",\n  \"dependencies\": [],\n  \"include\": [],\n  \"capabilities\": [],\n\n  \"codegen\": {\n    \"c_header\": \"lib/rust_provider.h\"\n  },\n\n  \"nix\": {\n    \"external_libraries\": [],\n    \"packages\": {\n      \"build\": [\"cargo\", \"rustc\"],\n      \"runtime\": []\n    },\n    \"cmake\": {\n      \"find_packages\": [],\n      \"extra_include_dirs\": [\"lib\"]\n    }\n  }\n}\n```\n\nNote `codegen.c_header` is `lib/rust_provider.h`, not\n`rust-lib/include/rust_provider.h`: the `flake.nix` `preConfigure` step\n(below) stages the compiled archive and the header into a `lib/`\ndirectory before the build configures, so by the time the codegen runs\nthe header lives at `lib/rust_provider.h`.", "execs": [{"kind": "file", "cmd": "write metadata.json", "status": "pass", "note": "Wrote metadata.json"}]}, {"md": "### 4.2 `CMakeLists.txt` \u2014 link the Rust archive\n\n`logos_module()` (from `logos-module-builder`) defines the plugin target.\nYou then locate the Rust static archive in `lib/` and link it \u2014 plus the\nplatform system libraries the Rust standard library needs.\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(RustProviderModulePlugin LANGUAGES CXX)\n\nif(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})\n    include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\nelse()\n    message(FATAL_ERROR \"LogosModule.cmake not found. LOGOS_MODULE_BUILDER_ROOT is not set.\")\nendif()\n\nconfigure_file(${CMAKE_CURRENT_SOURCE_DIR}/metadata.json\n               ${CMAKE_CURRENT_BINARY_DIR}/metadata.json COPYONLY)\n\nlogos_module(\n    NAME rust_provider_module\n    INCLUDE_DIRS\n        ${CMAKE_CURRENT_SOURCE_DIR}/lib\n)\n\nfind_library(LIBRUST_PROVIDER\n    NAMES librust_provider.a rust_provider\n    PATHS ${CMAKE_CURRENT_SOURCE_DIR}/lib\n    NO_DEFAULT_PATH\n)\n\nif(NOT LIBRUST_PROVIDER)\n    message(FATAL_ERROR\n        \"Rust static library (librust_provider.a) not found in ${CMAKE_CURRENT_SOURCE_DIR}/lib. \"\n        \"Ensure the preConfigure hook ran 'cargo build --release'.\"\n    )\nendif()\n\nmessage(STATUS \"Found Rust provider static library: ${LIBRUST_PROVIDER}\")\ntarget_link_libraries(rust_provider_module_module_plugin PRIVATE ${LIBRUST_PROVIDER})\n\nif(APPLE)\n    target_link_libraries(rust_provider_module_module_plugin PRIVATE\n        \"-framework CoreFoundation\"\n        \"-framework Security\"\n    )\nelse()\n    target_link_libraries(rust_provider_module_module_plugin PRIVATE pthread dl)\nendif()\n```\n\n> **The target name is `rust_provider_module_module_plugin`** \u2014 that's\n> `<module-name>_module_plugin` as produced by `logos_module()`. It looks\n> doubled because the module name already ends in `_module`.", "execs": [{"kind": "file", "cmd": "write CMakeLists.txt", "status": "pass", "note": "Wrote CMakeLists.txt"}]}, {"md": "### 4.3 `flake.nix` \u2014 compile the crate and build the module\n\nThe flake pins `logos-module-builder` and `logos-cpp-sdk` to the `c_ffi`\nbranch (where the `c-ffi` interface lives). The `preConfigure` hook\ncompiles the Rust crate offline and stages the archive + header into\n`lib/` so CMake and the codegen can find them.\n\n```nix\n{\n  description = \"Example Logos module with logic implemented in pure Rust\";\n\n  inputs = {\n    logos-module-builder.url = \"github:logos-co/logos-module-builder/c_ffi\";\n    logos-module-builder.inputs.logos-cpp-sdk.url = \"github:logos-co/logos-cpp-sdk/c_ffi\";\n  };\n\n  outputs = inputs@{ logos-module-builder, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n      preConfigure = ''\n        echo \"=== Building Rust provider library ===\"\n        export HOME=$TMPDIR\n        export CARGO_HOME=$TMPDIR/cargo\n        mkdir -p $CARGO_HOME\n\n        pushd rust-lib\n        cargo build --release --offline\n        popd\n\n        mkdir -p lib\n        cp rust-lib/target/release/librust_provider.a lib/\n        cp rust-lib/include/rust_provider.h lib/\n        echo \"=== Rust provider library built and staged ===\"\n      '';\n    };\n}\n```\n\n`cargo build --release --offline` works without network access because\nthe crate has no dependencies. The resulting `librust_provider.a` and the\nheader are copied into `lib/`, matching the `codegen.c_header` path and\nthe `find_library` call in `CMakeLists.txt`.", "execs": [{"kind": "file", "cmd": "write flake.nix", "status": "pass", "note": "Wrote flake.nix"}]}, {"md": "## Step 5: Build and install the module\n\nNix flakes only see files tracked by git, so initialise a repo and stage\neverything before building. Then build the `.lgx` package and install it.", "execs": []}, {"md": "### 5.1 Ignore build artifacts\n\n```text\nresult\nresult-*\nlib/\nrust-lib/target/\n```", "execs": [{"kind": "file", "cmd": "write .gitignore", "status": "pass", "note": "Wrote .gitignore"}]}, {"md": "### 5.2 Initialise the git repo\n\nNix flakes require a git repository and only see tracked files:\n\n```bash\ngit init\n```", "execs": [{"kind": "run", "cmd": "git init", "status": "pass", "exit_code": 0, "output": "hint: Using 'master' as the name for the initial branch. This default branch name\nhint: will change to \"main\" in Git 3.0. To configure the initial branch name\nhint: to use in all of your new repositories, which will suppress this warning,\nhint: call:\nhint:\nhint: \tgit config --global init.defaultBranch <name>\nhint:\nhint: Names commonly chosen instead of 'master' are 'main', 'trunk' and\nhint: 'development'. The just-created branch can be renamed via this command:\nhint:\nhint: \tgit branch -m <name>\nhint:\nhint: Disable this message with \"git config set advice.defaultBranchName false\"\nInitialized empty Git repository in /tmp/doctest-test-lygrasr0/.git/\n", "note": ""}]}, {"md": "```bash\ngit add -A\n```", "execs": [{"kind": "r d' (2025-09-28)\n\u2022 Added input 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/logos-package':\n    'github:logos-co/logos-package/ff93a0d' (2026-04-10)\n\u2022 Added input 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/logos-package/logos-nix':\n    'github:logos-co/logos-nix/0e9e6d6' (2026-03-19)\n\u2022 Added input 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/logos-package/logos-nix/nixpkgs':\n    'github:NixOS/nixpkgs/e9f00bd' (2025-09-28)\n\u2022 Added input 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/logos-package/nixpkgs':\n    follows 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/logos-package/logos-nix/nixpkgs'\n\u2022 Added input 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/nix-bundle-dir':\n    'github:logos-co/nix-bundle-dir/3d155ca' (2026-03-25)\n\u2022 Added input 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/nix-bundle-dir/logos-nix':\n    'github:logos-co/logos-nix/0e9e6d6' (2026-03-19)\n\u2022 Added input 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/nix-bundle-dir/logos-nix/nixpkgs':\n    'github:NixOS/nixpkgs/e9f00bd' (2025-09-28)\n\u2022 Added input 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/nix-bundle-dir/nixpkgs':\n    follows 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/nix-bundle-dir/logos-nix/nixpkgs'\n\u2022 Added input 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/nixpkgs':\n    follows 'logos-module-builder/nix-bundle-logos-module-install/nix-bundle-lgx/logos-nix/nixpkgs'\n\u2022 Added input 'logos-module-builder/nix-bundle-logos-module-install/nixpkgs':\n    follows 'logos-module-builder/nix-bundle-logos-module-install/logos-nix/nixpkgs'\n\u2022 Added input 'logos-module-builder/nixpkgs':\n    follows 'logos-module-builder/logos-nix/nixpkgs'\n", "note": ""}]}, {"md": "```bash\ngit add flake.lock\n```", "execs": [{"kind": "run", "cmd": "git add flake.lock", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 5.3 Build the module's .lgx\n\nBuild the flake's `#lgx` output and link it as `./provider-lgx`. This\ncompiles the Rust crate, runs the `c-ffi` codegen over the header,\nbuilds the Qt plugin, and bundles it as an installable `.lgx`. The first\nbuild is slow (Nix downloads Qt, the SDK, and the Rust toolchain).\n\n```bash\nnix build '.#lgx' -o provider-lgx\n```\n\nThe `.lgx` package is now under `./provider-lgx/`:\n\n```bash\nls provider-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "nix build '.#lgx' -o provider-lgx", "status": "pass", "exit_code": 0, "output": "warning: Git tree '/tmp/doctest-test-lygrasr0' has uncommitted changes\nthis path will be fetched (816.7 KiB download, 819.1 KiB unpacked):\n  /nix/store/acd0jlwc28az146l7hmzfi1xc5867lzx-logos-rust_provider_module-module-lib-lgx-1.0.0\ncopying path '/nix/store/acd0jlwc28az146l7hmzfi1xc5867lzx-logos-rust_provider_module-module-lib-lgx-1.0.0' from 'https://logos-co.cachix.org'...\n", "note": ""}, {"kind": "run", "cmd": "ls provider-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "provider-lgx/logos-rust_provider_module-module-lib.lgx\n", "note": ""}]}, {"md": "### 5.4 Seed the modules directory with the bundled capability module\n\nModules are loaded through the host's capability layer, so the modules\ndirectory also needs the `capability_module` that ships with\n`logoscore`. Copy it across first.\n\n```bash\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n\n```", "execs": [{"kind": "run", "cmd": "mkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 5.5 Install the .lgx with lgpm\n\nInstall the freshly-built package into `./modules`. It is a `core`\nmodule, so it goes to `--modules-dir`. The package is unsigned (a local\ndev build), so pass `--allow-unsigned`.\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file provider-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file provider-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "Installing from file: provider-lgx/logos-rust_provider_module-module-lib.lgx... done\nInstalled to: ./modules\n", "note": ""}]}, {"md": "### 5.6 Confirm the install\n\nScan the directory and confirm the module landed:\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "status": "pass", "exit_code": 0, "output": "Found 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ncapability_module              1.0.0           core       security       \nrust_provider_module           1.0.0           core       general        \n", "note": ""}]}, {"md": "## Step 6: Run the daemon and call the module\n\nStart `logoscore` in daemon mode pointed at `./modules`, then load\n`rust_provider_module`, introspect it, and call its methods. Daemon output\nis captured in `logs.txt`.", "execs": []}, {"md": "### 6.1 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to `logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands below connect to\nthis running process via the config written under `~/.logoscore/`.", "execs": [{"kind": "run", "cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "```bash\nsleep 3\n```", "execs": [{"kind": "run", "cmd": "sleep 3", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 6.2 Check daemon status\n\nVerify the daemon is running:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"pid\":4428,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"rust_provider_module\",\"status\":\"not_loaded\"},{\"name\":\"capability_module\",\"status\":\"loaded\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":1,\"not_loaded\":1}}\n", "note": ""}]}, {"md": "### 6.3 List discovered modules\n\n`rust_provider_module` should be visible in the scan directory:\n\n```bash\nlogoscore list-modules\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore list-modules", "status": "pass", "exit_code": 0, "output": "[{\"name\":\"rust_provider_module\",\"status\":\"not_loaded\"},{\"name\":\"capability_module\",\"status\":\"loaded\"}]\n", "note": ""}]}, {"md": "### 6.4 Load the module\n\nLoad `rust_provider_module` into the running daemon:\n\n```bash\nlogoscore load-module rust_provider_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore load-module rust_provider_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies_loaded\":[],\"module\":\"rust_provider_module\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.5 Introspect the module with module-info\n\n`module-info` lists the `Q_INVOKABLE` methods the generated plugin\nexposes \u2014 the same methods you can `call`:\n\n```bash\nlogoscore module-info rust_provider_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore module-info rust_provider_module", "status": "pass", "exit_code": 0, "output": "{\"events\":[],\"methods\":[{\"isInvokable\":true,\"name\":\"add\",\"parameters\":[{\"name\":\"a\",\"type\":\"int\"},{\"name\":\"b\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"add(int,int)\"},{\"isInvokable\":true,\"name\":\"multiply\",\"parameters\":[{\"name\":\"a\",\"type\":\"int\"},{\"name\":\"b\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"multiply(int,int)\"},{\"isInvokable\":true,\"name\":\"factorial\",\"parameters\":[{\"name\":\"n\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"factorial(int)\"},{\"isInvokable\":true,\"name\":\"fibonacci\",\"parameters\":[{\"name\":\"n\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"fibonacci(int)\"},{\"isInvokable\":true,\"name\":\"is_prime\",\"parameters\":[{\"name\":\"n\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"is_prime(int)\"},{\"isInvokable\":true,\"name\":\"greet\",\"parameters\":[{\"name\":\"name\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"greet(QString)\"},{\"isInvokable\":true,\"name\":\"libVersion\",\"returnType\":\"QString\",\"signature\":\"libVersion()\"}],\"name\":\"rust_provider_module\",\"status\":\"loaded\"}\n", "note": ""}]}, {"md": "### 6.6 Add two integers\n\n`add` is the Rust `rust_provider_add` function, reached over IPC \u2014 a real\nround-trip into the compiled Rust code:\n\n```bash\nlogoscore call rust_provider_module add 5 3\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module add 5 3", "status": "pass", "exit_code": 0, "output": "{\"method\":\"add\",\"module\":\"rust_provider_module\",\"result\":8,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.7 Multiply two integers\n\n```bash\nlogoscore call rust_provider_module multiply 4 6\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module multiply 4 6", "status": "pass", "exit_code": 0, "output": "{\"method\":\"multiply\",\"module\":\"rust_provider_module\",\"result\":24,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.8 Factorial\n\n```bash\nlogoscore call rust_provider_module factorial 5\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module factorial 5", "status": "pass", "exit_code": 0, "output": "{\"method\":\"factorial\",\"module\":\"rust_provider_module\",\"result\":120,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.9 Fibonacci\n\n```bash\nlogoscore call rust_provider_module fibonacci 10\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module fibonacci 10", "status": "pass", "exit_code": 0, "output": "{\"method\":\"fibonacci\",\"module\":\"rust_provider_module\",\"result\":55,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.10 Primality test\n\n`is_prime` returns 1 for a prime and 0 otherwise:\n\n```bash\nlogoscore call rust_provider_module is_prime 7\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module is_prime 7", "status": "pass", "exit_code": 0, "output": "{\"method\":\"is_prime\",\"module\":\"rust_provider_module\",\"result\":1,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nlogoscore call rust_provider_module is_prime 4\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module is_prime 4", "status": "pass", "exit_code": 0, "output": "{\"method\":\"is_prime\",\"module\":\"rust_provider_module\",\"result\":0,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.11 Greet (string round-trip)\n\n`greet` takes a string and returns one \u2014 exercising the C-string\nconversion the Rust code performs:\n\n```bash\nlogoscore call rust_provider_module greet World\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module greet World", "status": "pass", "exit_code": 0, "output": "{\"method\":\"greet\",\"module\":\"rust_provider_module\",\"result\":\"Hello, World! (from Rust provider)\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.12 Version\n\nThe version accessor is exposed as `libVersion` (see the note under the\nC header above) and returns the Rust library's version string:\n\n```bash\nlogoscore call rust_provider_module libVersion\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module libVersion", "status": "pass", "exit_code": 0, "output": "{\"method\":\"libVersion\",\"module\":\"rust_provider_module\",\"result\":\"1.0.0\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.13 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 6.14 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"c49cab0db66f\",\"status\":\"not_running\",\"version\":\"1.0\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
</body>
</html>
