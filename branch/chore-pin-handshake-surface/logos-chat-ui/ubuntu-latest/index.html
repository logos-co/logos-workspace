 '/nix/store/wmaqf8a3d2hzljx92sckpa4ivzqh5dcm-dbus-1.14.10-lib' from 'https://cache.nixos.org'...\ncopying path '/nix/store/c96wgx1q0v8j90isavvxm3qah55r45lw-at-spi2-core-2.56.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/wm9npw769j5z8zfap6bgfka0rhd6y85c-dbus-1.14.10' from 'https://cache.nixos.org'...\ncopying path '/nix/store/s9nqr7mipmbi2vgkwkqiriq8ggrrw915-avahi-0.8' from 'https://cache.nixos.org'...\ncopying path '/nix/store/1h1cz7mqml20pcdwa7a5wi5kv0z5f9jx-dbus-1.14.10-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/zkpfddh7v4svk76afsc1bbbvqapzjpir-cups-2.4.12-lib' from 'https://cache.nixos.org'...\ncopying path '/nix/store/x0cccj6ww4hkl1hlirx60f32r13dvfmf-boost-1.87.0' from 'https://cache.nixos.org'...\ncopying path '/nix/store/rk9kj6nnabvam68pdw7vjj2jxsc0flc8-tinysparql-3.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/lw4v9xvxyqrabifarmvj36prncj0c947-gtk+3-3.24.49' from 'https://cache.nixos.org'...\ncopying path '/nix/store/dkfr32yi7p8cdxsnll05q1kax19fl7ay-qtbase-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/36ndhs8khvj8960qbhvw8h3bld1kc06g-qtsvg-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/agvpq5n8vcqwnkmn8bp8rlczy3fdxm6n-qtdeclarative-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/r2cq6la02msp6kfcl9a17d2l2n96qpvs-qtremoteobjects-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/mmbv1csfw25w26jq8dznjzllf31d98dk-logos-chat_ui-module' from 'https://logos-co.cachix.org'...\n", "note": ""}]}, {"md": "## What the chat UI does\n\nThe window is a two-pane messenger:\n\n- **Left:** your conversations, a `Chat` header with a connection dot,\n  a **New DM** button (start a DM from someone's address), and a\n  **Show My Address** button (share your own).\n- **Right:** the message thread for the selected conversation and a\n  composer (the **Send** button).\n- **Status bar:** a human-readable status, the delivery state\n  (`Stopped` \u2192 `Initialising...` \u2192 `Online`), and your installation `ID`.\n\nUnder the hood the backend calls `modules().chat_module` \u2014 typed methods\n(`init`, `get_address`, `create_conversation`, `send_message`, \u2026)\nand string-keyed event subscriptions (`message_received`,\n`delivery_state_changed`, \u2026) that push updates into the view with no\npolling. `init` kicks off the delivery node asynchronously and returns\nimmediately; the UI flips to **Online** when the\n`delivery_state_changed` event reports the network is up.", "execs": []}, {"md": "## Step 2: Launch and connect, then share your address\n\nRun the app headless (offscreen Qt) and drive it: wait for the network to\ncome up, then open and copy your address \u2014 the everything-a-single-\nwindow-shows half of the tour.", "execs": []}, {"md": "### 2.1 Drive the app\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/8d6a9feaa6eef3e9714d3aed3867d20337972542'\n```\n\nThe chat window opens; the status bar starts at **Stopped** while delivery boots.\n\n`init` returned right away and the delivery node bootstrapped in\nthe background. When it connects, the `delivery_state_changed`\nevent lands and the status flips to **Online** \u2014 the **New DM**\nand **Show My Address** buttons enable.\n\n![Network connects](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeVgUV6L//9PdNJsgq2AEBVRQQEFAQATFhWgERWLEqNmc7DHcmYlJJjPJnXnuM5ntmTt3khuzmMQkxsTExGg00Rj3LRqVTWSVpRElAsqOsnQ33b8/6n776R9bcE9y3q8/5pFaTp06VZ2pT9WpUypfX18BQAiDwXC7qwAAAHDTqW93BQAAAADcOgQAAAAAQCIEAAAAAEAiBAAAAABAIgQAAAAAQCIEAAAAAEAiBAAAAABAIgQAAAAAQCI2t7sCt4FKpbK3t3d2drazs7OxsbGxsVGrf+pByGQyGY1Go9HY1dXV1tbW2dlpNptvYPm0CQAAgCRUUn0JWK1Wu7m5ubm5dXd3d3R06PV6o9HY3d39079wVKlUGo3GxsbG1tbWwcFBo9E0NTU1NTWZTKbrLJk2seBLwAAAQAYSBQBnZ2cvLy+9Xt/S0mI0Gm93da6LjY2Ni4uLra3txYsX29rarrkc2sQaAQAAAMhAM3To0Ntdh5tOpVJ5enp6eHg0NDRcvnz5+u+a33Ymk0m5Wz9s2DCNRtPR0XG1JdAmfZZwMyoGAADwk/LLDwAqleqOO+6wt7e/ePFid3f37a7OjdTd3d3e3u7q6u t-ui/8d6a9feaa6eef3e9714d3aed3867d20337972542' --override-input chat_module github:logos-co/logos-chat-module/33c624d0e6ea8444486d6bfe68aa07450315bdb6\n\n# test actions:\n- Window opens: wait for ['Chat']\n- Network connects: wait for ['Online']\n- Open your address: click 'Show My Address'\n- Address dialog shows: wait for ['My Address', 'Share this address with others to start a conversation:']\n- Copy to clipboard: call 'Copy address'.clicked()\n- Copied confirmation: wait for ['Copied to clipboard']", "status": "pass", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial: The Logos Chat UI: Drive the app\n\n1 passed, 0 failed\n\n", "note": ""}]}]}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
