  .md blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .exec { margin-bottom: 14px; }
  .exec:last-child { margin-bottom: 0; }
  .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
  .badge.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .badge.fail { background: rgba(248,81,73,.15); color: var(--fail); }

  .note { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  pre.cmd { background: var(--code-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 0 0 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }

  .empty { color: var(--muted); font-style: italic; font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; margin-bottom: 4px; }
</style>

g path '/nix/store/50cb6vjpl9drrqmi72s6w5rbhfr6phkl-clang-19.1.7' from 'https://cache.nixos.org'...\ncopying path '/nix/store/y7sd8l0kx34yply8v0x8ly9zxpf97798-cctools-binutils-darwin-1010.6' from 'https://cache.nixos.org'...\ncopying path '/nix/store/rhlyld20zdzdi5wghb4b12gw52s9whr9-apple-sdk-11.3' from 'https://cache.nixos.org'...\ncopying path '/nix/store/y9wq3jvp6qqgy9x3k4nb2rzpgz34l2ya-cctools-binutils-darwin-wrapper-1010.6' from 'https://cache.nixos.org'...\ncopying path '/nix/store/zzx6cfl99zknfrj9v7lmrshwzslfjv26-clang-wrapper-19.1.7' from 'https://cache.nixos.org'...\ncopying path '/nix/store/6bgdfdsnwckcqknshdwbh53rdb9aaisn-make-binary-wrapper-hook' from 'https://cache.nixos.org'...\ncopying path '/nix/store/pgrkqlci4gld1kp0qdhjzp1zazxblj2b-stdenv-darwin' from 'https://cache.nixos.org'...\ncopying path '/nix/store/9acf56h8i8x5hgp84vqkffghdj990fd1-wrap-qt6-apps-no-gui-hook' from 'https://cache.nixos.org'...\nbuilding '/nix/store/rjxyy3l57ia7jkbv2r4f8mvpjfhf52s4-logos-wallet_module-module-lib-1.0.1.drv'...\nbuilding '/nix/store/wrxmq6jbxsr89s9a97vp54qjf5vpdgnh-logos-wallet_module-module-lib-lgx-1.0.1.drv'...\n", "note": ""}, {"kind": "run", "cmd": "ls wallet-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "wallet-lgx/logos-wallet_module-module-lib.lgx\n", "note": ""}]}, {"md": "### 3.2 Seed the modules directory with the bundled capability module\n\n`wallet_module` is loaded through the host's capability layer, so the\nmodules directory also needs the `capability_module` that ships with\n`logoscore`. Copy it across first.\n\n```bash\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n\n```", "execs": [{"kind": "run", "cmd": "mkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 3.3 Install the .lgx with lgpm\n\nInstall the freshly-built package into `./modules`. `wallet_module` is a\n`core` module, so it goes to `--modules-dir`. The package is unsigned (a\nlocal dev build), so we pass `--allow-unsigned`.\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file wallet-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file wallet-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "Installing from file: wallet-lgx/logos-wallet_module-module-lib.lgx... done\nInstalled to: ./modules\n", "note": ""}]}, {"md": "### 3.4 Confirm the install\n\nScan the directory and confirm the module landed:\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "status": "pass", "exit_code": 0, "output": "Found 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ncapability_module              1.0.0           core       security       \nwallet_module                  1.0.1           core       wallet         \n", "note": ""}]}, {"md": "## Step 4: Run the daemon and call the module\n\nStart `logoscore` in daemon mode pointed at `./modules`, then use the client\nsubcommands to load `wallet_module`, introspect it, and call several of its\noffline transaction helpers. Daemon output is captured in `logs.txt`.", "execs": []}, {"md": "### 4.1 Write a sample transaction\n\nThe transaction helpers take a JSON-encoded transaction. Write a minimal\nlegacy (EIP-155, chainId 1) transaction to `tx.json`; we pass it to the\nmethods below with logoscore's `@file` argument syntax.\n\n```json\n{\n  \"type\": \"0x0\",\n  \"nonce\": \"0x0\",\n  \"gasPrice\": \"0x3b9aca00\",\n  \"gas\": \"0x5208\",\n  \"to\": \"0x70997970c51812dc3a010c7d01b50e0d17dc79c8\",\n  \"value\": \"0x0\",\n  \"input\": \"0x\",\n  \"chainId\": \"0x1\",\n  \"v\": \"0x26\",\n  \"r\": \"0x1\",\n  \"s\": \"0x1\"\n}\n```", "execs": [{"kind": "file", "cmd": "write tx.json", "status": "pass", "note": "Wrote tx.json"}]}, {"md": "### 4.2 Start the daemon\n\nStart logoscore in daemon mode in the background, capturing output to\n`logs.txt`:\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```\n\nThe `-D` flag starts the daemon. The client subcommands below connect to\nthis running process via the config written under `~/.logoscore/`.", "execs": [{"kind": "run", "cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "```bash\nsleep 3\n```", "execs": [{"kind": "run", "cmd": "sleep 3", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.3 Inspect the startup log\n\nReview the daemon's startup output:\n\n```bash\ncat logs.txt\n```", "execs": [{"kind": "run", "cmd": "cat logs.txt", "status": "pass", "exit_code": 0, "output": "[2026-06-24 11:44:13.682] [warning] [logos] Module capability_module carries no usable logos_protocol_version (pre-protocol build) \u2014 loading permissively\n[2026-06-24 11:44:13.726] [info] [logos] [capability_module] [LogosProviderObject] LogosAPIProvider: detected LogosProviderPlugin for \"capability_module\"\n[2026-06-24 11:44:13.727] [info] [logos] [capability_module] [LogosProviderObject] LogosAPIProvider: registering LogosProviderObject directly for \"capability_module\"\n[2026-06-24 11:44:13.727] [info] [logos] [capability_module] [LogosProviderObject] LogosProviderBase::init called\n[2026-06-24 11:44:13.727] [info] [logos] [capability_module] [LogosProviderObject] ModuleProxy: created, wrapping LogosProviderObject \"capability_module\"\n[2026-06-24 11:44:13.727] [info] [logos] [capability_module] RemoteTransportHost: Created registry host with URL: \"local:logos_capability_module_a807a85a8a4d\"\n[2026-06-24 11:44:13.727] [info] [logos] [capability_module] RemoteTransportHost: Published object: \"capability_module\"\n[2026-06-24 11:44:13.727] [info] [logos] [capability_module] [LogosProviderObject] LogosAPIProvider: successfully published \"capability_module\"\n[2026-06-24 11:44:13.943] [info] [logos] [capability_module] [LogosProviderObject] Saving token for module: \"capability_module\"\n[2026-06-24 11:44:13.943] [info] [logos] Module loaded: capability_module\nLogoscore daemon started (pid 33456, instance a807a85a8a4d)\nDaemon state: /tmp/doctest-test-3n_rnxsv/.logoscore/daemon/state.json\nLocal client config: /tmp/doctest-test-3n_rnxsv/.logoscore/client/config.json\n", "note": ""}]}, {"md": "### 4.4 Check daemon status\n\nVerify the daemon is running:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"pid\":33456,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"wallet_module\",\"status\":\"not_loaded\"},{\"name\":\"capability_module\",\"status\":\"loaded\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":1,\"not_loaded\":1}}\n", "note": ""}]}, {"md": "### 4.5 List discovered modules\n\n`wallet_module` should be visible in the scan directory:\n\n```bash\nlogoscore list-modules\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore list-modules", "status": "pass", "exit_code": 0, "output": "[{\"name\":\"wallet_module\",\"status\":\"not_loaded\"},{\"name\":\"capability_module\",\"status\":\"loaded\"}]\n", "note": ""}]}, {"md": "### 4.6 Load the module\n\nLoad `wallet_module` into the running daemon:\n\n```bash\nlogoscore load-module wallet_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore load-module wallet_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies_loaded\":[],\"module\":\"wallet_module\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.7 Confirm the module is loaded\n\nRe-run `status`; the module that was `not_loaded` before now reports\n`loaded`:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"pid\":33456,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"wallet_module\",\"status\":\"loaded\"},{\"name\":\"capability_module\",\"status\":\"loaded\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":2,\"not_loaded\":0}}\n", "note": ""}]}, {"md": "### 4.8 Introspect the module with module-info\n\n`module-info` lists the `Q_INVOKABLE` methods the module exposes \u2014 the\nsame methods you can `call`:\n\n```bash\nlogoscore module-info wallet_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore module-info wallet_module", "status": "pass", "exit_code": 0, "output": "{\"events\":[],\"methods\":[{\"isInvokable\":true,\"name\":\"ethClientInit\",\"parameters\":[{\"name\":\"rpcUrl\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"ethClientInit(QString)\"},{\"isInvokable\":true,\"name\":\"ethClientClose\",\"parameters\":[{\"name\":\"rpcUrl\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"ethClientClose(QString)\"},{\"isInvokable\":true,\"name\":\"ethClientGetClients\",\"returnType\":\"QStringList\",\"signature\":\"ethClientGetClients()\"},{\"isInvokable\":true,\"name\":\"ethClientRpcCall\",\"parameters\":[{\"name\":\"rpcUrl\",\"type\":\"QString\"},{\"name\":\"method\",\"type\":\"QString\"},{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"ethClientRpcCall(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"ethClientChainId\",\"parameters\":[{\"name\":\"rpcUrl\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"ethClientChainId(QString)\"},{\"isInvokable\":true,\"name\":\"ethClientGetBalance\",\"parameters\":[{\"name\":\"rpcUrl\",\"type\":\"QString\"},{\"name\":\"address\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"ethClientGetBalance(QString,QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorTransferETH\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorTransferETH(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorTransferERC20\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorTransferERC20(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorApproveERC20\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorApproveERC20(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorTransferFromERC721\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorTransferFromERC721(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorSafeTransferFromERC721\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorSafeTransferFromERC721(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorApproveERC721\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorApproveERC721(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorSetApprovalForAllERC721\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorSetApprovalForAllERC721(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorTransferERC1155\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorTransferERC1155(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorBatchTransferERC1155\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorBatchTransferERC1155(QString)\"},{\"isInvokable\":true,\"name\":\"txGeneratorSetApprovalForAllERC1155\",\"parameters\":[{\"name\":\"paramsJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"txGeneratorSetApprovalForAllERC1155(QString)\"},{\"isInvokable\":true,\"name\":\"transactionJsonToRlp\",\"parameters\":[{\"name\":\"txJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"transactionJsonToRlp(QString)\"},{\"isInvokable\":true,\"name\":\"transactionRlpToJson\",\"parameters\":[{\"name\":\"rlpHex\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"transactionRlpToJson(QString)\"},{\"isInvokable\":true,\"name\":\"transactionGetHash\",\"parameters\":[{\"name\":\"txJSON\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"transactionGetHash(QString)\"}],\"name\":\"wallet_module\",\"status\":\"loaded\"}\n", "note": ""}]}, {"md": "### 4.9 Hash a transaction\n\n`transactionGetHash` computes the hash of the transaction in `tx.json`.\nThe `@tx.json` argument tells logoscore to load the file's contents as the\nargument. The result is a real `0x\u2026` keccak hash from the go-wallet-sdk:\n\n```bash\nlogoscore call wallet_module transactionGetHash @tx.json\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call wallet_module transactionGetHash @tx.json", "status": "pass", "exit_code": 0, "output": "{\"method\":\"transactionGetHash\",\"module\":\"wallet_module\",\"result\":\"0xd1a53a05d3f0b7bfa3cf27870faf2d7f960008e554b2eb30489b168baa8642df\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.10 Encode the transaction to RLP\n\n`transactionJsonToRlp` serialises the transaction to its RLP hex\nencoding:\n\n```bash\nlogoscore call wallet_module transactionJsonToRlp @tx.json\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call wallet_module transactionJsonToRlp @tx.json", "status": "pass", "exit_code": 0, "output": "{\"method\":\"transactionJsonToRlp\",\"module\":\"wallet_module\",\"result\":\"0xe380843b9aca008252089470997970c51812dc3a010c7d01b50e0d17dc79c88080260101\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.11 Build an ETH transfer transaction\n\n`txGeneratorTransferETH` builds an unsigned ETH-transfer transaction from\na small JSON parameter object. Write the parameters to `transfer.json` and\npass them to the generator with `@transfer.json`:\n\n```json\n{\n  \"to\": \"0x70997970c51812dc3a010c7d01b50e0d17dc79c8\",\n  \"value\": \"1000000000000000000\",\n  \"nonce\": 0,\n  \"gasLimit\": 21000,\n  \"gasPrice\": \"1000000000\",\n  \"chainID\": \"1\"\n}\n```\n\n```bash\nlogoscore call wallet_module txGeneratorTransferETH @transfer.json\n```", "execs": [{"kind": "file", "cmd": "write transfer.json", "status": "pass", "note": "Wrote transfer.json"}]}, {"md": "### 4.12 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.13 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"a807a85a8a4d\",\"status\":\"not_running\",\"version\":\"1.0\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}, {"meta": {"name": "Driving the Wallet UI Against This Module", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"md": "# Driving the Wallet UI Against This Module\n\nThe companion to the [headless runtime doc-test](wallet-module-runtime.md):\ninstead of calling `wallet_module` through the `logoscore` daemon, this one\ndrives the real **[`logos-wallet-ui`](https://github.com/logos-co/logos-wallet-ui)**\ndesktop app against **this** commit of the module.\n\n`logos-wallet-ui` is a QML UI plugin built with\n[`logos-app-builder`](https://github.com/logos-co/logos-app-builder), so its\nflake exposes a standalone app (`apps.default`) that `nix run` launches in its\nown window with all backend module dependencies bundled and auto-loaded. The\nUI declares `wallet_module` as a flake input, so we build the app with an\n`--override-input` that points that input at the commit under test. The UI then\ntalks to **this** module over the Logos IPC bridge, exactly as it would in\n`logos-basecamp`.\n\nThe app is launched headless (`QT_QPA_PLATFORM=offscreen`) and driven through\nthe QML inspector via [`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp):\nwe wait for the UI to come up, point it at a public Base mainnet RPC\nendpoint, initialise an EthClient and ask the module for the chain ID \u2014 a real\n`eth_chainId` round-trip that must return `8453` \u2014 and capture screenshots that\nare embedded in the rendered tutorial and the CI report.\n\n**What you'll build:** The `logos-wallet-ui` standalone app, built against this `wallet_module` commit and driven headlessly through its QML UI.\n\n**What you'll learn:**\n\n- How a UI built with `logos-app-builder` exposes a standalone `nix run` app\n- How to override the UI's module input so it runs against a specific module commit\n- How to drive a headless Qt/QML app with logos-qt-mcp (wait, type, click, assert)\n- How to exercise a real module call end-to-end (init an EthClient, read the chain ID)\n- How to capture screenshots of the running UI for documentation and CI reports\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required.", "execs": []}, {"md": "## How the standalone UI app works\n\n`logos-wallet-ui` is a QML UI plugin (`wallet_ui`) that declares\n`wallet_module` as a dependency. Because it is built with\n`logos-app-builder`, its flake's `apps.default` is a self-contained desktop\napp:\n\n```\n+--------------------+   backend.getChainId(rpcUrl)         +-----------------+\n|     wallet_ui      | ----------------------------------->  |  wallet_module  |\n|  WalletView.qml    |   IPC (Logos API bridge)              |   C++ plugin    |\n+--------------------+                                       +-----------------+\n          ^                                                          ^\n          \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 bundled & launched by \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                          logos-app-builder standalone app\n```\n\nThe standalone app bundles `wallet_module` and loads it automatically at\nstartup. On launch the backend immediately calls `wallet_module` to set up\nits default EthClients; only when those calls succeed does the status reach\n**Ready** \u2014 so a Ready status is itself proof that the UI is talking to the\nmodule. By overriding the `wallet_module` input at build time we make that\nbackend **this** commit.", "execs": []}, {"md": "## Step 1: Clone the UI\n\nClone [`logos-wallet-ui`](https://github.com/logos-co/logos-wallet-ui). We\nclone over HTTPS so the step works in CI; over SSH the URL is\n`git@github.com:logos-co/logos-wallet-ui.git`.", "execs": []}, {"md": "### 1.1 git clone\n\n```bash\ngit clone --depth 1 https://github.com/logos-co/logos-wallet-ui.git\n```", "execs": [{"kind": "run", "cmd": "git clone --depth 1 https://github.com/logos-co/logos-wallet-ui.git", "status": "pass", "exit_code": 0, "output": "Cloning into 'logos-wallet-ui'...\n", "note": ""}]}, {"md": "## Step 2: Build the qt-mcp test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness the\ndoc-test uses to connect to the app's QML inspector and drive it. Build it\nonce and link it as `./result-mcp`.", "execs": []}, {"md": "### 2.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-qt-mcp' -o result-mcp\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-qt-mcp' -o result-mcp", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-qt-mcp/1fea509485a48ab185fafae8dc21bdbcc808a07e' into the Git cache...\nthese 4 paths will be fetched (16.7 MiB download, 99.1 MiB unpacked):\n  /nix/store/dgfikfjky3nq6gycpd08fyvmr7ww1j7j-bash-interactive-5.3p3\n  /nix/store/hbbyr0434ww52i6bph4lyswm76ixzpcw-libuv-1.51.0-dev\n  /nix/store/0pvy2s1y0i9s7k7smvx3a3bxgxdg9mwf-logos-qt-mcp\n  /nix/store/3scj3c1qxh5iclf8jy5hbl9pki40y77n-nodejs-22.19.0\ncopying path '/nix/store/dgfikfjky3nq6gycpd08fyvmr7ww1j7j-bash-interactive-5.3p3' from 'https://cache.nixos.org'...\ncopying path '/nix/store/hbbyr0434ww52i6bph4lyswm76ixzpcw-libuv-1.51.0-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/3scj3c1qxh5iclf8jy5hbl9pki40y77n-nodejs-22.19.0' from 'https://cache.nixos.org'...\ncopying path '/nix/store/0pvy2s1y0i9s7k7smvx3a3bxgxdg9mwf-logos-qt-mcp' from 'https://logos-co.cachix.org'...\n", "note": ""}]}, {"md": "## Step 3: Launch the UI and exercise the module\n\nLaunch the standalone app with `nix run`, overriding the `wallet_module`\ninput so the UI runs against **this** commit of the module. The doc-test\ndrives the running app through a genuine round-trip: it points the UI at a\npublic Base mainnet RPC endpoint, initialises an EthClient (a real call into\n`wallet_module`), and asks the module for the chain ID \u2014 which must come back\nas `8453` for Base mainnet. That is end-to-end proof the module is loaded and\nactually working, not just that the window rendered.\n\n> `` pins the override to the commit under test (the runner expands\n> it: locally this checkout's `HEAD`, in CI the commit being tested). With no\n> pin it falls back to the module's latest `master`.\n>\n> This step makes a live JSON-RPC request to a public Base mainnet endpoint\n> (`mainnet.base.org`), so it needs outbound network access.", "execs": []}, {"md": "### 3.1 Launch and drive the app\n\n```bash\nnix run ./logos-wallet-ui --override-input wallet_module github:logos-co/logos-wallet-module/16fdcd4acd37cbd7e17d24517a806e1d15e3ed27\n```\n\n![EthClient management section visible](images/wallet-ui-launch.png)\n\n![Chain ID is 8453 (Base mainnet)](images/wallet-ui-chainid.png)\n\nThis is a real end-to-end round-trip: typing the RPC URL and clicking\n**Init EthClient** invokes `wallet_module.ethClientInit()` (which\nauto-selects the new client), and **Get Chain ID** calls\n`wallet_module.ethClientChainId()` \u2014 a live `eth_chainId` JSON-RPC request\ndispatched through **this** module over the Logos API bridge. Base\nmainnet answers `8453`, so seeing `8453` in the Chain ID field proves the\nUI and this module work together against a real network. The captured\nscreenshots are embedded above and in the CI report.", "execs": [{"kind": "ui_test", "cmd": "nix run ./logos-wallet-ui --override-input wallet_module github:logos-co/logos-wallet-module/16fdcd4acd37cbd7e17d24517a806e1d15e3ed27\n\n# test actions:\n- App window opens: wait for ['EthClient', 'Transactions']\n- Backend reaches Ready (module answered startup calls): wait for ['Ready']\n- EthClient management section visible: wait for ['EthClient Management', 'Get Chain ID']\n- Enter a Base mainnet RPC URL: set placeholderText='https://...' to 'https://mainnet.base.org'\n- Initialise the EthClient: click 'Init EthClient'\n- Let the client initialise and auto-select: sleep 4000ms\n- Get the chain ID: click 'Get Chain ID'\n- Chain ID is 8453 (Base mainnet): wait for ['8453']", "status": "fail", "output": "\nRunning 1 test(s)...\n\n  \u001b[31m\u2717\u001b[0m Driving the Wallet UI Against This Module: Launch and drive the app\n    Expected texts not found: [\"Ready\"]\n\n0 passed, 1 failed\n\n\n\n--- app log ---\n\nViewModuleHost: process ready for \"wallet_ui\"\nRemoteTransportConnection: Connecting to registry: \"local:logos_capability_module_7a7bfd7e8186\" at \"11:45:50.773\"\nRemoteTransportConnection: Successfully connected to registry: \"local:logos_capability_module_7a7bfd7e8186\"\nRemoteTransportConnection: Connected to registry at \"11:45:50.773\"\nLogosAPIConsumer: Informing module token for module: \"wallet_ui\" with token: \"redacted:0c683fc5\u2026\"\nRemoteTransportConnection: Requesting object: \"capability_module\" at \"11:45:50.773\"\n[LogosObject] RemoteTransportConnection: returning RemoteLogosObject for: \"capability_module\"\n[LogosObject] Created RemoteLogosObject wrapping QRemoteObjectReplica 105553120338592\n[LogosObject] LogosAPIConsumer: calling LogosObject::informModuleToken for \"wallet_ui\"\n[2026-06-24 11:45:50.773] [info] [capability_module] [LogosProviderObject] Saving token for module: \"wallet_ui\"\nLogosAPIConsumer: informModuleToken completed with result: true\n[LogosObject] Destroying RemoteLogosObject 0\nqt.qpa.fonts: Populating font family aliases took 74 ms. Replace uses of missing font family \"Sans Serif\" with one that exists to avoid this cost. \nqt.remoteobjects: connectionToSource is null\nLoaded UI plugin: \"/nix/store/1issc3naw0dh8fg6cjiy436l76qnmfrm-logos-wallet_ui-plugin-dir\"\n[QmlInspector] Inspector server listening on port 3768\n[QmlInspector] Client connected from \"::1\"\n[QmlInspector] Client disconnected\n[QmlInspector] Client connected from \"::1\"\n[QmlInspector] Client disconnected", "note": "UI tests failed"}]}]}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
</body>
</html>
