name: Nightly Bump

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:       # allow manual trigger

concurrency:
  group: nightly-bump
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# One-time setup for doc-test report links:
#   Repo Settings → Pages → "Build and deployment" → Source: "Deploy from a
#   branch", Branch: `gh-pages` / `(root)`. The publish-doctest-reports job
#   creates the branch on its first run; nothing else is needed.
#
# Nightly doc-test reports are published to:
#   https://<owner>.github.io/<repo>/nightly/<date>/<suite>/<os>/
# and linked in the nightly PR as a comment each run.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  nightly-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write

    outputs:
      changed:             ${{ steps.check.outputs.changed }}
      sha_cpp_sdk:         ${{ steps.shas.outputs.cpp_sdk }}
      sha_liblogos:        ${{ steps.shas.outputs.liblogos }}
      sha_logoscore_cli:   ${{ steps.shas.outputs.logoscore_cli }}
      sha_module_builder:  ${{ steps.shas.outputs.module_builder }}
      sha_basecamp:        ${{ steps.shas.outputs.basecamp }}
      sha_package_manager: ${{ steps.shas.outputs.package_manager }}
      sha_rust_sdk:        ${{ steps.shas.outputs.rust_sdk }}
      sha_openmetrics:     ${{ steps.shas.outputs.openmetrics }}
      sha_tutorial:        ${{ steps.shas.outputs.tutorial }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 --jobs 4

      - name: Bump submodules to latest
        run: |
          # Set origin/HEAD for each submodule so --remote resolves the correct
          # default branch (master or main) rather than always assuming master.
          git submodule foreach --quiet '
            git remote set-head origin --auto 2>/dev/null || true
          '
          git submodule update --remote --depth 1 --jobs 4

      # Capture the exact bumped SHA for every repo that has doctests. These
      # are passed as --release-for arguments to the doctest CLI in the parallel
      # doctest jobs below, ensuring each doctest builds against the same commit
      # that the nix tests ran against.
      - name: Collect repo SHAs for doctests
        id: shas
        run: |
          get_sha() { git -C "repos/$1" rev-parse HEAD 2>/dev/null || true; }
          echo "cpp_sdk=$(get_sha logos-cpp-sdk)"                >> "$GITHUB_OUTPUT"
          echo "liblogos=$(get_sha logos-liblogos)"               >> "$GITHUB_OUTPUT"
          echo "logoscore_cli=$(get_sha logos-logoscore-cli)"     >> "$GITHUB_OUTPUT"
          echo "module_builder=$(get_sha logos-module-builder)"   >> "$GITHUB_OUTPUT"
          echo "basecamp=$(get_sha logos-basecamp)"               >> "$GITHUB_OUTPUT"
          echo "package_manager=$(get_sha logos-package-manager)" >> "$GITHUB_OUTPUT"
          echo "rust_sdk=$(get_sha logos-rust-sdk)"               >> "$GITHUB_OUTPUT"
          echo "openmetrics=$(get_sha openmetrics-module)"        >> "$GITHUB_OUTPUT"
          echo "tutorial=$(get_sha logos-tutorial)"               >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No submodule updates found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            changed=""
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              repo=$(echo "$line" | sed 's|^repos/||')
              changed="$changed $repo"
            done < <(git diff --name-only -- repos/)
            changed=$(echo "$changed" | xargs)
            echo "repos=$changed" >> "$GITHUB_OUTPUT"
            echo "## Updated repos" >> "$GITHUB_STEP_SUMMARY"
            for r in $changed; do echo "- \`$r\`" >> "$GITHUB_STEP_SUMMARY"; done
          fi

      - name: Install Nix
        if: steps.check.outputs.changed == 'true'
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        if: steps.check.outputs.changed == 'true'
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Add workspace tools to PATH
        if: steps.check.outputs.changed == 'true'
        run: echo "${{ github.workspace }}/scripts" >> "$GITHUB_PATH"

      - name: Sync dep-graph
        if: steps.check.outputs.changed == 'true'
        run: ws sync-graph --quiet

      - name: Update flake.lock
        if: steps.check.outputs.changed == 'true'
        run: |
          updated_inputs=""
          for repo in ${{ steps.check.outputs.repos }}; do
            if grep -qE "^[[:space:]]*${repo}([[:space:]]*=|\.)" flake.nix; then
              echo "Updating flake input: $repo"
              nix flake lock --update-input "$repo"
              updated_inputs="$updated_inputs $repo"
            else
              echo "Skipping $repo (not a top-level flake input)"
            fi
          done

          if [[ -n "$updated_inputs" ]]; then
            echo "## Updated flake.lock inputs" >> "$GITHUB_STEP_SUMMARY"
            for r in $updated_inputs; do echo "- \`$r\`" >> "$GITHUB_STEP_SUMMARY"; done
          else
            echo "No matching flake inputs to update." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build core chain
        if: steps.check.outputs.changed == 'true'
        run: |
          failed=0
          for repo in logos-cpp-sdk logos-module logos-liblogos logos-package logos-basecamp; do
            echo "::group::Build $repo"
            if ! ws build "$repo" --quiet --workspace; then
              echo "::error::Build failed: $repo"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        run: ws test --all --quiet --workspace

      - name: Create or update pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="nightly/bump"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add repos/ nix/dep-graph.nix flake.nix flake.lock
          git commit -m "$(printf '%s\n\n%s\n' \
            "chore: nightly submodule bump $(date +%Y-%m-%d)" \
            "Updated: ${{ steps.check.outputs.repos }}")"

          git push --force -u origin "$branch"

          title="chore: nightly submodule bump $(date +%Y-%m-%d)"
          body="$(printf '%s\n' \
            '## Nightly Submodule Bump' \
            '' \
            'Bumped all submodules to their latest upstream default branch.' \
            '' \
            '### Updated repos' \
            "$(for r in ${{ steps.check.outputs.repos }}; do echo "- \`$r\`"; done)" \
            '' \
            '### Checks' \
            '- [x] Core chain builds' \
            '- [x] All tests pass' \
            '- [ ] Doc-test reports (posted as a comment once reports are published)' \
            '' \
            'Auto-generated by the nightly bump workflow.')"

          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated PR #$existing"
          else
            gh pr create --title "$title" --body "$body"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Doctest jobs — run in parallel on ubuntu + macos after the bump.
  #
  # Each job checks out its repo at the exact bumped SHA and runs that repo's
  # doctest specs, passing the same SHA to --release-for so the builds are
  # pinned identically to the nix tests above.
  #
  # These jobs run even when nightly-bump fails (they guard on changed=true
  # and a non-empty SHA): the SHA collection step runs early enough that it
  # is set even when a later step in nightly-bump fails.
  # ─────────────────────────────────────────────────────────────────────────

  doctest-cpp-sdk:
    name: cpp-sdk doctests (${{ matrix.os }})
    needs: nightly-bump
    if: always() && needs.nightly-bump.outputs.changed == 'true' && needs.nightly-bump.outputs.sha_cpp_sdk != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout logos-cpp-sdk at nightly SHA
        uses: actions/checkout@v4
        with:
          repository: logos-co/logos-cpp-sdk
          ref: ${{ needs.nightly-bump.outputs.sha_cpp_sdk }}
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run cpp-sdk doctests
        run: |
          nix run github:logos-co/logos-doctest -- run \
            doctests/cpp-sdk-module-runtime.test.yaml \
            doctests/cpp-sdk-module-composition.test.yaml \
            doctests/cpp-sdk-worker-thread-http.test.yaml \
            --verbose \
            --continue-on-fail \
            --release-for logos-cpp-sdk=${{ needs.nightly-bump.outputs.sha_cpp_sdk }} \
            --report "${{ runner.temp }}/report.html"
      - name: Stage report
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          if [ -f "${{ runner.temp }}/report.html" ]; then
            cp "${{ runner.temp }}/report.html" report-out/index.html
          else
            echo "<h1>No report produced</h1>" > report-out/index.html
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-doctest-cpp-sdk-${{ matrix.os }}
          path: report-out/index.html
          if-no-files-found: warn

  doctest-liblogos:
    name: liblogos doctests (${{ matrix.os }})
    needs: nightly-bump
    if: always() && needs.nightly-bump.outputs.changed == 'true' && needs.nightly-bump.outputs.sha_liblogos != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout logos-liblogos at nightly SHA
        uses: actions/checkout@v4
        with:
          repository: logos-co/logos-liblogos
          ref: ${{ needs.nightly-bump.outputs.sha_liblogos }}
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run liblogos doctests
        run: |
          nix run github:logos-co/logos-doctest -- run \
            doctests/liblogos-module-runtime.test.yaml \
            --verbose \
            --continue-on-fail \
            --release-for logos-liblogos=${{ needs.nightly-bump.outputs.sha_liblogos }} \
            --report "${{ runner.temp }}/report.html"
      - name: Stage report
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          if [ -f "${{ runner.temp }}/report.html" ]; then
            cp "${{ runner.temp }}/report.html" report-out/index.html
          else
            echo "<h1>No report produced</h1>" > report-out/index.html
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-doctest-liblogos-${{ matrix.os }}
          path: report-out/index.html
          if-no-files-found: warn

  doctest-logoscore-cli:
    name: logoscore-cli doctests (${{ matrix.os }})
    needs: nightly-bump
    if: always() && needs.nightly-bump.outputs.changed == 'true' && needs.nightly-bump.outputs.sha_logoscore_cli != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout logos-logoscore-cli at nightly SHA
        uses: actions/checkout@v4
        with:
          repository: logos-co/logos-logoscore-cli
          ref: ${{ needs.nightly-bump.outputs.sha_logoscore_cli }}
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run logoscore-cli doctests
        run: |
          nix run github:logos-co/logos-doctest -- run \
            doctests/logoscore-daemon.test.yaml \
            --verbose \
            --continue-on-fail \
            --release-for logos-logoscore-cli=${{ needs.nightly-bump.outputs.sha_logoscore_cli }} \
            --report "${{ runner.temp }}/report.html"
      - name: Stage report
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          if [ -f "${{ runner.temp }}/report.html" ]; then
            cp "${{ runner.temp }}/report.html" report-out/index.html
          else
            echo "<h1>No report produced</h1>" > report-out/index.html
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-doctest-logoscore-cli-${{ matrix.os }}
          path: report-out/index.html
          if-no-files-found: warn

  doctest-module-builder:
    name: module-builder doctests (${{ matrix.os }})
    needs: nightly-bump
    if: always() && needs.nightly-bump.outputs.changed == 'true' && needs.nightly-bump.outputs.sha_module_builder != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout logos-module-builder at nightly SHA
        uses: actions/checkout@v4
        with:
          repository: logos-co/logos-module-builder
          ref: ${{ needs.nightly-bump.outputs.sha_module_builder }}
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run module-builder doctests
        run: |
          nix run github:logos-co/logos-doctest -- run \
            doctests/wrap-external-lib-1-source.test.yaml \
            doctests/wrap-external-lib-2-prebuilt-binaries.test.yaml \
            doctests/wrap-external-lib-3-external-source.test.yaml \
            doctests/wrap-external-lib-4-nix-flake.test.yaml \
            --verbose \
            --continue-on-fail \
            --release-for logos-module-builder=${{ needs.nightly-bump.outputs.sha_module_builder }} \
            --report "${{ runner.temp }}/report.html"
      - name: Stage report
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          if [ -f "${{ runner.temp }}/report.html" ]; then
            cp "${{ runner.temp }}/report.html" report-out/index.html
          else
            echo "<h1>No report produced</h1>" > report-out/index.html
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-doctest-module-builder-${{ matrix.os }}
          path: report-out/index.html
          if-no-files-found: warn

  doctest-basecamp:
    name: basecamp doctests (${{ matrix.os }})
    needs: nightly-bump
    if: always() && needs.nightly-bump.outputs.changed == 'true' && needs.nightly-bump.outputs.sha_basecamp != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout logos-basecamp at nightly SHA
        uses: actions/checkout@v4
        with:
          repository: logos-co/logos-basecamp
          ref: ${{ needs.nightly-bump.outputs.sha_basecamp }}
          fetch-depth: 1
      # The portable bundle relies on host libGL/EGL (the bundle carries the app
      # but not GPU drivers). Install the standard glvnd/mesa runtime so the
      # launch behaves like a real Linux desktop. The dev-app spec is unaffected.
      - name: Install graphics runtime libraries (Linux bundle launch)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopengl0 libglx0 libgl1 libegl1 libglu1-mesa libvulkan1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run basecamp doctests
        run: |
          nix run github:logos-co/logos-doctest -- run \
            doctests/basecamp-modules.test.yaml \
            doctests/basecamp-modules-bundle.test.yaml \
            --verbose \
            --continue-on-fail \
            --release-for logos-basecamp=${{ needs.nightly-bump.outputs.sha_basecamp }} \
            --report "${{ runner.temp }}/report.html"
      - name: Stage report
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          if [ -f "${{ runner.temp }}/report.html" ]; then
            cp "${{ runner.temp }}/report.html" report-out/index.html
          else
            echo "<h1>No report produced</h1>" > report-out/index.html
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-doctest-basecamp-${{ matrix.os }}
          path: report-out/index.html
          if-no-files-found: warn

  doctest-package-manager:
    name: package-manager doctests (${{ matrix.os }})
    needs: nightly-bump
    if: always() && needs.nightly-bump.outputs.changed == 'true' && needs.nightly-bump.outputs.sha_package_manager != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout logos-package-manager at nightly SHA
        uses: actions/checkout@v4
        with:
          repository: logos-co/logos-package-manager
          ref: ${{ needs.nightly-bump.outputs.sha_package_manager }}
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run package-manager doctests
        run: |
          nix run github:logos-co/logos-doctest -- run \
            doctests/*.test.yaml \
            --verbose \
            --continue-on-fail \
            --release-for logos-package-manager=${{ needs.nightly-bump.outputs.sha_package_manager }} \
            --report "${{ runner.temp }}/report.html"
      - name: Stage report
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          if [ -f "${{ runner.temp }}/report.html" ]; then
            cp "${{ runner.temp }}/report.html" report-out/index.html
          else
