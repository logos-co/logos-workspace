          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-doctest-package-manager-${{ matrix.os }}
          path: report-out/index.html
          if-no-files-found: warn

  doctest-rust-sdk:
    name: rust-sdk doctests (${{ matrix.os }})
    needs: nightly-bump
    if: always() && needs.nightly-bump.outputs.changed == 'true' && needs.nightly-bump.outputs.sha_rust_sdk != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # rust-sdk doctests don't use --release-for (the Rust provider module
      # doesn't consume the SDK), but we still check out the bumped SHA so
      # the spec files reflect exactly what was bumped.
      - name: Checkout logos-rust-sdk at nightly SHA
        uses: actions/checkout@v4
        with:
          repository: logos-co/logos-rust-sdk
          ref: ${{ needs.nightly-bump.outputs.sha_rust_sdk }}
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run rust-sdk doctests
        run: |
          nix run github:logos-co/logos-doctest -- run \
            doctests/rust-provider-module.test.yaml \
            --verbose \
            --continue-on-fail \
            --report "${{ runner.temp }}/report.html"
      - name: Stage report
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          if [ -f "${{ runner.temp }}/report.html" ]; then
            cp "${{ runner.temp }}/report.html" report-out/index.html
          else
            echo "<h1>No report produced</h1>" > report-out/index.html
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-doctest-rust-sdk-${{ matrix.os }}
          path: report-out/index.html
          if-no-files-found: warn

  doctest-openmetrics:
    name: openmetrics doctests (${{ matrix.os }})
    needs: nightly-bump
    if: always() && needs.nightly-bump.outputs.changed == 'true' && needs.nightly-bump.outputs.sha_openmetrics != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout openmetrics-module at nightly SHA
        uses: actions/checkout@v4
        with:
          repository: logos-co/openmetrics-module
          ref: ${{ needs.nightly-bump.outputs.sha_openmetrics }}
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run openmetrics doctests
        run: |
          nix run github:logos-co/logos-doctest -- run \
            doctests/openmetrics.test.yaml \
            --verbose \
            --continue-on-fail \
            --release-for openmetrics-module=${{ needs.nightly-bump.outputs.sha_openmetrics }} \
            --report "${{ runner.temp }}/report.html"
      - name: Stage report
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          if [ -f "${{ runner.temp }}/report.html" ]; then
            cp "${{ runner.temp }}/report.html" report-out/index.html
          else
            echo "<h1>No report produced</h1>" > report-out/index.html
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-doctest-openmetrics-${{ matrix.os }}
          path: report-out/index.html
          if-no-files-found: warn

  doctest-tutorial:
    name: tutorial doctests (${{ matrix.os }})
    needs: nightly-bump
    if: always() && needs.nightly-bump.outputs.changed == 'true' && needs.nightly-bump.outputs.sha_tutorial != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # logos-tutorial keeps its specs under tests/ (not doctests/) and does not
      # pin itself via --release-for — checking out the bumped SHA is what pins
      # the spec content. This mirrors the tutorial's own ci.yml, which runs
      # these three leaves (the C-library and QML specs are pulled in via the
      # cpp-ui-app chain's `requires:` / are generate-only there).
      - name: Checkout logos-tutorial at nightly SHA
        uses: actions/checkout@v4
        with:
          repository: logos-co/logos-tutorial
          ref: ${{ needs.nightly-bump.outputs.sha_tutorial }}
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run tutorial doctests
        run: |
          nix run github:logos-co/logos-doctest -- run \
            tests/tutorial-cpp-ui-app.test.yaml \
            tests/tutorial-composing-modules.test.yaml \
            tests/tutorial-interface-dependencies.test.yaml \
            --verbose \
            --continue-on-fail \
            --report "${{ runner.temp }}/report.html"
      - name: Stage report
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          if [ -f "${{ runner.temp }}/report.html" ]; then
            cp "${{ runner.temp }}/report.html" report-out/index.html
          else
            echo "<h1>No report produced</h1>" > report-out/index.html
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-doctest-tutorial-${{ matrix.os }}
          path: report-out/index.html
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Aggregate all doctest reports into a single gh-pages site and post a
  # summary comment on the nightly PR. Runs even when individual doctest
  # jobs fail — a failing run is exactly when you want to open the report.
  # ─────────────────────────────────────────────────────────────────────────
  publish-doctest-reports:
    name: Publish nightly doctest reports
    needs:
      - nightly-bump
      - doctest-cpp-sdk
      - doctest-liblogos
      - doctest-logoscore-cli
      - doctest-module-builder
      - doctest-basecamp
      - doctest-package-manager
      - doctest-rust-sdk
      - doctest-openmetrics
      - doctest-tutorial
    if: always() && needs.nightly-bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    # Serialize Pages pushes so concurrent nightly runs can't race on gh-pages.
    concurrency:
      group: gh-pages-nightly-publish
      cancel-in-progress: false

    steps:
      - name: Download all nightly doctest artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nightly-doctest-*

      - name: Arrange site directory
        id: arrange
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          BASE="nightly/$DATE"
          echo "date=$DATE"   >> "$GITHUB_OUTPUT"
          echo "base=$BASE"   >> "$GITHUB_OUTPUT"

          SUITES="cpp-sdk liblogos logoscore-cli module-builder basecamp package-manager rust-sdk openmetrics tutorial"
          mkdir -p "site/$BASE"
          found_suites=""

          for suite in $SUITES; do
            found_oses=""
            for os in ubuntu-latest macos-latest; do
              src="artifacts/nightly-doctest-${suite}-${os}/index.html"
              if [ -f "$src" ]; then
                mkdir -p "site/$BASE/$suite/$os"
                cp "$src" "site/$BASE/$suite/$os/index.html"
                found_oses="$found_oses $os"
              fi
            done
            if [ -n "$found_oses" ]; then
              found_suites="$found_suites $suite"
              # Per-suite landing page
              {
                printf '<!doctype html><meta charset=utf-8>\n'
                printf '<title>%s nightly doc-test \xe2\x80\x94 %s</title>\n' "$suite" "$DATE"
                printf '<style>body{font:16px system-ui;margin:40px;max-width:640px}a{color:#2563eb}</style>\n'
                printf '<h1>%s \xe2\x80\x94 %s</h1><ul>\n' "$suite" "$DATE"
                for os in ubuntu-latest macos-latest; do
                  if [ -d "site/$BASE/$suite/$os" ]; then
                    printf '<li><a href="./%s/">%s</a></li>\n' "$os" "$os"
                  fi
                done
                printf '</ul>\n'
              } > "site/$BASE/$suite/index.html"
            fi
          done

          echo "found_suites=${found_suites## }" >> "$GITHUB_OUTPUT"

          # Top-level nightly landing page — table of all suites x OSes
          {
            printf '<!doctype html><meta charset=utf-8>\n'
            printf '<title>Nightly doc-test reports \xe2\x80\x94 %s</title>\n' "$DATE"
            printf '<style>'
            printf 'body{font:16px system-ui;margin:40px;max-width:900px}'
            printf 'a{color:#2563eb}'
            printf 'table{border-collapse:collapse;width:100%%}'
            printf 'td,th{border:1px solid #e5e7eb;padding:8px 14px;text-align:left}'
            printf 'th{background:#f9fafb;font-weight:600}'
            printf '.pass{color:#16a34a}.fail{color:#dc2626}'
            printf '</style>\n'
            printf '<h1>Nightly doc-test reports</h1>\n'
            printf '<p>Date: <strong>%s</strong></p>\n' "$DATE"
            printf '<table><tr><th>Suite</th><th>ubuntu-latest</th><th>macos-latest</th></tr>\n'
            for suite in $SUITES; do
              if [ -d "site/$BASE/$suite" ]; then
                printf '<tr><td><a href="./%s/">%s</a></td>' "$suite" "$suite"
                for os in ubuntu-latest macos-latest; do
                  if [ -d "site/$BASE/$suite/$os" ]; then
                    printf '<td><a href="./%s/%s/">report</a></td>' "$suite" "$os"
                  else
                    printf '<td style="color:#9ca3af">not run</td>'
                  fi
                done
                printf '</tr>\n'
              fi
            done
            printf '</table>\n'
          } > "site/$BASE/index.html"

      - name: Deploy to gh-pages
        if: steps.arrange.outputs.found_suites != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          commit_message: "Publish nightly doc-test reports for ${{ steps.arrange.outputs.date }}"

      - name: Post report links on nightly PR
        if: steps.arrange.outputs.found_suites != ''
        uses: actions/github-script@v7
        with:
          script: |
            const date  = "${{ steps.arrange.outputs.date }}";
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const root  = `https://${owner}.github.io/${repo}/nightly/${date}`;
            const suites = "${{ steps.arrange.outputs.found_suites }}"
              .trim().split(/\s+/).filter(Boolean);

            const rows = suites.map(suite => {
              const cols = ["ubuntu-latest", "macos-latest"]
                .map(os => `[\`${os}\`](${root}/${suite}/${os}/)`)
                .join(" · ");
              return `| [\`${suite}\`](${root}/${suite}/) | ${cols} |`;
            }).join("\n");

            const marker = "<!-- nightly-doctest-report-links -->";
            const body =
              `${marker}\n` +
              `### Doc-test reports (${date})\n\n` +
              `| Suite | Reports |\n` +
              `|-------|--------|\n` +
              `${rows}\n\n` +
              `Full index: [nightly/${date}](${root}/) · ` +
              `_Pages can take a minute to update after the run finishes._`;

            // Find the open nightly/bump PR
            const { data: prs } = await github.rest.pulls.list({
              owner, repo,
              head: `${owner}:nightly/bump`,
              state: "open",
            });
            if (prs.length === 0) {
              core.info("No open nightly/bump PR — skipping comment");
              return;
            }
            const issue_number = prs[0].number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  # ─────────────────────────────────────────────────────────────────────────
  # Notify the logos-core team on any failure across the nightly run — the
  # bump/build/test job, any doctest suite, or the report publish. A tracking
  # issue is used (not a PR comment): a build/test failure aborts nightly-bump
  # before the PR is created, so there may be no PR to comment on. The team
  # @mention in the issue comment notifies every member of logos-co/logos-core.
  #
  # A single open issue (found via a hidden marker) is reused: each failure
  # adds a fresh comment (which re-notifies) rather than opening a new issue.
  # ─────────────────────────────────────────────────────────────────────────
  notify-on-failure:
    name: Notify logos-core on failure
    needs:
      - nightly-bump
      - doctest-cpp-sdk
      - doctest-liblogos
      - doctest-logoscore-cli
      - doctest-module-builder
      - doctest-basecamp
      - doctest-package-manager
      - doctest-rust-sdk
      - doctest-openmetrics
      - doctest-tutorial
      - publish-doctest-reports
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: Open or update failure issue and ping team
        uses: actions/github-script@v7
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const team  = "@logos-co/logos-core";
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Which needed jobs failed (skipped/cancelled are not failures).
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const failed = Object.entries(needs)
              .filter(([, v]) => v.result === "failure")
              .map(([k]) => k);

            const failList = failed.length
              ? failed.map(j => `- \`${j}\``).join("\n")
              : "- _(failure detected but no job reported `failure` — check the run)_";

            const marker = "<!-- nightly-bump-failure-tracker -->";
            const title  = "Nightly bump / doc-tests failing";

            const comment =
              `${team} the nightly run failed.\n\n` +
              `**Run:** ${runUrl}\n\n` +
              `**Failed jobs:**\n${failList}\n\n` +
              `_Posted automatically by the nightly-bump workflow._`;

            // Reuse a single open tracking issue (found via the hidden marker).
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100,
            });
            let issue = open.find(i => !i.pull_request && i.body?.includes(marker));

            if (!issue) {
              const created = await github.rest.issues.create({
                owner, repo, title,
                body:
                  `${marker}\n` +
                  `Tracking issue for nightly-bump / doc-test failures. ` +
                  `Each failing run adds a comment below pinging ${team}.\n\n` +
                  `Close this once the nightly run is green again — it will be ` +
                  `reopened automatically on the next failure.`,
              });
              issue = created.data;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number, body: comment,
            });
            core.info(`Notified ${team} on issue #${issue.number}`);
