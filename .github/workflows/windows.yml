name: Windows (cross)

# The INTEGRATION job. Per-repo Windows CI now lives in each repo as a ~14-line
# caller of logos-co/logos-nix/.github/workflows/windows-ci.yml; this one exists
# for the properties that only appear when the whole fleet is resolved together
# from one lock — chiefly the assembled Basecamp tree, which is built out of
# several derivations and whose C++ runtime topology no single repo can check.
#
# WHAT WAS DELETED HERE, AND WHY
#   The 250-line `--override-input` block that resolved 25 unmerged
#   `feat/windows-cross` branches at run time. Measured 2026-08-12: 20 repos now
#   expose `packages.x86_64-windows` from their OWN master lock, so the premise
#   of that block ("packages.x86_64-windows is EMPTY without the overrides") is
#   simply no longer true, and three of the branches it required no longer
#   exist — `resolve()` would `exit 1` on logos-liblogos, logos-basecamp and
#   logos-nix on the first run.
#   The ~180 lines of gate scripts, which are now in
#   logos-co/logos-nix/.github/actions/windows-gates and shared with 20 repos.
#
# PREREQUISITE, and it is a real one: this workspace's flake.lock is behind
# master on every Windows-capable input, so `.#packages.x86_64-windows` still
# evaluates to ZERO attributes. Until the lock is bumped, this job fails at the
# target-resolution step with a message naming the missing attribute. That is
# the intended behaviour — the alternative is a matrix leg that passes by having
# nothing to build, which is the exact trap this whole design is shaped around.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    uses: logos-co/logos-nix/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      targets: >-
        logos-logoscore-cli--ctl
        logos-logoscore-cli--cli
        logos-package--lgx
        logos-package-manager--cli-portable
        logos-package-downloader--cli
        logos-module--bin
        logos-capability-module--lib
        logos-capability-module--lgx-portable
        logos-liblogos--portable
        logos-basecamp
        logos-basecamp--main-ui-plugin
      # 40 is well under the ~200 PEs this actually produces, but far above zero.
      min-pes: 40
      lgx-variant: true
      # An app is assembled from more than one derivation. Basecamp's own output
      # deliberately does not contain liblogos_core.dll / libfmt.dll /
      # libspdlog.dll — those come from the logos-liblogos target and land in
      # bin/ when the payload is staged, which is exactly how it is deployed on
      # real Windows.
      assemble: >-
        {"logos-basecamp":
           ["logos-liblogos--portable/bin","logos-liblogos--portable/lib"],
         "logos-basecamp--main-ui-plugin":
           ["logos-basecamp/bin","logos-liblogos--portable/bin",
            "logos-liblogos--portable/lib"]}
      timeout-minutes: 240
      # Cold, this closure is ~123 derivations. The budget is deliberately above
      # that: the integration job is the one place a cold build is acceptable,
      # because it is also the job that pushes the result to cachix for the 20
      # per-repo callers.
      cold-derivation-budget: 200

      # The only gate that is genuinely workspace-specific.
      #
      # PE has no symbol interposition, so a function-local static exists once
      # per IMAGE. TokenManager::instance() is one. When Basecamp's exe and
      # main_ui.dll each linked their own copy of the qt-sdk archive the process
      # held THREE TokenManagers, the host saved a capability token into one and
      # the plugin read another, and every cross-module call was refused — 29
      # "rejecting unauthorized call" lines and a UI that never appeared.
      # Nothing crashed and nothing logged a link error. That topology is
      # invisible to every other gate: the binaries are the right format, the
      # imports resolve, the .lgx is fine.
      #
      # Checked BOTH ways, because each alone has a vacuous-pass mode. Counting
      # imports passes if the symbol is imported but also defined locally;
      # counting definitions passes if the image simply does not use the runtime.
      # Matched on the singleton's STORAGE, not on the accessor: ld emits an
      # auto-import THUNK named _ZN12TokenManager8instanceEv that looks exactly
      # like a definition and is not (measured on logosctl.exe: 1 thunk, 0
      # storage slots).
      extra-gates: |
        bad=0; checked=0
        for name in main_ui.dll LogosBasecamp.exe logosctl.exe; do
          mapfile -t copies < <(find stage -name "$name" -type f)
          if [ "${#copies[@]}" -eq 0 ]; then
            echo "::error::$name not staged — cannot check the runtime topology"; bad=1; continue
          fi
          for pe in "${copies[@]}"; do
            checked=$((checked + 1))
            imports=$("$OBJDUMP" -p "$pe" \
              | awk '/DLL Name: liblogos_core.dll/{f=1;next} f&&/DLL Name:/{exit} f')
            if [ -z "$imports" ]; then
              echo "::error::$pe does not import from liblogos_core.dll at all"
              echo "::error::the shared runtime is being linked per-image again"; bad=1; continue
            fi
            tm=$(printf '%s\n' "$imports"  | grep -c 'TokenManager' || true)
            api=$(printf '%s\n' "$imports" | grep -c 'LogosAPI'     || true)
            echo "$pe imports: TokenManager=$tm LogosAPI*=$api"
            if [ "$tm" -lt 1 ] || [ "$api" -lt 1 ]; then
              echo "::error::$pe: expected >=1 TokenManager and >=1 LogosAPI* import, got $tm/$api"; bad=1
            fi
            defs=$("$OBJDUMP" -t "$pe" \
              | grep -c '_ZZN12TokenManager8instanceEvE8instance' || true)
            echo "$pe owns TokenManager storage: $defs (must be 0)"
            if [ "$defs" -ne 0 ]; then
              echo "::error::$pe carries its own TokenManager instance ($defs storage slots)"; bad=1
            fi
          done
        done
        [ "$checked" -ge 3 ] || { echo "::error::checked only $checked PEs"; bad=1; }
        [ "$bad" -eq 0 ]

      # Runs under wine on the builder AND on a real windows-latest runner.
      # The second of those is the thing this project has never had: until now
      # every Windows result was hand-driven against real hardware, and the only
      # native Windows job in the org (logos-design-system's storybook-windows)
      # builds with MSVC and Qt 6.7.3 — a different ABI from the mingw-w64 UCRT
      # Qt 6.11.1 everything else ships, so it does not cover these binaries.
      smoke: |
        run logos-logoscore-cli--ctl/bin/logosctl.exe --version | tee ctl.txt
        grep -qi version ctl.txt
        run logos-module--bin/bin/lm.exe --version | grep -qi version

        # The load test. lm.exe shares LogosModule::loadFromPath with
        # logos_host_qt.exe, so this exercises the real module-loading path: the
        # plugin sits in its OWN directory (as lgpm installs it) while the shared
        # runtime sits beside the executable.
        mkdir -p wt/bin wt/modules/capability_module
        cp -L logos-logoscore-cli--ctl/bin/*.dll wt/bin/
        cp -L logos-module--bin/bin/lm.exe wt/bin/
        cp -L logos-capability-module--lib/lib/capability_module_plugin.dll \
              wt/modules/capability_module/
        set +e
        run wt/bin/lm.exe metadata \
          "$STAGE_ABS/wt/modules/capability_module/capability_module_plugin.dll" \
          > load.out 2> load.err
        rc=$?
        set -e
        cat load.out
        [ "$rc" -eq 0 ] || { echo "::error::module load failed (rc=$rc)"; cat load.err; exit 1; }
        grep -q capability_module load.out || { echo "::error::load produced no metadata"; exit 1; }

        # The pre-load that resolves a plugin's private DLLs fails SOFT by
        # design, so the plain load can still succeed while the mechanism is
        # broken — that is exactly how a regression slipped through once already.
        # LOAD_WITH_ALTERED_SEARCH_PATH substitutes the module's directory for
        # the application's instead of adding to it, and the only symptom was
        # this warning. Assert on stderr or the gate is blind.
        if grep -q 'dependency pre-load failed' load.err; then
          echo "::error::the Windows DLL-search pre-load regressed:"; grep 'dependency pre-load failed' load.err; exit 1
        fi
