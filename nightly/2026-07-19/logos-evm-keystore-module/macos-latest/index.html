tput": "Found 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ncapability_module              1.0.0           core       security       \nkeystore_module                1.0.0           core       wallet         \n", "note": ""}]}, {"md": "## Step 3: Run the daemon and drive the keystore\n\nStart `logoscore` pointed at `./modules`, load the module, and call it. We\nuse Foundry's well-known test key (account 0,\n`0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266`). Note that `logoscore`'s `call`\nauto-types a `0x\u2026` argument as a number, so addresses are passed as **bare\nhex** \u2014 the keystore accepts either form.", "execs": []}, {"md": "### 3.1 Write an unsigned transaction\n\n```json\n{\n  \"to\": \"0x70997970C51812dc3A010C7d01b50e0d17dc79C8\",\n  \"value\": \"0xde0b6b3a7640000\",\n  \"nonce\": \"0x0\",\n  \"gas_limit\": \"0x5208\",\n  \"max_fee_per_gas\": \"0x77359400\",\n  \"max_priority_fee_per_gas\": \"0x3b9aca00\",\n  \"fee_mode\": \"eip1559\"\n}\n```", "execs": [{"kind": "file", "cmd": "write tx.json", "status": "pass", "note": "Wrote tx.json"}]}, {"md": "### 3.2 Start the daemon\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```", "execs": [{"kind": "run", "cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "```bash\nsleep 3\n```", "execs": [{"kind": "run", "cmd": "sleep 3", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 3.3 Load the module\n\n```bash\nlogoscore load-module keystore_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore load-module keystore_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies_loaded\":[],\"module\":\"keystore_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "note": ""}]}, {"md": "### 3.4 Introspect the module\n\n```bash\nlogoscore module-info keystore_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore module-info keystore_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies\":[],\"dependents\":[],\"events\":[{\"name\":\"accounts_changed\",\"parameters\":[{\"name\":\"count\",\"type\":\"int\"}],\"signature\":\"accounts_changed(int)\",\"type\":\"event\"}],\"methods\":[{\"isInvokable\":true,\"name\":\"create_mnemonic\",\"parameters\":[{\"name\":\"words\",\"type\":\"int\"}],\"returnType\":\"QString\",\"signature\":\"create_mnemonic(int)\"},{\"isInvokable\":true,\"name\":\"import_mnemonic\",\"parameters\":[{\"name\":\"params_json\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"import_mnemonic(QString)\"},{\"isInvokable\":true,\"name\":\"new_account\",\"parameters\":[{\"name\":\"password\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"new_account(QString)\"},{\"isInvokable\":true,\"name\":\"import_private_key\",\"parameters\":[{\"name\":\"priv_hex\",\"type\":\"QString\"},{\"name\":\"password\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"import_private_key(QString,QString)\"},{\"isInvokable\":true,\"name\":\"import_keystore_json\",\"parameters\":[{\"name\":\"key_json\",\"type\":\"QString\"},{\"name\":\"password\",\"type\":\"QString\"},{\"name\":\"new_password\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"import_keystore_json(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"export_keystore_json\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"password\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"export_keystore_json(QString,QString)\"},{\"isInvokable\":true,\"name\":\"list_accounts\",\"returnType\":\"QString\",\"signature\":\"list_accounts()\"},{\"isInvokable\":true,\"name\":\"has_address\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"has_address(QString)\"},{\"isInvokable\":true,\"name\":\"delete_account\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"password\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"delete_account(QString,QString)\"},{\"isInvokable\":true,\"name\":\"unlock\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"password\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"unlock(QString,QString)\"},{\"isInvokable\":true,\"name\":\"timed_unlock\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"password\",\"type\":\"QString\"},{\"name\":\"seconds\",\"type\":\"int\"}],\"returnType\":\"bool\",\"signature\":\"timed_unlock(QString,QString,int)\"},{\"isInvokable\":true,\"name\":\"lock\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"lock(QString)\"},{\"isInvokable\":true,\"name\":\"is_unlocked\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"}],\"returnType\":\"bool\",\"signature\":\"is_unlocked(QString)\"},{\"isInvokable\":true,\"name\":\"sign_transaction\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"unsigned_tx_json\",\"type\":\"QString\"},{\"name\":\"chain_id\",\"type\":\"int\"}],\"returnType\":\"QString\",\"signature\":\"sign_transaction(QString,QString,int)\"},{\"isInvokable\":true,\"name\":\"sign_message\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"message\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"sign_message(QString,QString)\"},{\"isInvokable\":true,\"name\":\"sign_digest\",\"parameters\":[{\"name\":\"address\",\"type\":\"QString\"},{\"name\":\"digest_hex\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"sign_digest(QString,QString)\"}],\"name\":\"keystore_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"}\n", "note": ""}]}, {"md": "### 3.5 Generate a BIP-39 mnemonic\n\n```bash\nlogoscore call keystore_module create_mnemonic 12\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call keystore_module create_mnemonic 12", "status": "pass", "exit_code": 0, "output": "{\"method\":\"create_mnemonic\",\"module\":\"keystore_module\",\"result\":\"{\\\"ok\\\":true,\\\"phrase\\\":\\\"message dignity fatal duck camera more soft maze lion tenant opinion text\\\"}\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 3.6 Import a known private key\n\nImport Foundry's account-0 private key under a passphrase. The module\nreturns only the **address** \u2014 the key stays inside the scrypt vault.\n\n```bash\nlogoscore call keystore_module import_private_key <privkey> pw\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call keystore_module import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 pw", "status": "pass", "exit_code": 0, "output": "{\"method\":\"import_private_key\",\"module\":\"keystore_module\",\"result\":\"{\\\"address\\\":\\\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\\\",\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 3.7 List accounts\n\n```bash\nlogoscore call keystore_module list_accounts\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call keystore_module list_accounts", "status": "pass", "exit_code": 0, "output": "{\"method\":\"list_accounts\",\"module\":\"keystore_module\",\"result\":\"{\\\"accounts\\\":[\\\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\\\"],\\\"ok\\\":true}\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 3.8 Unlock the account\n\n```bash\nlogoscore call keystore_module unlock <address> pw\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call keystore_module unlock f39fd6e51aad88f6f4ce6ab8827279cfffb92266 pw", "status": "pass", "exit_code": 0, "output": "{\"method\":\"unlock\",\"module\":\"keystore_module\",\"result\":true,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 3.9 Sign a message (EIP-191)\n\n```bash\nlogoscore call keystore_module sign_message <address> hello-logos\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call keystore_module sign_message f39fd6e51aad88f6f4ce6ab8827279cfffb92266 hello-logos", "status": "pass", "exit_code": 0, "output": "{\"method\":\"sign_message\",\"module\":\"keystore_module\",\"result\":\"{\\\"ok\\\":true,\\\"signature\\\":\\\"0x0eb9f28352f7922f2cbd640d4569c5dce34e261a78413a14f029f34e3fdb6685799fe51ca446a9998cba505370e0f4e11cb8ae05d0cdef67f44fb940f04c693b1c\\\"}\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 3.10 Sign an EIP-1559 transaction\n\n`sign_transaction` signs the unsigned tx in `tx.json` for chain 1 and\nreturns the raw, broadcast-ready signed transaction (a `0x02\u2026` typed\nenvelope).\n\n```bash\nlogoscore call keystore_module sign_transaction <address> @tx.json 1\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call keystore_module sign_transaction f39fd6e51aad88f6f4ce6ab8827279cfffb92266 @tx.json 1", "status": "pass", "exit_code": 0, "output": "{\"method\":\"sign_transaction\",\"module\":\"keystore_module\",\"result\":\"{\\\"ok\\\":true,\\\"raw\\\":\\\"0x02f8720180843b9aca0084773594008252089470997970c51812dc3a010c7d01b50e0d17dc79c8880de0b6b3a764000080c001a0f0ba48916ebee181441ffc4b3212581d3fd537820d2aa16a012bbce6e8c67c2ea07f481077ed906ed6af6b5282bc5ff6b7dd6f9a70a09c7690eddfb9961a9b3e32\\\"}\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 3.11 Stop the daemon\n\n```bash\nlogoscore stop\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 3.12 Confirm the daemon has stopped\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"36d3d577ae9c\",\"status\":\"not_running\",\"version\":\"pre-release-733ca45\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
</body>
