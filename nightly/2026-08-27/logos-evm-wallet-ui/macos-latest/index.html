AAEAgAgAAAAIRAAAAEIgAAACAQAQAAAAEIgAAACAQAQAAAIEIAAAACEQAAABAIAIAAAAC+T/GLYknr9qDWgAAAABJRU5ErkJggg==)\n\nA rendered, interactive UI whose **Apply proxy** action flips the status\nto *Proxy applied* is end-to-end proof that the QML view, the bundled\n`wallet_backend_module`, and its dependency modules are wired together\nover the Logos bridge \u2014 the call only returns (and the status only\nupdates) because the whole module tree loaded. The captured screenshots\nare embedded above and in the CI report."}]}, {"meta": {"name": "Wallet UI end-to-end: configure a network, import, unlock, send", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Wallet UI end-to-end: configure a network, import, unlock, send\n\nThis doc-test drives the `logos-evm-wallet-ui` standalone app **headless**\nthrough a full wallet flow \u2014 the same end-to-end validation the\n[`wallet-backend` runtime doc-test](https://github.com/logos-co/logos-evm-wallet-backend-module)\nperforms against the coordinator, but here **every step goes through the real\nQML UI** over the Logos bridge.\n\nIt launches the app with `QT_QPA_PLATFORM=offscreen`, drives it with\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp), and on the new\n**Advanced** tab points the wallet at a **local mock JSON-RPC node**, then\nimports Foundry's well-known test account, unlocks it, sends a native transfer,\nand confirms it lands in History \u2014 proving the UI \u2192 C++ backend \u2192\n`wallet_backend_module` \u2192 eth-rpc / keystore round-trips end to end.\n\n**What you'll build:** The wallet UI standalone app, launched headless and driven through its Advanced, Send, and History tabs against a local mock JSON-RPC node.\n\n**What you'll learn:**\n\n- How the Advanced tab repoints the wallet at a custom RPC endpoint (setChains / testEndpoint)\n- How to import and unlock an account and send a native transfer entirely through the UI\n- How a UI-initiated send composes build \u2192 sign \u2192 broadcast \u2192 record across the backend module tree\n\n## Prerequisites\n\n- **Nix** with flakes enabled (see [nixos.org](https://nixos.org/download.html)).\n\n- **A Linux or macOS machine** with `python3` available (for the local mock JSON-RPC node). The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required."}, {"execs": [], "md": "## Step 1: Build the qt-mcp test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) connects to the\napp's QML inspector and drives it. Build it once and link it as\n`./result-mcp`."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-qt-mcp' -o result-mcp --override-input logos-nix github:logos-co/logos-nix/f55bf91b8a723ee5c27c39c773b034255538d280", "exit_code": 0, "kind": "run", "note": "", "output": "warning: not writing modified lock file of flake 'github:logos-co/logos-qt-mcp':\n\u2022 Updated input 'logos-nix':\n    'github:logos-co/logos-nix/0e9e6d6' (2026-03-19)\n  \u2192 'github:logos-co/logos-nix/f55bf91' (2026-08-14)\n\u2022 Added input 'logos-nix/nixpkgs-windows':\n    'github:NixOS/nixpkgs/b5aa0fb' (2026-06-29)\n", "status": "pass"}], "md": "### 1.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-qt-mcp' -o result-mcp\n```"}, {"execs": [], "md": "## Step 2: Start a local mock JSON-RPC node\n\nThe wallet is pointed at this node (chain id 1337) from the UI's Advanced\ntab. It answers the methods the send pipeline needs with canned values, so\nthe run is offline and deterministic."}, {"execs": [{"cmd": "write mock_node.py", "kind": "file", "note": "Wrote mock_node.py", "status": "pass"}], "md": "### 2.1 Write the mock node\n\n```\nimport http.server, json\nRES = {\n    \"eth_chainId\": \"0x539\",                 # 1337\n    \"eth_getTransactionCount\": \"0x0\",\n    \"eth_gasPrice\": \"0x3b9aca00\",\n    \"eth_estimateGas\": \"0x5208\",\n    \"eth_sendRawTransaction\": \"0x\" + \"ab\" * 32,\n}\nclass H(http.server.BaseHTTPRequestHandler):\n    def do_POST(self):\n        n = int(self.headers.get('content-length', 0))\n        req = json.loads(self.rfile.read(n) or b'{}')\n        body = json.dumps({\"jsonrpc\": \"2.0\", \"id\": req.get(\"id\", 1),\n                           \"result\": RES.get(req.get(\"method\"), \"0x0\")}).encode()\n        self.send_response(200)\n        self.send_header('content-length', str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n    def log_message(self, *a): pass\nhttp.server.HTTPServer(('127.0.0.1', 8613), H).serve_forever()\n```"}, {"execs": [{"cmd": "sh -c 'python3 mock_node.py > mock.log 2>&1 & echo $! > mock.pid'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.2 Start the mock node\n\n```bash\npython3 mock_node.py &\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [], "md": "## Step 3: Launch the wallet UI and drive the full flow\n\nLaunch the standalone app with `nix run`. It bundles\n`wallet_backend_module` and its dependency modules and auto-loads them, so a\nUI that can drive a send is itself proof the whole module tree is wired.\n\n> The first launch builds the full app bundle (the UI plugin, the backend and\n> its dependencies, and the standalone-app shell), so we allow a generous\n> timeout."}, {"execs": [{"cmd": "nix run github:logos-co/logos-evm-wallet-ui/9073d3dadfa22218085f413aeb99cf8f0f8d8de6 --no-write-lock-file --override-input eth_rpc_module github:logos-co/logos-evm-eth-rpc-module/a257d9e422fd22e5d92cdafb8bc04787bc5d3895 --override-input keystore_module github:logos-co/logos-evm-keystore-module/0c99a9852926d08862161519bc7d3ff64ce51339 --override-input logos-module-builder github:logos-co/logos-module-builder/464a75d95f3d4e5d1121437480f608ec0a798499 --override-input railgun_module github:logos-co/logos-evm-railgun-module/55b5fd0b0cf6adbd46e0c5aadc5a8e253e0bfd65 --override-input token_list_module github:logos-co/logos-evm-token-list-module/84500d99c77feb6e36e11b5583b89ebd36ea0a0b --override-input uniswap_module github:logos-co/logos-evm-uniswap-module/2ea2fcbad4aa55622124354b63aacae02e4ce0ad --override-input wallet_backend_module github:logos-co/logos-evm-wallet-backend-module/dfc3dd59d8259b00dd58cfe2db9bb463c28920bd -- --height 2000 --user-dir ./session\n\n# test actions:\n- App window opens on the Balances tab: wait for ['Logos Wallet', 'Accounts']\n- Switch to the Advanced tab: call 'walletRoot'.selectTab(7)\n- Advanced tab rendered: wait for ['Custom network']\n- Enter the chain id: set objectName='advChainIdField' to '1337'\n- Enter the network name: set objectName='advChainNameField' to 'Local Mock'\n- Enter the RPC URL (the local mock node): set objectName='advRpcUrlField' to 'http://127.0.0.1:8613'\n- Enter the native symbol: set objectName='advSymbolField' to 'ETH'\n- Test the endpoint (UI \u2192 backend \u2192 eth-rpc \u2192 mock node): click 'Test endpoint'\n- Endpoint is reachable: wait for ['Endpoint reachable']\n- Save the chain (repoints the wallet): click 'Save chain'\n- Chain saved (status flips): wait for ['Chains updated']\n- Enter the seed phrase: set objectName='advSeedField' to 'test test test test test test test test test test test junk'\n- Enter the account passphrase: set objectName='advAcctPwField' to 'pw'\n- Import the account: click 'Import'\n- Account imported (status flips): wait for ['Account imported']\n- Unlock the imported account: click 'Unlock imported'\n- Account unlocked (status flips): wait for ['Unlocked']\n- Switch to the Send tab: call 'walletRoot'.selectTab(2)\n- Send tab rendered: wait for ['Estimate']\n- Enter the recipient (Foundry account #1): set objectName='sendToField' to '0x70997970C51812dc3A010C7d01b50e0d17dc79C8'\n- Enter the amount (1 ETH in wei, hex): set objectName='sendAmountField' to '0xde0b6b3a7640000'\n- Send (build \u2192 sign \u2192 broadcast \u2192 record): click 'Send transaction'\n- Na <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
