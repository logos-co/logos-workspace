we verify the callee side \u2014 the module\nthat exposes Rust functions as IPC methods.\n\nThe steps are:\n\n1. Build the `logoscore` CLI and the `lgpm` local package manager from their\n   published flakes.\n2. Write the module from scratch: a `.lidl` contract, a Rust crate that\n   generates its C-ABI scaffold from it at build time, and the three Logos\n   config files (`metadata.json`, `CMakeLists.txt`, `flake.nix`).\n3. Build it into an installable `.lgx` package via the flake's `#lgx` output,\n   and install it into a `./modules` directory with `lgpm`.\n4. Start `logoscore` in daemon mode, load `rust_provider_module`, introspect it\n   with `module-info`, and call its methods \u2014 verifying real values round-trip\n   out of the Rust code over liblogos' IPC.\n\nA green run is real evidence that the cdylib authoring pipeline (`.lidl` \u2192\nlidl-gen scaffold + cargo static archive \u2192 generated Qt glue \u2192 loadable\nmodule) works and that the module is callable through a real `logoscore`\ndaemon.\n\n**What you'll build:** A `rust_provider_module` whose logic is pure Rust authored on the common cdylib C ABI, packaged as `.lgx`, installed with `lgpm`, and called through a `logoscore` daemon.\n\n**What you'll learn:**\n\n- How to write a Logos module whose implementation is pure safe Rust (no C++, no unsafe)\n- How a `.lidl` contract drives both generators \u2014 lidl-gen's Rust C-ABI scaffold and the builder's uniform Qt glue (`interface: cdylib`)\n- How the module's flake compiles the Rust `staticlib` with `buildRustPackage` and exposes a ready-to-install `.lgx`\n- How to install an `.lgx` into a modules directory with `lgpm`\n- How to start the `logoscore` daemon, load the module, introspect it, and call its methods\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine.** Nix provides the Rust toolchain (cargo, rustc) during the build, so you don't need a separate Rust install.", "execs": []}, {"md": "## Step 1: Build logoscore\n\nBuild the `logoscore` CLI from its published flake. The result is symlinked\nto `./logos/`. `logoscore` is the headless frontend for `logos-liblogos`, so\nthis one build brings in the whole module-runtime stack the daemon needs.\n\n> The cdylib authoring path currently lives on the protocol-extraction\n> branches, so we pin `logoscore` to the matching branch head. Once the\n> chain merges, drop the pin and build plain\n> `github:logos-co/logos-logoscore-cli`.", "execs": []}, {"md": "### 1.1 Build the CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli/616cb079a5828caecfafd6d4e432519c864e3fb1' --out-link ./logos\n```\n\nThe build produces `logos/bin/logoscore` plus bundled runtime libraries\nand a `logos/modules/` directory containing the built-in\n`capability_module` (required for the auth handshake when loading\nmodules in daemon mode).", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-logoscore-cli/616cb079a5828caecfafd6d4e432519c864e3fb1' --out-link ./logos", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-logoscore-cli/616cb079a5828caecfafd6d4e432519c864e3fb1' into the Git cache...\nunpacking 'github:logos-co/logos-cpp-sdk/b86ff877f36b7f8e7d0b051fca0a6cf5940a20bd?narHash=sha256-GuYeKF6Ii4ShcxlHsytY0AYfVtOtV9r3bORU6UG7lxA%3D' into the Git cache...\nunpacking 'github:logos-co/logos-liblogos/cf793ea8e7b530aa77074d5f4143d784abe8c656?narHash=sha256-Cr5WBHFwpxEqbx1W9pYdHKWIvJJQ4NQBAY1OmkcNiao%3D' into the Git cache...\nunpacking 'github:logos-co/logos-module/194778491ef4dd36967ac40cc2fec6b8a8b1d660?narHash=sha256-ehePoUEd/u3Ng0TvCmjocXYJWWH6P61PA7tNpgV59lo%3D' into the Git cache...\nunpacking 'github:logos-co/logos-package-manager/9101 ked):\n  /nix/store/mvqb0zlmlynaql883w9229gxmahd9ixn-logos-package-manager-cli-1.0.0\ncopying path '/nix/store/mvqb0zlmlynaql883w9229gxmahd9ixn-logos-package-manager-cli-1.0.0' from 'https://logos-co.cachix.org'...\n", "note": ""}]}, {"md": "## Step 3: Write the Rust module\n\nThe module's logic lives in a small Rust crate compiled to a **static\narchive** (`crate-type = [\"staticlib\"]`). You do not write any\n`extern \"C\"` functions: the crate's `build.rs` feeds the `.lidl` contract\nto `lidl-gen`, which generates the typed trait plus the module-impl C ABI\nexports into `OUT_DIR`. Your code is a plain trait impl.\n\nLay the crate out under `rust-lib/`:\n\n```\nrust-provider-module/\n\u251c\u2500\u2500 flake.nix                          # Nix build (compiles the crate, wraps it as a module)\n\u251c\u2500\u2500 metadata.json                      # Module metadata; interface = \"cdylib\"\n\u251c\u2500\u2500 CMakeLists.txt                     # Links the static archive into the generated glue plugin\n\u2514\u2500\u2500 rust-lib/\n    \u251c\u2500\u2500 Cargo.toml                     # crate-type = [\"staticlib\"]\n    \u251c\u2500\u2500 build.rs                       # .lidl -> generated scaffold (lidl-gen)\n    \u251c\u2500\u2500 rust_provider_module.lidl      # the contract \u2014 single source of truth\n    \u2514\u2500\u2500 src/lib.rs                     # the trait impl (pure safe Rust)\n```", "execs": []}, {"md": "### 3.1 Write the LIDL contract\n\nCreate `rust-lib/rust_provider_module.lidl`. This is the **source of\ntruth for the module's IPC API**: both the Rust scaffold and the Qt\nglue are generated from it, so the two sides can never drift apart.\n`int` maps to `i64`, `tstr` to `String`:\n\n```text\nmodule rust_provider_module {\n  version \"1.0.0\"\n  description \"Example Logos module with logic implemented in pure Rust\"\n  method add(a: int, b: int) -> int\n  method multiply(a: int, b: int) -> int\n  method factorial(n: int) -> int\n  method fibonacci(n: int) -> int\n  method is_prime(n: int) -> int\n  method greet(name: tstr) -> tstr\n  method libVersion() -> tstr\n}\n```\n\nMethod names are exposed over IPC exactly as declared \u2014 `is_prime`\nstays `is_prime`, `libVersion` stays `libVersion`. (In the trait the\nRust-side names are snake_cased, so `libVersion` becomes\n`fn lib_version`.)", "execs": [{"kind": "file", "cmd": "write rust-lib/rust_provider_module.lidl", "status": "pass", "note": "Wrote rust-lib/rust_provider_module.lidl"}]}, {"md": "### 3.2 Create the crate manifest\n\nCreate `rust-lib/Cargo.toml`. The crate depends on `logos-rust-sdk`\n(the generated `accept_token` export hands host-issued auth tokens to\nthe SDK's protocol stack) and, at build time, on `logos-lidl-gen` \u2014\nboth straight from the SDK's git repository:\n\n```toml\n[package]\nname = \"rust_provider\"\nversion = \"1.0.0\"\nedition = \"2021\"\n\n# Standalone crate \u2014 the empty table keeps cargo from adopting any\n# workspace it finds in a parent directory.\n[workspace]\n\n[lib]\ncrate-type = [\"staticlib\"]\n\n[dependencies]\nserde_json = \"1\"\nlogos-rust-sdk = { git = \"https://github.com/logos-co/logos-rust-sdk\", rev = \"d85d49b71d2b1316b70f40ee49644cdf8e84a57f\" }\n\n[build-dependencies]\nlogos-lidl-gen = { git = \"https://github.com/logos-co/logos-rust-sdk\", rev = \"d85d49b71d2b1316b70f40ee49644cdf8e84a57f\" }\n```\n\n> The `rev` pins the extraction-chain head the cdylib path currently\n> lives on; once the chain merges to master you can drop the `rev`\n> (or pin a release tag).", "execs": [{"kind": "file", "cmd": "write rust-lib/Cargo.toml", "status": "pass", "note": "Wrote rust-lib/Cargo.toml"}]}, {"md": "### 3.3 Write the build script\n\nCreate `rust-lib/build.rs`. It parses the `.lidl` contract and writes\nthe generated scaffold \u2014 the typed `RustProviderModule` trait, typed\nevent emitters (none here), `RustModuleContext`, and the\n`#[no_mangle] logos_module_*` C exports \u2014 into `OUT_DIR`:\n\n```rust\n//! Generates the module-impl C ABI scaffold (logos_module_* exports, typed\n//! trait, RustModuleContext) from the .lidl contract \u2014 the Rust half of the\n//! cdylib authoring path. The Qt glue half is generated from the same\n//! contract by logos-module-builder (interface = \"cdylib\").\n\nfn main() {\n    let manifest = std::env::var(\"CARGO_MANIFEST_DIR\").unwrap();\n    let lidl = std::path::Path::new(&manifest).join(\"rust_provider_module.lidl\");\n    println!(\"cargo:rerun-if-changed={}\", lidl.display());\n\n    let source = std::fs::read_to_string(&lidl).expect(\"read .lidl contract\");\n    let module = logos_lidl_gen::parse(&source).expect(\"parse .lidl contract\");\n\n    // The logos-protocol semver this module is built against (surfaced via\n    // logos_module_get_protocol_version). Overridable by the build.\n    let version =\n        std::env::var(\"LOGOS_PROTOCOL_VERSION\").unwrap_or_else(|_| \"0.1.0\".to_string());\n    let code = logos_lidl_gen::generate_provider(&module, &version);\n\n    let out = std::path::Path::new(&std::env::var(\"OUT_DIR\").unwrap()).join(\"provider_gen.rs\");\n    std::fs::write(&out, code).expect(\"write generated provider scaffold\");\n}\n```", "execs": [{"kind": "file", "cmd": "write rust-lib/build.rs", "status": "pass", "note": "Wrote rust-lib/build.rs"}]}, {"md": "### 3.4 Write the module logic\n\nCreate `rust-lib/src/lib.rs`. `include!` pulls in the generated\nscaffold; you implement the `RustProviderModule` trait on a plain\nstruct and define the **install hook** \u2014 a `#[no_mangle]` function the\ngenerated dispatch invokes lazily on the first call. Strings cross the\nboundary as plain `String`s: no C pointers, no manual frees, no\n`unsafe` anywhere in your code:\n\n```rust\n//! Pure-Rust Logos module on the common cdylib authoring path.\n//!\n//! The module-impl C ABI exports (logos_module_*) come from the scaffold\n//! lidl-gen generates from the .lidl contract at build time; the author\n//! code is just this trait impl plus the install hook. No unsafe, no\n//! hand-written C signatures, no manual string memory management.\n\ninclude!(concat!(env!(\"OUT_DIR\"), \"/provider_gen.rs\"));\n\n#[derive(Default)]\nstruct RustProviderImpl;\n\nimpl RustProviderModule for RustProviderImpl {\n    /// Add two integers.\n    fn add(&mut self, a: i64, b: i64) -> i64 {\n        a + b\n    }\n\n    /// Multiply two integers (saturating on overflow).\n    fn multiply(&mut self, a: i64, b: i64) -> i64 {\n        a.saturating_mul(b)\n    }\n\n    /// Compute n! (factorial). Returns -1 on overflow or negative input.\n    fn factorial(&mut self, n: i64) -> i64 {\n        if n < 0 {\n            return -1;\n        }\n        let mut result: i64 = 1;\n        for i in 2..=n {\n            result = match result.checked_mul(i) {\n                Some(v) => v,\n                None => return -1,\n            };\n        }\n        result\n    }\n\n    /// Compute the nth Fibonacci number. Returns -1 on overflow or negative input.\n    fn fibonacci(&mut self, n: i64) -> i64 {\n        if n < 0 {\n            return -1;\n        }\n        if n < 2 {\n            return n;\n        }\n        let (mut a, mut b) = (0i64, 1i64);\n        for _ in 2..=n {\n            let next = match a.checked_add(b) {\n                Some(v) => v,\n                None => return -1,\n            };\n            a = b;\n            b = next;\n        }\n        b\n    }\n\n    /// Return 1 if n is prime, 0 otherwise.\n    fn is_prime(&mut self, n: i64) -> i64 {\n        if n < 2 {\n            return 0;\n        }\n        if n == 2 {\n            return 1;\n        }\n        if n % 2 == 0 {\n            return 0;\n        }\n        let mut i = 3i64;\n        while i * i <= n {\n            if n % i == 0 {\n                return 0;\n            }\n            i += 2;\n        }\n        1\n    }\n\n    /// Greet the given name \u2014 strings cross the boundary as plain `String`s.\n    fn greet(&mut self, name: String) -> String {\n        let who = if name.is_empty() { \"World\".to_string() } else { name };\n        format!(\"Hello, {}! (from Rust provider)\", who)\n    }\n\n    /// Return the provider library version string.\n    fn lib_version(&mut self) -> String {\n        \"1.0.0\".to_string()\n    }\n}\n\n#[no_mangle]\npub extern \"Rust\" fn logos_module_install() {\n    install::<RustProviderImpl>();\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_add() {\n        assert_eq!(RustProviderImpl.add(2, 3), 5);\n    }\n\n    #[test]\n    fn test_factorial() {\n        assert_eq!(RustProviderImpl.factorial(5), 120);\n    }\n\n    #[test]\n    fn test_is_prime() {\n        assert_eq!(RustProviderImpl.is_prime(7), 1);\n        assert_eq!(RustProviderImpl.is_prime(4), 0);\n    }\n}\n```\n\nThe generated `install::<T>()` registers your impl; the first\n`logos_module_dispatch` call invokes `logos_module_install()` lazily \u2014\na plain symbol reference, so static linking always pulls your object\nin (no ctor/init-section tricks needed).", "execs": [{"kind": "file", "cmd": "write rust-lib/src/lib.rs", "status": "pass", "note": "Wrote rust-lib/src/lib.rs"}]}, {"md": "## Step 4: Configure the Logos module\n\nThree small config files turn the Rust crate into a Logos module:\n`metadata.json` (declares the module and points the builder at the\ncontract), `CMakeLists.txt` (links the static archive into the generated\nglue plugin), and `flake.nix` (compiles the crate and drives\n`mkLogosModule`).", "execs": []}, {"md": "### 4.1 `metadata.json` \u2014 module + codegen config\n\n`interface: \"cdylib\"` selects the cdylib authoring path, and\n`codegen.lidl` points at the contract. From it the builder generates\nthe uniform Qt-plugin glue into `generated_code/` and compiles it into\nthe plugin. No Rust toolchain is listed here \u2014 the crate is built by\n`buildRustPackage` in the flake, not inside the module derivation.\n\n```json\n{\n  \"name\": \"rust_provider_module\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Example Logos module with logic implemented in pure Rust \u2014 provides math operations callable by other modules\",\n  \"author\": \"Logos Core Team\",\n  \"type\": \"core\",\n  \"interface\": \"cdylib\",\n  \"category\": \"general\",\n  \"main\": \"rust_provider_module_plugin\",\n  \"dependencies\": [],\n  \"include\": [],\n  \"capabilities\": [],\n\n  \"codegen\": {\n    \"lidl\": \"rust-lib/rust_provider_module.lidl\"\n  },\n\n  \"nix\": {\n    \"external_libraries\": [],\n    \"packages\": {\n      \"build\": [],\n      \"runtime\": []\n    },\n    \"cmake\": {\n      \"find_packages\": [],\n      \"extra_include_dirs\": []\n    }\n  }\n}\n```\n\nThe builder also stamps `logos_protocol_version` into the embedded\nmetadata automatically \u2014 the one number that governs Logos load/call\ncompatibility \u2014 so the host can check it before loading.", "execs": [{"kind": "file", "cmd": "write metadata.json", "status": "pass", "note": "Wrote metadata.json"}]}, {"md": "### 4.2 `CMakeLists.txt` \u2014 link the Rust archive\n\n`logos_module()` (from `logos-module-builder`) defines the plugin\ntarget and compiles the generated glue. You then locate the Rust\nstatic archive in `lib/` and link it \u2014 re-mentioning the\n`logos-protocol` target *after* the archive so single-pass linkers\n(GNU ld) can resolve the archive's `lp_*` references against it. That\ngives the plugin **one** protocol stack shared by the glue and the\nRust code.\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(RustProviderModulePlugin LANGUAGES CXX)\n\nif(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})\n    include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\nelse()\n    message(FATAL_ERROR \"LogosModule.cmake not found. LOGOS_MODULE_BUILDER_ROOT is not set.\")\nendif()\n\nconfigure_file(${CMAKE_CURRENT_SOURCE_DIR}/metadata.json\n               ${CMAKE_CURRENT_BINARY_DIR}/metadata.json COPYONLY)\n\nlogos_module(\n    NAME rust_provider_module\n)\n\nfind_library(LIBRUST_PROVIDER\n    NAMES librust_provider.a rust_provider\n    PATHS ${CMAKE_CURRENT_SOURCE_DIR}/lib\n    NO_DEFAULT_PATH\n)\n\nif(NOT LIBRUST_PROVIDER)\n    message(FATAL_ERROR\n        \"Rust static library (librust_provider.a) not found in ${CMAKE_CURRENT_SOURCE_DIR}/lib. \"\n        \"Ensure the preConfigure hook staged the buildRustPackage output.\"\n    )\nendif()\n\n# The Rust archive provides the logos_module_* exports the generated glue\n# calls; its own lp_* undefineds resolve against the logos-protocol archive\n# already in the plugin link (via logos-qt-sdk). Re-mention the protocol\n# target after the Rust archive so single-pass linkers (GNU ld) see it later\n# on the line \u2014 one protocol stack shared by the glue and the Rust code.\ntarget_link_libraries(rust_provider_module_module_plugin PRIVATE\n    ${LIBRUST_PROVIDER}\n    logos-protocol::logos_protocol\n)\n\nif(APPLE)\n    target_link_libraries(rust_provider_module_module_plugin PRIVATE\n        \"-framework CoreFoundation\"\n        \"-framework Security\"\n    )\nelse()\n    target_link_libraries(rust_provider_module_module_plugin PRIVATE pthread dl)\nendif()\n```\n\n> **The target name is `rust_provider_module_module_plugin`** \u2014 that's\n> `<module-name>_module_plugin` as produced by `logos_module()`. It looks\n> doubled because the module name already ends in `_module`.", "execs": [{"kind": "file", "cmd": "write CMakeLists.txt", "status": "pass", "note": "Wrote CMakeLists.txt"}]}, {"md": "### 4.3 `flake.nix` \u2014 compile the crate and build the module\n\nThe flake pins `logos-module-builder` to the branch carrying the\n`cdylib` interface (re-point at master once the chain merges). The\nRust crate is compiled by `buildRustPackage` \u2014 the committed\n`Cargo.lock` vendors the crates.io and git dependencies, so the build\nis fully offline inside the Nix sandbox \u2014 and `preConfigure` stages\nthe archive into `lib/` where CMake finds it.\n\n```nix\n{\n  description = \"Example Logos module with logic implemented in pure Rust\";\n\n  inputs = {\n    # The cdylib authoring interface (interface = \"cdylib\" + codegen.lidl ->\n    # uniform Qt glue over the module-impl C ABI) lives on this branch until\n    # the protocol-extraction chain merges \u2014 then re-point at master.\n    logos-module-builder.url = \"github:logos-co/logos-module-builder/22c3d6b926de0187f1371f8768597e3cf3f400dd\";\n  };\n\n  outputs = inputs@{ self, logos-module-builder, ... }:\n    let\n      nixpkgs = logos-module-builder.inputs.nixpkgs;\n      systems = [ \"aarch64-darwin\" \"x86_64-darwin\" \"aarch64-linux\" \"x86_64-linux\" ];\n      forAllSystems = f: nixpkgs.lib.genAttrs systems f;\n\n      # Compile the Rust staticlib. The module-impl C ABI scaffold is\n      # generated from the .lidl contract by lidl-gen (build.rs); the\n      # committed Cargo.lock vendors the crates.io and git dependencies.\n      rustLib = system:\n        let pkgs = nixpkgs.legacyPackages.${system};\n        in pkgs.rustPlatform.buildRustPackage {\n          pname = \"rust_provider\";\n          version = \"1.0.0\";\n          src = ./rust-lib;\n          cargoLock = {\n            lockFile = ./rust-lib/Cargo.lock;\n            allowBuiltinFetchGit = true;\n          };\n          doCheck = false;\n        };\n\n      module = system:\n        logos-module-builder.lib.mkLogosModule {\n          src = ./.;\n          configFile = ./metadata.json;\n          flakeInputs = inputs;\n          preConfigure = ''\n            mkdir -p lib\n            cp ${rustLib system}/lib/librust_provider.a lib/\n          '';\n        };\n    in\n    {\n      packages = forAllSystems (system: (module system).packages.${system});\n    };\n}\n```\n\n`mkLogosModule` reads `metadata.json`, runs the glue codegen\n(`logos-cpp-generator --lidl ... --backend cdylib`), compiles the glue\ntogether with the staged archive, and exposes the standard outputs \u2014\nincluding `#lgx`, the installable package we build next.", "execs": [{"kind": "file", "cmd": "write flake.nix", "status": "pass", "note": "Wrote flake.nix"}]}, {"md": "## Step 5: Build and install the module\n\nGenerate the Cargo lockfile, initialise a git repo (Nix flakes only see\nfiles tracked by git), then build the `.lgx` package and install it.", "execs": []}, {"md": "### 5.1 Ignore build artifacts\n\n```text\nresult\nresult-*\nlib/\nrust-lib/target/\n```", "execs": [{"kind": "file", "cmd": "write .gitignore", "status": "pass", "note": "Wrote .gitignore"}]}, {"md": "### 5.2 Generate the Cargo lockfile\n\n`buildRustPackage` vendors dependencies from a committed `Cargo.lock`,\nso generate it once (network access happens here, not inside the Nix\nbuild):\n\n```bash\ncd rust-lib && nix run nixpkgs#cargo -- generate-lockfile\n```", "execs": [{"kind": "run", "cmd": "sh -c 'cd rust-lib && nix run nixpkgs#cargo -- generate-lockfile'", "status": "pass", "exit_code": 0, "output": "unpacking 'https://flakehub.com/f/DeterminateSystems/nixpkgs-weekly/0.1' into the Git cache...\nthese 20 paths will be fetched (456.0 MiB download, 2.2 GiB unpacked):\n  /nix/store/cgjr3kj3hs7ngznyws5qfg16c8scpys0-bash-interactive-5.3p9\n  /nix/store/k1shjmzyzw8bf7vp8gyrqn4dn70xpdxx-brotli-1.2.0-lib\n  /nix/store/z480b23kymbmrijrl49246mrzyphli15-cargo-1.95.0\n  /nix/store/a6yk8ks6psxcdcagxjx53wqajcaf5ny6-cargo-bootstrap-1.95.0\n  /nix/store/xm1x557414bq1lgrx18gvb7cbz1qrdy8-curl-8.20.0\n  /nix/store/wn2byajlpr3w4pii81n6r0bjfrp5ca31-keyutils-1.6.3-lib\n  /nix/store/5cbjxz04crbjnawysjx5q717gvbsx7k8-krb5-1.22.1-lib\n  /nix/store/f0gsxi5sc6hvrwmjk4r7dpb71d4vjgn0-libpsl-0.21.5\n  /nix/store/w3br983xcky4vdsz4df4splnbqhvnwp6-libssh2-1.11.1\n  /nix/store/bck1xkk9m0f60352gnjb512ix0n4x9qm-libxml2-2.15.2\n  /nix/store/ldcshpa3cspn8jfr4k1m05j4d4vz36wb-llvm-21.1.8-lib\n  /nix/store/zshxcsjv43migvylmfn1dh4wsl5wi09v-nghttp2-1.69.0-lib\n  /nix/store/k7ph83pqw7wk69zl9jdniwkg681nzavw-nghttp3-1.15.0\n  /nix/store/7kxphm n status\n\nVerify the daemon is running:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"pid\":4510,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"rust_provider_module\",\"status\":\"not_loaded\"},{\"name\":\"capability_module\",\"status\":\"loaded\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":1,\"not_loaded\":1}}\n", "note": ""}]}, {"md": "### 6.3 List discovered modules\n\n`rust_provider_module` should be visible in the scan directory:\n\n```bash\nlogoscore list-modules\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore list-modules", "status": "pass", "exit_code": 0, "output": "[{\"name\":\"rust_provider_module\",\"status\":\"not_loaded\"},{\"name\":\"capability_module\",\"status\":\"loaded\"}]\n", "note": ""}]}, {"md": "### 6.4 Load the module\n\nLoad `rust_provider_module` into the running daemon:\n\n```bash\nlogoscore load-module rust_provider_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore load-module rust_provider_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies_loaded\":[],\"module\":\"rust_provider_module\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.5 Introspect the module with module-info\n\n`module-info` lists the methods the generated glue exposes \u2014 taken from\nthe same `.lidl` contract the Rust trait came from, so the two can\nnever disagree:\n\n```bash\nlogoscore module-info rust_provider_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore module-info rust_provider_module", "status": "pass", "exit_code": 0, "output": "{\"events\":[],\"methods\":[{\"isInvokable\":true,\"name\":\"add\",\"parameters\":[{\"name\":\"a\",\"type\":\"int\"},{\"name\":\"b\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"add(int,int)\"},{\"isInvokable\":true,\"name\":\"multiply\",\"parameters\":[{\"name\":\"a\",\"type\":\"int\"},{\"name\":\"b\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"multiply(int,int)\"},{\"isInvokable\":true,\"name\":\"factorial\",\"parameters\":[{\"name\":\"n\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"factorial(int)\"},{\"isInvokable\":true,\"name\":\"fibonacci\",\"parameters\":[{\"name\":\"n\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"fibonacci(int)\"},{\"isInvokable\":true,\"name\":\"is_prime\",\"parameters\":[{\"name\":\"n\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"is_prime(int)\"},{\"isInvokable\":true,\"name\":\"greet\",\"parameters\":[{\"name\":\"name\",\"type\":\"QString\"}],\"returnType\":\"QString\",\"signature\":\"greet(QString)\"},{\"isInvokable\":true,\"name\":\"libVersion\",\"returnType\":\"QString\",\"signature\":\"libVersion()\"}],\"name\":\"rust_provider_module\",\"status\":\"loaded\"}\n", "note": ""}]}, {"md": "### 6.6 Add two integers\n\n`add` reaches the Rust trait impl over IPC \u2014 host \u2192 Qt glue \u2192\n`logos_module_dispatch` \u2192 `RustProviderImpl::add` and back:\n\n```bash\nlogoscore call rust_provider_module add 5 3\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module add 5 3", "status": "pass", "exit_code": 0, "output": "{\"method\":\"add\",\"module\":\"rust_provider_module\",\"result\":8,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.7 Multiply two integers\n\n```bash\nlogoscore call rust_provider_module multiply 4 6\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module multiply 4 6", "status": "pass", "exit_code": 0, "output": "{\"method\":\"multiply\",\"module\":\"rust_provider_module\",\"result\":24,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.8 Factorial\n\n```bash\nlogoscore call rust_provider_module factorial 5\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module factorial 5", "status": "pass", "exit_code": 0, "output": "{\"method\":\"factorial\",\"module\":\"rust_provider_module\",\"result\":120,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.9 Fibonacci\n\n```bash\nlogoscore call rust_provider_module fibonacci 10\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module fibonacci 10", "status": "pass", "exit_code": 0, "output": "{\"method\":\"fibonacci\",\"module\":\"rust_provider_module\",\"result\":55,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.10 Primality test\n\n`is_prime` returns 1 for a prime and 0 otherwise:\n\n```bash\nlogoscore call rust_provider_module is_prime 7\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module is_prime 7", "status": "pass", "exit_code": 0, "output": "{\"method\":\"is_prime\",\"module\":\"rust_provider_module\",\"result\":1,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nlogoscore call rust_provider_module is_prime 4\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module is_prime 4", "status": "pass", "exit_code": 0, "output": "{\"method\":\"is_prime\",\"module\":\"rust_provider_module\",\"result\":0,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.11 Greet (string round-trip)\n\n`greet` takes a string and returns one \u2014 on the Rust side it is a\nplain `String -> String` method:\n\n```bash\nlogoscore call rust_provider_module greet World\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module greet World", "status": "pass", "exit_code": 0, "output": "{\"method\":\"greet\",\"module\":\"rust_provider_module\",\"result\":\"Hello, World! (from Rust provider)\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.12 Version\n\n`libVersion` is declared in the contract like any other method and\nreturns the library's version string:\n\n```bash\nlogoscore call rust_provider_module libVersion\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call rust_provider_module libVersion", "status": "pass", "exit_code": 0, "output": "{\"method\":\"libVersion\",\"module\":\"rust_provider_module\",\"result\":\"1.0.0\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 6.13 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 6.14 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"4a686b0ca3ec\",\"status\":\"not_running\",\"version\":\"1.0\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
