-module-builder/rust-overlay/nixpkgs':\n    follows 'logos-module-builder/nixpkgs'\nthis path will be fetched (2.0 MiB download, 2.0 MiB unpacked):\n  /nix/store/lwh921nn268dg7nd1vdf3r6vg0qr0qlw-logos-keystore_module-module-lib-lgx-1.0.0\ncopying path '/nix/store/lwh921nn268dg7nd1vdf3r6vg0qr0qlw-logos-keystore_module-module-lib-lgx-1.0.0' from 'https://logos-co.cachix.org'...\n", "note": ""}, {"kind": "run", "cmd": "ls keystore-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "keystore-lgx/logos-keystore_module-module-lib.lgx\n", "note": ""}]}, {"md": "### 2.4 Seed the capability module\n\n```bash\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n\n```", "execs": [{"kind": "run", "cmd": "mkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 2.5 Install all three .lgx with lgpm\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file eth-rpc-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file keystore-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file railgun-lgx/*.lgx\n\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file eth-rpc-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file keystore-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file railgun-lgx/*.lgx\n", "status": "fail", "exit_code": 1, "output": "Installing from file: eth-rpc-lgx/logos-eth_rpc_module-module-lib.lgx... done\nInstalled to: ./modules\nInstalling from file: keystore-lgx/logos-keystore_module-module-lib.lgx... done\nInstalled to: ./modules\nInstalling from file: railgun-lgx/*.lgx... FAILED\nError: Source plugin file does not exist or is not a file: railgun-lgx/*.lgx\n", "note": "exit code 1"}]}, {"md": "### 2.6 Confirm the install\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "status": "fail", "exit_code": 0, "output": "Found 3 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ncapability_module              1.0.0           core       security       \neth_rpc_module                 1.0.0           core       wallet         \nkeystore_module                1.0.0           core       wallet         \n", "note": "expected 'railgun_module' not found in output"}]}, {"md": "## Step 3: Run the daemon and drive the RAILGUN engine\n\nStart `logoscore` pointed at `./modules` and load `railgun_module` \u2014 its\n`eth_rpc_module` and `keystore_module` dependencies auto-resolve. Then build\nthe engine on **Sepolia** (chain id `11155111`) from a known spending/viewing\nkey pair and read back the public `0zk` address.", "execs": []}, {"md": "### 3.1 Write the engine init config\n\n`init` takes `{ chainId, spendingKey, viewingKey, poi }`. The keys are\nrailgun (not EOA) keys; they are imported into the module and never\nreturned. We use a fixed test pair so the derived `0zk` address is\ndeterministic.\n\n```json\n{\n  \"chainId\": 11155111,\n  \"spendingKey\": \"039b3b11110e49d7340cbe7171791972e3c0d94ef31b18d6ab93d7ace62d278a\",\n  \"viewingKey\": \"d345b2cc2f414aa93413b9572fa2b26e0e869e9274b006415a8d62ab1fa2dcb1\",\n  \"poi\": false\n}\n```", "execs": [{"kind": "file", "cmd": "write init.json", "status": "pass", "note": "Wrote init.json"}]}, {"md": "### 3.2 Write the shield request\n\nA shield deposits a public ERC-20 into the shielded pool. `prepare_shield`\ntakes `{ asset, amount }` (amount is a decimal string of base units) and\nreturns the unsigned `TxData[]` for the caller to approve + sign + send.\n\n```json\n{\n  \"asset\": \"0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238\",\n  \"amount\": \"1000000\"\n}\n```", "execs": [{"kind": "file", "cmd": "write shield.json", "status": "pass", "note": "Wrote shield.json"}]}, {"md": "### 3.3 Start the daemon\n\n```bash\nlogoscore -D -m ./modules > logs.txt &\n```", "execs": [{"kind": "run", "cmd": "sh -c './logos/bin/logoscore -D -m ./modules > logs.txt 2>&1 &'", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "```bash\nsleep 3\n```", "execs": [{"kind": "run", "cmd": "sleep 3", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 3.4 Load the module (deps auto-resolve)\n\n```bash\nlogoscore load-module railgun_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore load-module railgun_module", "status": "fail", "exit_code": 3, "output": "{\"code\":\"MODULE_LOAD_FAILED\",\"known_modules\":[\"keystore_module\",\"eth_rpc_module\",\"capability_module\"],\"message\":\"Failed to load module 'railgun_module'.\",\"status\":\"error\"}\n", "note": "exit code 3"}]}, {"md": "### 3.5 Introspect the module\n\n```bash\nlogoscore module-info railgun_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore module-info railgun_module", "status": "fail", "exit_code": 3, "output": "{\"code\":\"MODULE_NOT_FOUND\",\"message\":\"Module 'railgun_module' not found.\",\"status\":\"error\"}\n", "note": "exit code 3"}]}, {"md": "### 3.6 Build the engine on Sepolia (offline)\n\n`init` builds and registers the railgun engine for Sepolia and returns\nthe public `0zk` address. This performs **no network I/O** \u2014 the engine\nis constructed and the keys registered entirely in-process.\n\n```bash\nlogoscore call railgun_module init @init.json\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call railgun_module init @init.json", "status": "fail", "exit_code": 4, "output": "{\"code\":\"RPC_FAILED\",\"message\":\"callModuleMethod('railgun_module','init') RPC call failed.\",\"status\":\"error\"}\n", "note": "exit code 4"}]}, {"md": "### 3.7 Read the public 0zk address\n\n```bash\nlogoscore call railgun_module get_zk_address\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call railgun_module get_zk_address", "status": "fail", "exit_code": 4, "output": "{\"code\":\"RPC_FAILED\",\"message\":\"callModuleMethod('railgun_module','get_zk_address') RPC call failed.\",\"status\":\"error\"}\n", "note": "exit code 4"}]}, {"md": "### 3.8 Prepare a shield transaction\n\n`prepare_shield` builds the unsigned deposit calldata \u2014 pure `TxData`\n(`to`/`data`/`value`), no zk-proof and no network. The wallet backend\nwould prepend an ERC-20 `approve`, sign each with `keystore_module`, and\nbroadcast through `eth_rpc_module`.\n\n```bash\nlogoscore call railgun_module prepare_shield @shield.json\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call railgun_module prepare_shield @shield.json", "status": "fail", "exit_code": 4, "output": "{\"code\":\"RPC_FAILED\",\"message\":\"callModuleMethod('railgun_module','prepare_shield') RPC call failed.\",\"status\":\"error\"}\n", "note": "exit code 4"}]}, {"md": "### 3.9 Stop the daemon\n\n```bash\nlogoscore stop\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 3.10 Confirm the daemon has stopped\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"5b6ac2c6582d\",\"status\":\"not_running\",\"version\":\"1.0\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
