*.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "Installing from file: accounts-lgx/logos-accounts_module-module-lib.lgx... done\nInstalled to: ./modules\n", "status": "pass"}], "md": "### 4.1 Install the .lgx\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file accounts-lgx/*.lgx\n```"}, {"execs": [], "md": "## Step 5: Confirm the install\n\nScan the directory and inspect the installed module."}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "exit_code": 0, "kind": "run", "note": "", "output": "Found 1 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\naccounts_module                1.0.1           core       accounts       \n", "status": "pass"}], "md": "### 5.1 List installed packages\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```"}, {"execs": [{"cmd": "./lgpm/bin/lgpm --modules-dir ./modules info accounts_module", "exit_code": 0, "kind": "run", "note": "", "output": "Name: accounts_module\nVersion: 1.0.1\nDescription: Accounts module using go-wallet-sdk C library\nType: core\nCategory: accounts\nAuthor: Logos Core Team\nDirectory: ./modules/accounts_module\nSigner: (no signature installed)\nDependencies: none\n", "status": "pass"}], "md": "### 5.2 Show its details\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules info accounts_module\n```\n\nThat's the whole loop: a real module, packaged by its own flake and\ninstalled with `lgpm` \u2014 no hand-written manifests. Add `--json` to either\ncommand for machine-readable output."}]}, {"meta": {"name": "Managing Local Packages with lgpm", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Managing Local Packages with lgpm\n\n[`lgpm`](https://github.com/logos-co/logos-package-manager) is the **local**\nLogos package manager. It installs `.lgx` packages into a set of directories,\nscans what is installed, and answers dependency questions \u2014 all offline, with no\nnetwork access (fetching packages is the job of\n[`lgpd`](https://github.com/logos-co/logos-package-downloader)).\n\nWe build the `lgpm` CLI, hand-craft two `.lgx` packages (a\ncore module and a UI plugin that depends on it), install them, and explore them\nwith `list`, `info`, `deps`, and `dependents`.\n\n**What you'll build:** Two installed Logos packages and a working tour of every `lgpm` subcommand.\n\n**What you'll learn:**\n\n- What an `.lgx` package is on disk, and how to build one by hand\n- How to install a local `.lgx` package with `lgpm install --file`\n- How to list, inspect (`info`), and query the dependency graph (`deps` / `dependents`)\n- How `--json` turns every command into machine-readable output\n\n## Prerequisites\n\n- **Nix** with flakes enabled \u2014 used to build the `lgpm` CLI.\n- A Linux or macOS machine (the package variants below cover both)."}, {"execs": [], "md": "## Step 1: Build the lgpm CLI\n\n`lgpm` ships as a C++ CLI. Build it straight from the flake and link the\nresult as `./cli` so the binary lands at `./cli/bin/lgpm`.\n\n> Developing against a local checkout? Replace the GitHub reference with\n> `.`, e.g. `nix build '.#cli' -o cli`."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-package-manager/d88abaa1f3f5d4a4268d7cdfbec98d816e0a0385#cli' -o cli --override-input logos-package/logos-nix github:logos-co/logos-nix/f55bf91b8a723ee5c27c39c773b034255538d280 --override-input nix-bundle-appimage/nix-bundle-dir github:logos-co/nix-bundle-dir/ffc410b7f2bab32b1c2ceb347c56902e7321049c", "exit_code": 0, "kind": "run", "note": "", "output": "warning: not writing modified lock file of flake 'github:logos-co/logos-package-manager/d88abaa1f3f5d4a4268d7cdfbec98d816e0a0385':\n\u2022 Updated input 'logos-package/logos-nix':\n    'github:logos-co/logos-nix/6e0f4a7' (2026-08-10)\n  \u2192 'github:logos-co/logos-nix/f55bf91' (2026-08-14)\n\u2022 Updated input 'nix-bundle-appimage/nix-bundle-dir':\n    'github:logos-co/nix-bundle-dir/cb9afc8' (2026-08-03)\n  \u2192 'github:logos-co/nix-bundle-dir/ffc410b' (2026-08-12)\n\u2022 Updated input 'nix-bundle-appimage/nix-bundle-dir/logos-nix':\n    'github:logos-co/logos-nix/0e9e6d6' (2026-03-19)\n  \u2192 'github:logos-co/logos-nix/6e0f4a7' (2026-08-10)\n\u2022 Added input 'nix-bundle-appimage/nix-bundle-dir/logos-nix/nixpkgs-windows':\n    'github:NixOS/nixpkgs/b5aa0fb' (2026-06-29)\n", "status": "pass"}], "md": "### 1.1 Build lgpm\n\n```bash\nnix build 'github:logos-co/logos-package-manager/d88abaa1f3f5d4a4268d7cdfbec98d816e0a0385#cli' -o cli\n```\n\nThe `-o cli` flag names the result symlink, so the executable is at\n`./cli/bin/lgpm`."}, {"execs": [{"cmd": "./cli/bin/lgpm --version", "exit_code": 0, "kind": "run", "note": "", "output": "lgpm version dev (dev build)\ncommit: dirty\ndependency commits:\n  logos-package 49151f003690333764d73f956d64e1245e2a0c38\n  logos-nix f55bf91b8a723ee5c27c39c773b034255538d280\n  nix-bundle-dir ffc410b7f2bab32b1c2ceb347c56902e7321049c\n  nix-bundle-appimage 04a3cf89f8ba3dc20f08a8e2b6c337a672bceda7\n", "status": "pass"}], "md": "### 1.2 Confirm it runs\n\n```bash\n./cli/bin/lgpm --version\n```"}, {"execs": [], "md": "## Step 2: Detect the platform variant\n\nAn `.lgx` package carries one or more **platform variants**. A dev build of\n`lgpm` installs the variant matching this machine with a `-dev` suffix (for\nexample `linux-x86_64-dev` or `darwin-arm64-dev`). Detect it once and stash\nit in a file so the packaging steps can reuse it."}, {"execs": [{"cmd": "case \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   echo linux-x86_64-dev  > variant ;;\n  \"Linux aarch64\")  echo linux-arm64-dev   > variant ;;\n  \"Darwin arm64\")   echo darwin-arm64-dev  > variant ;;\n  \"Darwin x86_64\")  echo darwin-x86_64-dev > variant ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\necho \"variant: $(cat variant)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "variant: darwin-arm64-dev\n", "status": "pass"}], "md": "### 2.1 Write the variant name to ./variant\n\n```bash\ncase \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   echo linux-x86_64-dev  > variant ;;\n  \"Linux aarch64\")  echo linux-arm64-dev   > variant ;;\n  \"Darwin arm64\")   echo darwin-arm64-dev  > variant ;;\n  \"Darwin x86_64\")  echo darwin-x86_64-dev > variant ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\necho \"variant: $(cat variant)\"\n\n```"}, {"execs": [], "md": "## Step 3: The platform variant, on Windows\n\nThe same file, stated rather than probed. `uname` above is how you find\nthis machine's variant when you are standing on it; a cross-built Windows\nrun already knows which target it was built for, and MSYS's `uname` would\nanswer with something the case above has no arm for."}, {"execs": [], "md": "### 3.1 Write the variant name to ./variant\n\n```bash\necho windows-x86_64-dev > variant\necho \"variant: $(cat variant)\"\n\n```"}, {"execs": [], "md": "## Step 4: Create the core module package\n\nAn `.lgx` file is just a **gzipped tar archive** with a `manifest.json` at\nits root and the payload under `variants/<platform>/`. `lgpm` reads the\nmanifest to learn the package's name, version, type, dependencies, and entry\npoint \u2014 so a hand-built tarball is a perfectly valid package. (In a real\nproject [`nix-bundle-lgx`](https://github.com/logos-co/nix-bundle-lgx)\ngenerates these from a module's `metadata.json`; here we write the manifest\nby hand to keep the focus on `lgpm`.)\n\nWe start with a tiny **core module** called `greeter`. The payload is a stub \u2014\n`lgpm` installs and indexes packages by their manifest; it does not load the\nbinary."}, {"execs": [{"cmd": "write build/greeter/manifest.json", "kind": "file", "note": "Wrote build/greeter/manifest.json", "status": "pass"}], "md": "### 4.1 Write greeter's manifest\n\nThe manifest lives at the root of the package tree:\n\n```json\n{\n  \"manifestVersion\": \"0.2.0\",\n  \"name\": \"greeter\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Says hello\",\n  \"author\": \"Logos\",\n  \"type\": \"core\",\n  \"category\": \"demo\",\n  \"icon\": \"\",\n  \"dependencies\": [],\n  \"main\": { \"PLACEHOLDER_VARIANT\": \"greeter.dylib\" }\n}\n```\n\nThe `main` key maps each platform variant to its entry-point file. The\nnext step substitutes this machine's variant name for the placeholder."}, {"execs": [{"cmd": "VARIANT=\"$(cat variant)\"\nsed -i.bak \"s/PLACEHOLDER_VARIANT/$VARIANT/\" build/greeter/manifest.json && rm -f build/greeter/manifest.json.bak\nmkdir -p \"build/greeter/variants/$VARIANT\"\necho 'stub library' > \"build/greeter/variants/$VARIANT/greeter.dylib\"\ntar --format=ustar -C build/greeter -czf greeter.lgx manifest.json variants\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}, {"cmd": "tar -tzf greeter.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "manifest.json\nvariants/\nvariants/darwin-arm64-dev/\nvariants/darwin-arm64-dev/greeter.dylib\n", "status": "pass"}], "md": "### 4.2 Stamp the variant into the manifest and pack the .lgx\n\n```bash\nVARIANT=\"$(cat variant)\"\n\n# Point main[<variant>] at the real variant name\nsed -i \"s/PLACEHOLDER_VARIANT/$VARIANT/\" build/greeter/manifest.json\n\n# Payload goes under variants/<platform>/ (e.g. variants/linux-x86_64-dev/)\nmkdir -p \"build/greeter/variants/$VARIANT\"\necho 'stub library' > \"build/greeter/variants/$VARIANT/greeter.so\"  # .dylib on macOS\n\n# An .lgx is a gzipped tar of the manifest + the variants/ tree\ntar --format=ustar -C build/greeter -czf greeter.lgx manifest.json variants\n```\n\nConfirm the archive layout:\n\n```bash\ntar -tzf greeter.lgx\n```\n\n```\nmanifest.json\nvariants/\nvariants/<platform>-dev/\nvariants/<platform>-dev/greeter.so\n```"}, {"execs": [], "md": "## Step 5: Create the UI plugin package\n\nNow a **UI plugin** named `greeter_ui` whose manifest declares a dependency\non `greeter`. The `dependencies` array is what powers `deps` / `dependents`."}, {"execs": [{"cmd": "write build/greeter_ui/manifest.json", "kind": "file", "note": "Wrote build/greeter_ui/manifest.json", "status": "pass"}], "md": "### 5.1 Write greeter_ui's manifest\n\n```json\n{\n  \"manifestVersion\": \"0.2.0\",\n  \"name\": \"greeter_ui\",\n  \"version\": \"1.0.0\",\n  \"description\": \"A face for greeter\",\n  \"author\": \"Logos\",\n  \"type\": \"ui\",\n  \"category\": \"demo\",\n  \"icon\": \"\",\n  \"dependencies\": [\"greeter\"],\n  \"main\": { \"PLACEHOLDER_VARIANT\": \"greeter_ui.dylib\" }\n}\n```"}, {"execs": [{"cmd": "VARIANT=\"$(cat variant)\"\nsed -i.bak \"s/PLACEHOLDER_VARIANT/$VARIANT/\" build/greeter_ui/manifest.json && rm -f build/greeter_ui/manifest.json.bak\nmkdir -p \"build/greeter_ui/variants/$VARIANT\"\necho 'stub library' > \"build/greeter_ui/variants/$VARIANT/greeter_ui.dylib\"\ntar --format=ustar -C build/greeter_ui -czf greeter_ui.lgx manifest.json variants\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 5.2 Stamp the variant and pack it\n\n```bash\nVARIANT=\"$(cat variant)\"\nsed -i \"s/PLACEHOLDER_VARIANT/$VARIANT/\" build/greeter_ui/manifest.json\nmkdir -p \"build/greeter_ui/variants/$VARIANT\"\necho 'stub library' > \"build/greeter_ui/variants/$VARIANT/greeter_ui.so\"\ntar --format=ustar -C build/greeter_ui -czf greeter_ui.lgx manifest.json variants\n```"}, {"execs": [], "md": "## Step 6: Install the packages\n\n`lgpm` installs into the directories you give it \u2014 `--modules-dir` and\n`--ui-plugins-dir` \u2014 and later scans both. Pass both on every command so it\nsees the whole set. Our hand-built packages are unsigned, so we add\n`--allow-unsigned`."}, {"execs": [{"cmd": "./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins --allow-unsigned install --file ./greeter.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "Installing from file: ./greeter.lgx... done\nInstalled to: ./modules\n", "status": "pass"}], "md": "### 6.1 Install the core module\n\n```bash\n./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins --allow-unsigned install --file ./greeter.lgx\n```"}, {"execs": [{"cmd": "./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins --allow-unsigned install --file ./greeter_ui.lgx", "exit_code": 0, "kind": "run", "note": "", "output": "Installing from file: ./greeter_ui.lgx... done\nInstalled to: ./plugins\n", "status": "pass"}], "md": "### 6.2 Install the UI plugin\n\n```bash\n./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins --allow-unsigned install --file ./greeter_ui.lgx\n```"}, {"execs": [], "md": "## Step 7: List what's installed\n\n`list` scans every configured directory and prints a table of installed\npackages. Pass both directories so it sees the module and the plugin."}, {"execs": [{"cmd": "./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins list", "exit_code": 0, "kind": "run", "note": "", "output": "Found 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ngreeter                        1.0.0           core       demo           \ngreeter_ui                     1.0.0           ui         demo           \n", "status": "pass"}], "md": "### 7.1 List packages\n\n```bash\n./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins list\n```\n\nOutput (abridged):\n\n```\nFound 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY\n----------------------------------------------------------------------\ngreeter                        1.0.0           core       demo\ngreeter_ui                     1.0.0           ui         demo\n```"}, {"execs": [], "md": "## Step 8: Inspect a package with info\n\n`info <name>` prints the full record for a single installed package. Add\n`--json` for the machine-readable form \u2014 handy for scripting."}, {"execs": [{"cmd": "./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins info greeter", "exit_code": 0, "kind": "run", "note": "", "output": "Name: greeter\nVersion: 1.0.0\nDescription: Says hello\nType: core\nCategory: demo\nAuthor: Logos\nDirectory: ./modules/greeter\nSigner: (no signature installed)\nDependencies: none\n", "status": "pass"}], "md": "### 8.1 Human-readable info\n\n```bash\n./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins info greeter\n```"}, {"execs": [{"cmd": "./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins info greeter_ui --json", "exit_code": 0, "kind": "run", "note": "", "output": "{\n  \"author\": \"Logos\",\n  \"category\": \"demo\",\n  \"dependencies\": [\n    \"greeter\"\n  ],\n  \"description\": \"A face for greeter\",\n  \"hashes\": {\n    \"root\": \"\"\n  },\n  \"icon\": \"\",\n  \"installDir\": \"./plugins/greeter_ui\",\n  \"installType\": \"user\",\n  \"license\": \"\",\n  \"mainFilePath\": \"./plugins/greeter_ui/greeter_ui.dylib\",\n  \"manifestVersion\": \"0.2.0\",\n  \"name\": \"greeter_ui\",\n  \"type\": \"ui\",\n  \"version\": \"1.0.0\",\n  \"view\": \"\"\n}\n", "status": "pass"}], "md": "### 8.2 JSON info\n\n```bash\n./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins info greeter_ui --json\n```"}, {"execs": [], "md": "## Step 9: Query the dependency graph\n\n`deps` lists what a package depends on; `dependents` lists what depends on\nit. These read the `dependencies` arrays across every installed package, so\nboth directories must be configured."}, {"execs": [{"cmd": "./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins deps greeter_ui", "exit_code": 0, "kind": "run", "note": "", "output": "greeter\n", "status": "pass"}], "md": "### 9.1 What does greeter_ui depend on?\n\n```bash\n./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins deps greeter_ui\n```"}, {"execs": [{"cmd": "./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins dependents greeter", "exit_code": 0, "kind": "run", "note": "", "output": "greeter_ui\n", "status": "pass"}], "md": "### 9.2 What depends on greeter?\n\n```bash\n./cli/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins dependents greeter\n```\n\nBoth commands accept `-r` / `--recursive` to walk the graph transitively,\nand `--json` to emit a JSON array instead of one name per line."}, {"execs": [], "md": "## Recap\n\nYou built `lgpm`, hand-crafted two `.lgx` archives (a gzipped tar of a\n`manifest.json` plus a `variants/` tree), installed them, and toured every\n`lgpm` subcommand:\n\n| Command | What it does |\n|---|---|\n| `install --file <pkg>` | Install one `.lgx` (use `--dir` for a whole folder) |\n| `list` | Table of everything installed |\n| `info <name>` | Full record for one package (`--json` for machine output) |\n| `deps <name>` | What a package depends on (`-r` for transitive) |\n| `dependents <name>` | What depends on a package (`-r` for transitive) |"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
