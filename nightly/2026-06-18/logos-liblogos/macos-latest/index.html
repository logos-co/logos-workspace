d capability module\n\n`accounts_module` is loaded through the host's capability layer, so the\nmodules directory also needs the `capability_module` that ships with\n`logoscore`. Copy it across first.\n\n```bash\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n\n```", "execs": [{"kind": "run", "cmd": "mkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 3.4 Install the .lgx with lgpm\n\nInstall the freshly-built package into `./modules`. `accounts_module` is\na `core` module, so it goes to `--modules-dir`. The package is unsigned\n(a local dev build), so we pass `--allow-unsigned`.\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file accounts-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file accounts-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "Installing from file: accounts-lgx/logos-accounts_module-module-lib.lgx... done\nInstalled to: ./modules\n", "note": ""}]}, {"md": "### 3.5 Confirm the install\n\nScan the directory and confirm the module landed:\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "status": "pass", "exit_code": 0, "output": "Found 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\naccounts_module                1.0.0           core       accounts       \ncapability_module              1.0.0           core       security       \n", "note": ""}]}, {"md": "## Step 4: Run the daemon and call the module\n\nStart `logoscore` in daemon mode pointed at `./modules`, then use the client\nsubcommands to load `accounts_module`, introspect it, and call one of its\nmethods. Daemon output is captured in `logs.txt`.", "execs": []}, {"md": "### 4.1 ":true,\"name\":\"lengthToEntropyStrength\",\"parameters\":[{\"name\":\"length\",\"type\":\"int\"}],\"returnType\":\"int\",\"signature\":\"lengthToEntropyStrength(int)\"}],\"name\":\"accounts_module\",\"status\":\"loaded\"}\n", "note": ""}]}, {"md": "### 4.8 Call a method\n\nGenerate a fresh 12-word BIP-39 mnemonic. `createRandomMnemonic` takes\nthe word count and returns the phrase \u2014 a real round-trip through the\ngo-wallet-sdk C library wrapped by the module, dispatched over liblogos'\nIPC:\n\n```bash\nlogoscore call accounts_module createRandomMnemonic 12\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module createRandomMnemonic 12", "status": "pass", "exit_code": 0, "output": "{\"method\":\"createRandomMnemonic\",\"module\":\"accounts_module\",\"result\":\"frame light wild apple marble joy again sign fix foot ivory category\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.9 Call a second method\n\n`lengthToEntropyStrength` maps a mnemonic word count to its entropy\nstrength in bits \u2014 12 words is 128 bits. This exercises an `int`\nround-trip:\n\n```bash\nlogoscore call accounts_module lengthToEntropyStrength 12\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module lengthToEntropyStrength 12", "status": "pass", "exit_code": 0, "output": "{\"method\":\"lengthToEntropyStrength\",\"module\":\"accounts_module\",\"result\":128,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.10 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.11 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"de5bec70b005\",\"status\":\"not_running\",\"version\":\"1.0\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}, {"meta": {"name": "Embedding This liblogos as a Library", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"md": "# Embedding This liblogos as a Library\n\n# WARNING\n  ** IMPORTANT **\n  This doctest is for internal dev purposes and should not be used. It displays important flaws that will be corrected, specifically that QCoreApplication should no longer be needed but it's pending some changes still at which point this doctest will be updated to reflect that\n  ** IMPORTANT **\n`logos-liblogos` is a **library**. The headless `logoscore` CLI and the\nbasecamp desktop app are just frontends for it \u2014 each one links\n`liblogos_core` and drives its C API (`logos_core.h`) to discover, load, and\nmanage modules. This doc-test shows how to do the same thing in **your own\nprogram**, built against **this** liblogos commit:\n\n1. Build `liblogos_core` (the C-API shared library), its `logos_host`\n   subprocess binary, and the `logos_core.h` header \u2014 all from the commit\n   under test.\n2. Build the `lgpm` package manager and install two real modules\n   ([`capability_module`](https://github.com/logos-co/logos-capability-module)\n   and [`accounts_module`](https://github.com/logos-co/logos-accounts-module))\n   into a local modules directory.\n3. Write a ~50-line C++ program that links `liblogos_core`, then calls the C\n   API to start the runtime and load `accounts_module`.\n4. Build that program against this liblogos and run it \u2014 watching the module\n   come up over liblogos' own IPC.\n\nBecause the library, the host binary, and the headers all come from the commit\nunder test, a green run is direct evidence that **this** liblogos is usable as\nan embeddable library, not just through the `logoscore` frontend.\n\n> **Why C++ and not pure C?** The API in `logos_core.h` is plain C, but the\n> runtime is built on Qt internally (it uses `QPluginLoader` to read module\n> metadata and Qt's IPC stack to talk to modules). So an embedding program must\n> construct a `QCoreApplication` before it calls `logos_core_start()` \u2014 exactly\n> as `logoscore` and basecamp do. You do **not** need to run Qt's event loop;\n> the load calls are synchronous.\n\n**What you'll build:** A standalone C++ program that links `liblogos_core` from this commit and loads the real `accounts_module` through the C API.\n\n**What you'll learn:**\n\n- How to build `liblogos_core`, `logos_host`, and `logos_core.h` from a specific liblogos commit\n- What a minimal `CMakeLists.txt` that links `liblogos_core` looks like\n- The lifecycle of the C API: `logos_core_init` \u2192 `add_modules_dir` \u2192 `start` \u2192 `load_module` \u2192 `cleanup`\n- Why an embedding program needs a `QCoreApplication`, and where `logos_host` fits in (`LOGOS_HOST_PATH`)\n- How to install modules with `lgpm` so the runtime can discover them\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine.** The program runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required.", "execs": []}, {"md": "## How embedding liblogos works\n\nYour program links `liblogos_core` and calls its C API. The runtime loads\neach module in an isolated subprocess that it launches through a separate\n`logos_host` binary, and talks to it over the Logos IPC bridge:\n\nEverything below comes from the liblogos commit under test: the\n`liblogos_core` you link, the `logos_host` that hosts the module, and the\n`logos_core.h` header you compile against.", "execs": []}, {"md": "## Step 1: Build liblogos from this commit\n\nBuild the combined `logos-liblogos` package and symlink it to `./liblogos`.\nThe result contains everything an embedder needs: the C-API library, the\nheader, and the `logos_host` binary.\n\n> The URL carries a release placeholder that pins the build to a specific\n> commit: the doc-test runner expands it to a concrete ref. Locally that is\n> this checkout's `HEAD` (see `run.sh`); in CI it is the commit being\n> tested. With no pin it falls back to the latest `master`.", "execs": []}, {"md": "### 1.1 Build the library\n\n```bash\nnix build 'github:logos-co/logos-liblogos/dbcafea05c06e91be18763bc0c4b307222d8b853' -o ./liblogos\n```\n\nThe result has three things your program depends on:\n\n- `liblogos/include/logos_core.h` \u2014 the C API you compile against\n- `liblogos/lib/liblogos_core.dylib` \u2014 the shared library you link\n- `liblogos/bin/logos_host` \u2014 the subprocess host the runtime launches\n  to run each module", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-liblogos/dbcafea05c06e91be18763bc0c4b307222d8b853' -o ./liblogos", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 1.2 Confirm the library, header, and host binary are present\n\n```bash\nls liblogos/include/logos_core.h liblogos/lib/liblogos_core.dylib liblogos/bin/logos_host\n```", "execs": [{"kind": "run", "cmd": "ls liblogos/include/logos_core.h liblogos/lib/liblogos_core.dylib liblogos/bin/logos_host", "status": "pass", "exit_code": 0, "output": "liblogos/bin/logos_host\nliblogos/include/logos_core.h\nliblogos/lib/liblogos_core.dylib\n", "note": ""}]}, {"md": "## Step 2: Build lgpm and the modules to load\n\nThe runtime discovers modules from a directory of installed packages. We\nbuild the `lgpm` package manager and two real modules' `.lgx` packages,\nthen install them in the next step. `accounts_module` is loaded through the\nhost's capability layer, so we install `capability_module` alongside it.", "execs": []}, {"md": "### 2.1 Build lgpm\n\n```bash\nnix build 'github:logos-co/logos-package-manager#cli' -o lgpm\n```\n\nThe executable is at `./lgpm/bin/lgpm`.", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 2.2 Build the capability module's .lgx\n\n```bash\nnix build 'github:logos-co/logos-capability-module#lgx' -o cap-lgx\n```\n\nThe `.lgx` package is under `./cap-lgx/`:\n\n```bash\nls cap-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-capability-module#lgx' -o cap-lgx", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-standalone-app/0206e2ea6c43d78d083ba7e4e002fe34a60b77ac?narHash=sha256-Z7vO0bm1trVctlqsDc%2Bp6lLYEC1K5qEJctgdSkVG2YI%3D' into the Git cache...\nunpacking 'github:logos-co/logos-cpp-sdk/bb6d87b6ec7a64814df48fbdb10cf5290ce4b724?narHash=sha256-NjODUctwKSIi3vMUSMgk6bxfW4fJM9vX5jndk8CfZJ4%3D' into the Git cache...\nunpacking 'github:logos-co/logos-design-system/4a37b34446ef4e55b16a5aeb011ffc5e8cbcbbb8?narHash=sha256-0l5Xjbx9bLRc6LF0FU3LZ15RmEYK9oOPy/EaOxQYHkc%3D' into the Git cache...\nunpacking 'github:logos-co/logos-liblogos/68e408a5de5a21948684485582a5d03d7bfc5d78?narHash=sha256-RzYek00R1a%2BnTOejMKXER3WZLfO30A%2B3mCqvM6m7PfQ%3D' into the Git cache...\nunpacking 'github:logos-co/logos-qt-mcp/c87f6bd985a07ec2809081c8d0830108aa895819?narHash=sha256-rkqva3DbhhxWrVp6KLyhVxbAK2MLIWfUcPG5HM7wnsQ%3D' into the Git cache...\nunpacking 'github:logos-co/logos-view-module-runtime/bec7d3e6041c33109d6696276e634a5258ba788c?narHash=sha256-dPi2gaFPB0mfDLyFRO2xVo88GODYgs/akT5CNy1J2o0%3D' into the Git cache...\nthis path will be fetched (448.8 KiB download, 448.8 KiB unpacked):\n  /nix/store/044fj0fxdlxzcjcnbarf4w2za83jax2z-logos-capability_module-module-lib-lgx-1.0.0\ncopying path '/nix/store/044fj0fxdlxzcjcnbarf4w2za83jax2z-logos-capability_module-module-lib-lgx-1.0.0' from 'https://logos-co.cachix.org'...\n", "note": ""}, {"kind": "run", "cmd": "ls cap-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "cap-lgx/logos-capability_module-module-lib.lgx\n", "note": ""}]}, {"md": "### 2.3 Build the accounts module's .lgx\n\nThis compiles the module and its SDK dependencies through Nix (the\naccounts module wraps the go-wallet-sdk C library), so the first build\nis slow.\n\n```bash\nnix build 'github:logos-co/logos-accounts-module#lgx' -o accounts-lgx\n```\n\nThe `.lgx` package is under `./accounts-lgx/`:\n\n```bash\nls accounts-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-accounts-module#lgx' -o accounts-lgx", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-accounts-module/f847190ffb8aedd0244104b3e3d218c1fde21138' into the Git cache...\nthis path will be fetched (5.3 MiB download, 5.3 MiB unpacked):\n  /nix/store/6yd0bb552gansz2igbbq40pq9x90cc40-logos-accounts_module-module-lib-lgx-1.0.0\ncopying path '/nix/store/6yd0bb552gansz2igbbq40pq9x90cc40-logos-accounts_module-module-lib-lgx-1.0.0' from 'https://logos-co.cachix.org'...\n", "note": ""}, {"kind": "run", "cmd": "ls accounts-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "accounts-lgx/logos-accounts_module-module-lib.lgx\n", "note": ""}]}, {"md": "## Step 3: Install the modules with lgpm\n\nInstall both packages into a local `./modules` directory. Installing through\n`lgpm` writes each module's `manifest.json` with `\"type\": \"core\"`, which is\nwhat makes the runtime discover them at startup. Both are unsigned local dev\nbuilds, so we pass `--allow-unsigned`.", "execs": []}, {"md": "### 3.1 Install capability_module\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file cap-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file cap-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "Installing from file: cap-lgx/logos-capability_module-module-lib.lgx... done\nInstalled to: ./modules\n", "note": ""}]}, {"md": "### 3.2 Install accounts_module\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file accounts-lgx/*.lgx\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file accounts-lgx/*.lgx", "status": "pass", "exit_code": 0, "output": "Installing from file: accounts-lgx/logos-accounts_module-module-lib.lgx... done\nInstalled to: ./modules\n", "note": ""}]}, {"md": "### 3.3 Confirm both modules are installed\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules list\n```\n\nBoth modules now report type `core`, so `logos_core_start()` will\ndiscover them.", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules list", "status": "pass", "exit_code": 0, "output": "Found 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\naccounts_module                1.0.0           core       accounts       \ncapability_module              1.0.0           core       security       \n", "note": ""}]}, {"md": "## Step 4: Write the embedding program\n\nNow the program itself. It is plain C++ that links `liblogos_core` and\ndrives the C API. Two files: the source and a `CMakeLists.txt`.", "execs": []}, {"md": "### 4.1 src/main.cpp\n\nThe whole lifecycle in one `main()`:\n\n- Construct a `QCoreApplication` (liblogos uses Qt internally), but\n  never call `app.exec()` \u2014 the load calls are synchronous.\n- Resolve the modules directory to an absolute path (`logos_core`\n  cannot read plugin metadata from a relative path).\n- `logos_core_init` \u2192 `logos_core_add_modules_dir` \u2192 `logos_core_start`\n  (this discovers modules and brings up `capability_module`).\n- `logos_core_load_module(name, true)` loads the requested module and\n  its dependencies; the module list accessors confirm what is up.\n\n```cpp\n// Embedding the Logos runtime (liblogos_core) in your own program.\n//\n// liblogos exposes a C API in <logos_core.h>. Internally the runtime\n// is built on Qt (it uses QPluginLoader to read module metadata and\n// Qt's IPC stack to talk to modules), so an application that embeds\n// it must construct a QCoreApplication before driving the C API. You\n// do NOT need to run Qt's event loop: the load API below is\n// synchronous. Module subprocesses are launched through a separate\n// `logos_host` binary, located via the LOGOS_HOST_PATH environment\n// variable.\n#include <QCoreApplication>\n#include \"logos_core.h\"\n\n#include <cstdio>\n#include <filesystem>\n\nstatic void printList(const char* label, char** items) {\n    printf(\"%s:\", label);\n    if (!items || !items[0]) { printf(\" (none)\\n\"); return; }\n    printf(\"\\n\");\n    for (int i = 0; items[i]; ++i)\n        printf(\"  - %s\\n\", items[i]);\n}\n\nint main(int argc, char** argv) {\n    setvbuf(stdout, nullptr, _IONBF, 0);\n\n    const char* modulesArg = (argc > 1) ? argv[1] : \"./modules\";\n    const char* moduleName = (argc > 2) ? argv[2] : \"accounts_module\";\n\n    // logos_core needs an absolute modules directory: it cannot read\n    // plugin metadata from a relative path. Resolve it up front.\n    const std::string modulesDir =\n        std::filesystem::absolute(modulesArg).string();\n\n    // liblogos uses Qt internally, so a QCoreApplication must exist\n    // before we start the runtime. We never call app.exec(): the\n    // calls below are synchronous.\n    QCoreApplication app(argc, argv);\n\n    printf(\"Initializing Logos runtime...\\n\");\n    logos_core_init(argc, argv);\n    logos_core_add_modules_dir(modulesDir.c_str());\n\n    printf(\"Starting (modules dir: %s)\\n\", modulesDir.c_str());\n    logos_core_start();\n    printList(\"Discovered modules\", logos_core_get_known_modules());\n\n    printf(\"Loading '%s' (with dependencies)...\\n\", moduleName);\n    int ok = logos_core_load_module(moduleName, /*with_dependencies=*/true);\n    printf(\"Load %s\\n\", ok ? \"OK\" : \"FAILED\");\n    printList(\"Loaded modules\", logos_core_get_loaded_modules());\n\n    logos_core_cleanup();\n    return ok ? 0 : 1;\n}\n```", "execs": [{"kind": "file", "cmd": "write embed-app/src/main.cpp", "status": "pass", "note": "Wrote embed-app/src/main.cpp"}]}, {"md": "### 4.2 CMakeLists.txt\n\nA minimal build: find Qt6 Core, find `liblogos_core` under\n`LOGOS_LIBLOGOS_ROOT` (the `nix build` result), and link both. The\n`BUILD_RPATH` lets the program find `liblogos_core.dylib` at runtime\nwithout setting `LD_LIBRARY_PATH`.\n\n```cmake\ncmake_minimum_required(VERSION 3.16)\nproject(logos_embed_app LANGUAGES CXX)\n\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\n\n# liblogos is built on Qt; an embedding program needs Qt Core too.\nfind_package(Qt6 REQUIRED COMPONENTS Core)\n\n# Point this at the `nix build` result of logos-liblogos\n# (it has bin/, lib/, and include/). Defaults to ../liblogos.\nif(NOT DEFINED LOGOS_LIBLOGOS_ROOT)\n    set(LOGOS_LIBLOGOS_ROOT \"${CMAKE_SOURCE_DIR}/../liblogos\")\nendif()\nget_filename_component(LOGOS_LIBLOGOS_ROOT \"${LOGOS_LIBLOGOS_ROOT}\" ABSOLUTE)\n\nfind_library(LOGOS_CORE_LIBRARY NAMES logos_core\n    PATHS \"${LOGOS_LIBLOGOS_ROOT}/lib\" NO_DEFAULT_PATH REQUIRED)\n\nadd_executable(logos_embed_app src/main.cpp)\ntarget_include_directories(logos_embed_app PRIVATE\n    \"${LOGOS_LIBLOGOS_ROOT}/include\")\ntarget_link_libraries(logos_embed_app PRIVATE\n    ${LOGOS_CORE_LIBRARY} Qt6::Core)\n\n# Find liblogos_core.{so,dylib} at runtime without LD_LIBRARY_PATH.\nset_target_properties(logos_embed_app PROPERTIES\n    BUILD_RPATH \"${LOGOS_LIBLOGOS_ROOT}/lib\")\n```", "execs": [{"kind": "file", "cmd": "write embed-app/CMakeLists.txt", "status": "pass", "note": "Wrote embed-app/CMakeLists.txt"}]}, {"md": "## Step 5: Build the program against this liblogos\n\nBuild the program with CMake. We run the build **inside this liblogos'\ndev shell** (`nix develop`) so the compiler and Qt version exactly match\nthe library you are linking \u2014 mismatched Qt is the most common cause of\nembedding failures.", "execs": []}, {"md": "### 5.1 Configure and build\n\n```bash\n# Enter the liblogos dev shell (cmake, ninja, pkg-config, Qt6), then:\ncd embed-app\ncmake -S . -B build -G Ninja -DLOGOS_LIBLOGOS_ROOT=\"$PWD/../liblogos\"\ncmake --build build\n```\n\nThe program is at `embed-app/build/logos_embed_app`. Its `BUILD_RPATH`\npoints at `liblogos/lib`, so it runs without `LD_LIBRARY_PATH`.", "execs": [{"kind": "run", "cmd": "nix develop 'github:logos-co/logos-liblogos/dbcafea05c06e91be18763bc0c4b307222d8b853' -c bash -c 'cd embed-app && cmake -S . -B build -G Ninja -DLOGOS_LIBLOGOS_ROOT=$PWD/../liblogos && cmake --build build'", "status": "pass", "exit_code": 0, "output": "copying path '/nix/store/s35yr13fijzw164c0blsh2vv820bjy6a-fmt-10.2.1-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/i9s8ylm9j2nh7m7gs6ap7rmshvjnra8v-spdlog-1.15.2-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/87hq2m70dj75gr323rmq022fyn7vf8kn-nix-shell-env' from 'https://logos-co.cachix.org'...\nthese 2 paths will be fetched (1.1 MiB download, 8.2 MiB unpacked):\n  /nix/store/dgfikfjky3nq6gycpd08fyvmr7ww1j7j-bash-interactive-5.3p3\n  /nix/store/f3rz4yan99jnnwcpfw8117ayf37fzxgl-bash-interactive-5.3p3-man\ncopying path '/nix/store/f3rz4yan99jnnwcpfw8117ayf37fzxgl-bash-interactive-5.3p3-man' from 'https://cache.nixos.org'...\ncopying path '/nix/store/dgfikfjky3nq6gycpd08fyvmr7ww1j7j-bash-interactive-5.3p3' from 'https://cache.nixos.org'...\n-- The CXX compiler identification is Clang 19.1.7\n-- Detecting CXX compiler AB <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
