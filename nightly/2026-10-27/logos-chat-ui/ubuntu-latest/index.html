  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
  .badge.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .badge.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .badge.info { background: rgba(210,153,34,.15); color: var(--info); }
  .badge.not_run { background: var(--bg); color: var(--muted); white-space: nowrap; }
  .badge.running { background: rgba(248,81,73,.15); color: var(--fail); }
  .ui-actions { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  .ui-actions td { padding: 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .ui-actions td:last-child { white-space: nowrap; color: var(--muted); }
  .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .note { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  pre.cmd { background: var(--code-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 0 0 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  pre.output { background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin: 0; overflow-x: auto; max-height: 360px; overflow-y: auto; color: #b9c1ca; }

  .heading-anchored { position: relative; scroll-margin-top: 76px; }

  .heading-anchored:hover > a.anchor, a.anchor:focus { opacity: 1; }
  a.anchor:hover { color: var(--accent); }

 from 'https://cache.nixos.org'...\ncopying path '/nix/store/vc37li5p9cmqx5zfhlm6sxmli6qbc346-pango-1.56.3' from 'https://cache.nixos.org'...\ncopying path '/nix/store/wmaqf8a3d2hzljx92sckpa4ivzqh5dcm-dbus-1.14.10-lib' from 'https://cache.nixos.org'...\ncopying path '/nix/store/c96wgx1q0v8j90isavvxm3qah55r45lw-at-spi2-core-2.56.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/s9nqr7mipmbi2vgkwkqiriq8ggrrw915-avahi-0.8' from 'https://cache.nixos.org'...\ncopying path '/nix/store/wm9npw769j5z8zfap6bgfka0rhd6y85c-dbus-1.14.10' from 'https://cache.nixos.org'...\ncopying path '/nix/store/zkpfddh7v4svk76afsc1bbbvqapzjpir-cups-2.4.12-lib' from 'https://cache.nixos.org'...\ncopying path '/nix/store/1h1cz7mqml20pcdwa7a5wi5kv0z5f9jx-dbus-1.14.10-dev' from 'https://cache.nixos.org'...\ncopying path '/nix/store/x0cccj6ww4hkl1hlirx60f32r13dvfmf-boost-1.87.0' from 'https://cache.nixos.org'...\ncopying path '/nix/store/rk9kj6nnabvam68pdw7vjj2jxsc0flc8-tinysparql-3.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/lw4v9xvxyqrabifarmvj36prncj0c947-gtk+3-3.24.49' from 'https://cache.nixos.org'...\ncopying path '/nix/store/dkfr32yi7p8cdxsnll05q1kax19fl7ay-qtbase-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/36ndhs8khvj8960qbhvw8h3bld1kc06g-qtsvg-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/agvpq5n8vcqwnkmn8bp8rlczy3fdxm6n-qtdeclarative-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/r2cq6la02msp6kfcl9a17d2l2n96qpvs-qtremoteobjects-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/0x8sn2vlcq3iap2pc0ngk3z5dks7infr-logos-chat_ui-module' from 'https://logos-co.cachix.org'...\n", "status": "pass"}], "md": "### 1.1 Build the plugin\n\n```bash\nnix build 'github:logos-co/logos-chat-ui'\n```\n\nThe build runs the universal UI codegen (`logos-qt-generator --backend\nui`) over `src/ChatBackend.rep`, compiles `ChatBackend` (which derives\n`ChatBackendSimpleSource` + `LogosUiPluginContext`), and emits the\n`chat_ui_plugin` / replica-factory glue around it."}, {"execs": [], "md": "## What the chat UI does\n\nThe window is a two-pane messenger:\n\n- **Left:** your conversations, under a **New chat** button (start a\n  direct message from someone's address, or a group), with your own\n  account card at the foot: its short form, the delivery state\n  (`Stopped` \u2192 `Initialising...` \u2192 `Online`), and your address with a\n  copy button beside it.\n- **Right:** the message thread for the selected conversation, under a\n  header carrying its avatar, its description and who is in it, and a\n  composer with the send action at its end.\n\nUnder the hood the backend calls `modules().chat_module` \u2014 typed methods\n(`init`, `get_address`, `create_conversation`, `send_message`, \u2026)\nand string-keyed event subscriptions (`message_received`,\n`delivery_state_changed`, \u2026) that push updates into the view with no\npolling. `init` kicks off the delivery node asynchronously and returns\nimmediately; the UI flips to **Online** when the\n`delivery_state_changed` event reports the network is up."}, {"execs": [], "md": "## Step 2: Launch and connect, then share your address\n\nRun the app headless (offscreen Qt) and drive it: wait for the network to\ncome up, then copy your address \u2014 the everything-a-single-window-shows\nhalf of the tour."}, {"execs": [{"actions": [{"description": "Window opens: wait for ['New chat']", "duration_ms": 2, "index": 1, "status": "pass"}, {"description": "Network connects: wait for ['Online']", "duration_ms": 3050, "index": 2, "status": "pass"}, {"description": "Copy your address: click objectName='copyMyAddressButton'", "duration_ms": 2, "index": 3, "status": "pass"}, {"description": "Copied confirmation: wait for ['Copied to clipboard']", "duration_ms": 6, "index": 4, "status": "pass"}], "cmd": "nix run 'github:logos-co/logos-chat-ui/15c16ca4ad48efe63993daa0765cac8ca9f7c36d' --override-input chat_module github:logos-co/logos-chat-module/8e5b68d95647527d406e1780d75b64b1aa7818e2", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial: The Logos Chat UI: Drive the app\n\n1 passed, 0 failed\n\n", "runner_cmd": "node \"/tmp/doctest-test-qzv22n1t/ui-test.mjs\" --verbose", "status": "pass"}], "md": "### 2.1 Drive the app\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/15c16ca4ad48efe63993daa0765cac8ca9f7c36d'\n```\n\nThe chat window opens; the account card starts at **Stopped** while delivery boots.\n\n`init` returned right away and the delivery node bootstrapped in\nthe background. When it connects, the `delivery_state_changed`\nevent lands and the state flips to **Online** \u2014 **New chat**\nenables and the backend reads `get_address()` onto the account\ncard. That address is what a peer needs to open a conversation\nwith you; your key package was published to the registry during\n`init`, so the address alone is enough.\n\n![Network connects](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeZRUdYLg+xsZmeSCkOx7kuw7KoriLoKKgFq49imrlKpSqW6rrfG97p6eNzPn9Jkz033e9FR31avq0nYp7cayypZyRUTEElEpFZQtkZ1MtkS2TJaE3CPj/XFnYnIyE0wUQer3+fwFN27c+N0bERn3G/dGRKJHjx4RAAAQhqyzPQAAAODMEQAAABAQAQAAAAERAAAAEBABAAAAAREAAAAQEAEAAAABEQAAABAQAQAAAAERAAAAEBABAAAAAck+LUvJy8srKCjIyclJJpPZ2dmJROK0LBZoLZ1ONzY2plKphoaG6urq2traM3CjnuMAcFZ8Ha/7iR49enzpKyeTyS5duhQUFKRSqdra2sbGxqamplQqlU6nv/rIgDYlEolkMpmVlZWdnZ2Xl5dMJqurqw8fPpxKpU77bWWe442NjTU1NfX19U1NTY2NjZ7jAHBmJBKJ7OzsrKysDh065OfnZ2dnf/XX/S8ZAIlEorCwsFOnTjU1NdXV1U1NTV96BMBXkZWVVVBQkJ+fX1VVdeTIkdO1a555jh8/fryqqspzHAC+CbKysjp16tSxY8ev8rr/ZQIgmUz27NkznU7bLYBviPjPQSKROHDgwFc/FBA/x5uamr6mAwsAwFcRH6LPysr6cq/7yYKCglO6Qk5OTp8+ferq6qqqqpwGAN8Q6XS6rq4umUx27dq1pqbmq5R5/ByPDy96jgPAN1A6na6pqUkmk927d/8Sr/unFgDJZLJ3797Hjx+vqak5xXECX7uGhoampqZu3bodP378y+27x8/xI0eOHD9+/LQPDwA4jerr61OpVI8ePU71df8UAiCRSPTq1au+vt7eP3xjNTY2JhKJ+Nz9U71u/Byvqamx9w8A54T4db+wsPCUXrtP4XcACgsL0+m0PQ  pastes\nit into **New DM**, sends a first message, and the reply flows back. That\nround-trip spans **two** app instances, so the single-window walkthrough in\n*The Logos Chat UI* tutorial can't express it \u2014 and neither can the doc-test\n`ui_test` driver on its own, which works against one instance and can only set\nliteral field values (it can't read one window's address out and paste it\ninto another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `exchange` app\ndrives the real two-party round-trip over the live network between two headless\ninstances, then exposes the receiving window so the finished thread can be\ncaptured. This tutorial runs that test and shows its result; the full\nstep-by-step flow \u2014 address, first message, reply \u2014 with screenshots of **both**\nwindows is in\n[docs/two-instance-exchange.md](../docs/two-instance-exchange.md).\n\n**What you'll build:** A verified end-to-end message round-trip between two chat UI instances, captured from the receiving window.\n\n**What you'll learn:**\n\n- How the `exchange` app runs the full two-party round-trip headless over the live network\n- Why a two-window exchange needs a dedicated runner rather than the single-instance `ui_test` driver\n- Where the step-by-step, both-windows walkthrough and its regeneration script live\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The two delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the exchange."}, {"execs": [], "md": "## Step 1: Run the automated exchange\n\nThe `exchange` app launches two instances offscreen and runs the real\nround-trip over the live network \u20 bZbEaOEwSB53mbzab+z9wqCQAAAAAAc0JRlNlsdjgcJEmOjo4abKIb2ghMx/M8z/Nms3lFTqMGAAAAAFhGVFXNZrOJRGJGeTozCwAAAAAAAGBZWyHzoAEAAAAAwAgEAAAAAAAAeQQBAAAAAABAHkEAAAAAAACQRxAAAAAAAADkEQQAAAAAAAB5BAEAAAAAAEAeQQAAAAAAAJBHEAAAAAAAAOQRBAAAAAAAAHkEAQAAAAAAQB75f04OHwkJmXlMAAAAAElFTkSuQmCC)"}]}, {"meta": {"name": "Tutorial: Run the automated group-chat test", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Tutorial: Run the automated group-chat test\n\nA group conversation goes further than a DM: one person creates it,\ninvites others by address, and every message fans out to the whole roster with\nthe sender attributed. That spans **three** app instances and grows by\nmembership commits over the live network \u2014 more than the single-window\nwalkthrough in *The Logos Chat UI* tutorial can express, and more than the\ndoc-test `ui_test` driver can orchestrate on its own (it works against one\ninstance and can't read one window's address out to invite it into another).\n\n`logos-chat-ui` ships an automated test for exactly this. The `group` app\ndrives the real three-party flow over the live network between three headless\ninstances \u2014 Alice creates the group, invites Bob and Carol, and once the roster\nconverges sends a message that reaches both \u2014 then exposes the newest member's\nwindow so the finished group can be captured.\n\n**What you'll build:** A verified three-member, end-to-end-encrypted group conversation across three chat UI instances, captured from a receiving member's window.\n\n**What you'll learn:**\n\n- How the `group` app forms a three-member group and fans a message out to it, headless over the live network\n- How the group UI adds a members pane and per-message sender attribution over a DM\n- Why a multi-window group needs a dedicated runner rather than the single-instance `ui_test` driver\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, Rust) during the builds.\n- **Network access.** The three delivery nodes discover each other over the configured network preset; an isolated sandbox won't complete the flow. Expect membership changes to take minutes."}, {"execs": [], "md": "## Step 1: Run the automated group chat\n\nThe `group` app launches three instances offscreen and runs the real flow\nover the live network \u2014 Alice creates the group, invites Bob and Carol,\nand once all three are in she sends a message that fans out to both \u2014 then\nopens the capture port onto Carol's live window so her copy of the group is\non screen. The whole flow happens while the launch is still coming up, so\nthe screenshot below captures the already-formed group: the creator's\nmessage, received with its sender label, beside the three-member roster."}, {"execs": [{"actions": [{"description": "Group message received: wait for ['Hello team \ud83d\udc4b', 'Members']", "duration_ms": 26, "index": 1, "status": "pass"}], "cmd": "nix run 'github:logos-co/logos-chat-ui/15c16ca4ad48efe63993daa0765cac8ca9f7c36d#group' --override-input chat_module github:logos-co/logos-chat-module/8e5b68d95647527d406e1780d75b64b1aa7818e2", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial: Run the automated group-chat test: Run the group flow and show the result\n\n1 passed, 0 failed\n\n", "runner_cmd": "node \"/tmp/doctest-test-l70odza1/ui-test.mjs\" --verbose", "status": "pass"}], "md": "### 1.1 Run the group flow and show the result\n\n```bash\nnix run 'github:logos-co/logos-chat-ui/15c16ca4ad48efe63993daa0765cac8ca9f7c36d#group'\n```\n\nCarol's window after the group formed: Alice's message, received\nwith its sender label and end-to-end-encrypted over\n`delivery_module`, beside the members pane listing the\ <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
