 tribe swallow rain sun visit mom unusual mammal local note yard\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.9 Generate a default-length mnemonic\n\n`createRandomMnemonicWithDefaultLength` takes no arguments and returns a\nphrase of the SDK's default length:\n\n```bash\nlogoscore call accounts_module createRandomMnemonicWithDefaultLength\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module createRandomMnemonicWithDefaultLength", "status": "pass", "exit_code": 0, "output": "{\"method\":\"createRandomMnemonicWithDefaultLength\",\"module\":\"accounts_module\",\"result\":\"clump organ rare juice cliff thrive good jelly easy praise question found\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.10 Map a word count to entropy strength\n\n`lengthToEntropyStrength` maps a mnemonic word count to its entropy\nstrength in bits \u2014 12 words is 128 bits. This exercises an `int`\nround-trip:\n\n```bash\nlogoscore call accounts_module lengthToEntropyStrength 12\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module lengthToEntropyStrength 12", "status": "pass", "exit_code": 0, "output": "{\"method\":\"lengthToEntropyStrength\",\"module\":\"accounts_module\",\"result\":128,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nlogoscore call accounts_module lengthToEntropyStrength 24\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module lengthToEntropyStrength 24", "status": "pass", "exit_code": 0, "output": "{\"method\":\"lengthToEntropyStrength\",\"module\":\"accounts_module\",\"result\":256,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.11 Create and use a keystore\n\nInitialise a keystore in a fresh directory (`scryptN`=4096, `scryptP`=6\nkeep the test fast), then create a new account in it. `keystoreNewAccount`\nreturns the new account's address:\n\n```bash\nlogoscore call accounts_module initKeystore ./ks 4096 6\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module initKeystore ./ks 4096 6", "status": "pass", "exit_code": 0, "output": "{\"method\":\"initKeystore\",\"module\":\"accounts_module\",\"result\":true,\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nlogoscore call accounts_module keystoreNewAccount test-passphrase\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module keystoreNewAccount test-passphrase", "status": "pass", "exit_code": 0, "output": "{\"method\":\"keystoreNewAccount\",\"module\":\"accounts_module\",\"result\":\"{\\\"address\\\":\\\"0x374b45B8b4655B4926bdb2e51f960615F308559D\\\",\\\"url\\\":\\\"keystore:///private/tmp/doctest-test-mszwt7wx/ks/UTC--2026-07-18T03-18-28.824585000Z--374b45b8b4655b4926bdb2e51f960615f308559d\\\"}\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.12 List the keystore's accounts\n\n`keystoreAccounts` returns the accounts now present in the keystore \u2014 the\none we just created:\n\n```bash\nlogoscore call accounts_module keystoreAccounts\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call accounts_module keystoreAccounts", "status": "pass", "exit_code": 0, "output": "{\"method\":\"keystoreAccounts\",\"module\":\"accounts_module\",\"result\":[\"{\\\"address\\\":\\\"0x374b45B8b4655B4926bdb2e51f960615F308559D\\\",\\\"url\\\":\\\"keystore:///private/tmp/doctest-test-mszwt7wx/ks/UTC--2026-07-18T03-18-28.824585000Z--374b45b8b4655b4926bdb2e51f960615f308559d\\\"}\"],\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.13 Stop the daemon\n\nShut the daemon down cleanly:\n\n```bash\nlogoscore stop\n```\n\nThe daemon removes its state file and exits.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "```bash\nsleep 2\n```", "execs": [{"kind": "run", "cmd": "sleep 2", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.14 Confirm the daemon has stopped\n\nWith no daemon running, the client reports `not_running` and exits\nnon-zero, so we add `|| true` to let the doc-test assert on the output:\n\n```bash\nlogoscore status\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore status || true", "status": "pass", "exit_code": 0, "output": "{\"daemon\":{\"instance_id\":\"f12cf6869524\",\"status\":\"not_running\",\"version\":\"pre-release-733ca45\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "note": ""}]}]}, {"meta": {"name": "Driving the Accounts UI Against This Module", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"md": "# Driving the Accounts UI Against This Module\n\nThe companion to the [headless runtime doc-test](accounts-module-runtime.md):\ninstead of calling `accounts_module` through the `logoscore` daemon, this one\ndrives the real **[`logos-accounts-ui`](https://github.com/logos-co/logos-accounts-ui)**\ndesktop app against **this** commit of the module.\n\n`logos-accounts-ui` is a QML UI plugin built with\n[`logos-app-builder`](https://github.com/logos-co/logos-app-builder), so its\nflake exposes a standalone app (`apps.default`) that `nix run` launches in its\nown window with all backend module dependencies bundled and auto-loaded. The\nUI declares `accounts_module` as a flake input, so we build the app with an\n`--override-input` that points that input at the commit under test. The UI then\ntalks to **this** module over the Logos IPC bridge, exactly as it would in\n`logos-basecamp`.\n\nThe app is launched headless (`QT_QPA_PLATFORM=offscreen`) and driven through\nthe QML inspector via [`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp):\nwe wait for elements to appear, type into inputs, click buttons, assert on the\nresults the module returns, and capture screenshots that are embedded in the\nrendered tutorial and the CI report.\n\n**What you'll build:** The `logos-accounts-ui` standalone app, built against this `accounts_module` commit and driven headlessly through its QML UI.\n\n**What you'll learn:**\n\n- How a UI built with `logos-app-builder` exposes a standalone `nix run` app\n- How to override the UI's module input so it runs against a specific module commit\n- How to drive a headless Qt/QML app with logos-qt-mcp (wait, type, click, assert)\n- How to capture screenshots of the running UI for documentation and CI reports\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required.", "execs": []}, {"md": "## How the standalone UI app works\n\n`logos-accounts-ui` is a QML UI plugin (`accounts_ui`) that declares\n`accounts_module` as a dependency. Because it is built with\n`logos-app-builder`, its flake's `apps.default` is a self-contained desktop\napp:\n\n```\n+----------------------+   backend.createRandomMnemonic()   +-------------------+\n|     accounts_ui      | --------------------------------->  |  accounts_module  |\n|  AccountsView.qml    |   IPC (Logos API bridge)            |   C++ plugin      |\n+----------------------+                                     +-------------------+\n           ^                                                          ^\n           \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 bundled & launched by \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                           logos-app-builder standalone app\n```\n\nThe standalone app bundles every module dependency (here `accounts_module`)\nand loads it automatically at startup \u2014 so when the QML calls\n`backend.lengthToEntropyStrength(12)`, the call travels over the Logos bridge\nto the real module and comes back with `128`. By overriding the\n`accounts_module` input at build time we make that backend **this** commit.", "execs": []}, {"md": "## Step 1: Clone the UI\n\nClone [`logos-accounts-ui`](https://github.com/logos-co/logos-accounts-ui).\nWe clone over HTTPS so the step works in CI; over SSH the URL is\n`git@github.com:logos-co/logos-accounts-ui.git`.", "execs": []}, {"md": "### 1.1 git clone\n\n```bash\ngit clone --depth 1 https://github.com/logos-co/logos-accounts-ui.git\n```", "execs": [{"kind": "run", "cmd": "git clone --depth 1 https://github.com/logos-co/logos-accounts-ui.git", "status": "pass", "exit_code": 0, "output": "Cloning into 'logos-accounts-ui'...\n", "note": ""}]}, {"md": "## Step 2: Build the qt-mcp test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness the\ndoc-test uses to connect to the app's QML inspector and drive it. Build it\nonce and link it as `./result-mcp`.", "execs": []}, {"md": "### 2.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-qt-mcp' -o result-mcp\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-qt-mcp' -o result-mcp", "status": "pass", "exit_code": 0, "output": "unpacking 'github:logos-co/logos-qt-mcp/1fea509485a48ab185fafae8dc21bdbcc808a07e' into the Git cache...\nthese 11 paths will be fetched (19.0 MiB download, 112.3 MiB unpacked):\n  /nix/store/dgfikfjky3nq6gycpd08fyvmr7ww1j7j-bash-interactive-5.3p3\n  /nix/store/0pr4q85wdnizd5rfvx1z9g16p6hvsmg1-icu4c-76.1-dev\n  /nix/store/5i7n3axk65fm14q3aywqg6pdch4y3zfl-libuv-1.51.0\n  /nix/store/hbbyr0434ww52i6bph4lyswm76ixzpcw-libuv-1.51.0-dev\n  /nix/store/0pvy2s1y0i9s7k7smvx3a3bxgxdg9mwf-logos-qt-mcp\n  /nix/store/r2nxv2gamv2hi4s6klngl1gnw72smn59-ncurses-6.5\n  /nix/store/3scj3c1qxh5iclf8jy5hbl9pki40y77n-nodejs-22.19.0\n  /nix/store/cc040r4dq636j6criffnmi6nk98pmfn8-readline-8.3p1\n  /nix/store/p0psb5 `.", "execs": []}, {"md": "### 3.1 Launch and drive the app\n\n```bash\nnix run ./logos-accounts-ui --override-input accounts_module github:logos-co/logos-accounts-module/2f234a10f41d1f084a238cfc69203cd4fb421f48\n```\n\n![Mnemonic section visible](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeXwU5f0H8O/M3kc2x+a+CLkTCAGSAAHCFaAhyKEUW8+KrVqtWq1Hq9V6VPurRyvFu6JCW6qgAsohHtxHuJNAEkLu+042m93svTu/PwbXbS6yAYywn/cfvpaZ53nmO5Md9/nOPPMMExkZSQAAAAAA4BnY0Q4AAAAAAAB+OEgAAAAAAAA8CBIAAAAAAAAPggQAAAAAAMCDIAEAAAAAAPAgSAAAAAAAADwIEgAAAAAAAA+CBAAAAAAAwIMgAQAAAAAA8CBIAAAAAAAAPAgSAAAAAAAAD4IEAAAAAADAgyABAAAAAADwIEgAAAAAAAA8CBIAAAAAAAAPggQAAAAAAMCDIAEAAAAAAPAgSAAAAAAAADwIEgAAAAAAAA8ivJTKkyZN+sc//sF/fu2117Zs2XI5QrrixGJxWloaEbW3t1dUVLhV9+GHH77++uuJqK6u7tZbb+2z9oEHHli5ciURNTY23nTTTZcpXgAAAACAy+aS7gBkZ2c7P8+bN++Sg/mB+Pv7v/TSSy+99NJtt93mbl2GYfgPkZGRycnJrqsEAsGCBQv4zyyLWysAAAAA8GM08n6qQCCYPXu2858TJkwIDAy8HCFdNRYtWuT6z8zMTB8fn9EKBgAAAABgOEY+BCgjI8Pb25uIDh8+PGPGDIZh5s6du3HjRmeB8PDw5cuXp6SkxMTENDQ0lJaWrl27tqOjYzhrAwICbrjhhtTU1Li4uNra2sLCwi+++KK2tpaI5syZw4+uee+9906ePMk39fTTTxPRvn37Pvroo2effTYkJESv17/++ut333335MmTDQbDkSNH3nrrLYPBcPvtt8+dO9e5C+++++7x48fff/99Pz+/u+66KykpKSwsrK2traKi4oMPPuC3OJiFCxeuWbPGarXy/+yTD/BkMtntt98+efLkqKgoo9FYUVGxdevWQ4cOEVFaWtrdd99NRBs3bgwLC8vOzg4PD6+pqXnvvfeOHTvGV58wYcItt9wSHR3t5+dXV1d39uzZd999t7e3l187adKkRYsW8Tv49ddfV1ZW3nHHHUS0YcOGAwcOEFFgYOCKFSsmTZoUFRV1/vz5/Pz8jz/+2GAwuG5906ZNiYmJM2bMYFn25z//uXtfAgAAAAC42ow8AXCO/3nrrbcmTpyoUCiys7OdCUBQUNDq1aud9wSio6Ojo6MzMjIeeuih+vr6odf6+vquXr06IiKCXxsfHx8fHz9//vz777+/vr5erVYnJSURkfNyu0Qi4ZecP3+eiGJjYyMjIy0Wy8svvxwcHExEcrl86dKlMpnsz3/+c2hoaExMDF9RqVQmJSU1NTX5+PisW7fO2WBERERERERmZuYDDzzAtzkgmUyWlZW1Z88ePpjp06f3KSAQCNauXevcEZlMNmXKlIyMjJdeemnnzp3e3t582HfeeWdkZKRzZ//v//7vjjvuqKurW7hw4ZNPPukcTRQTExMTE5OWlrZq1SqLxTJu3LhXX31VJBLxa+++++76+np+W35+fkTEH8bw8HC+QGpqampq6qRJkx599FGz2ezc+l133RUaGkpEJpPpon90AAAAALjajXAIkFgsnjVrFhFVVlbW19cfPXqUiBITE53dzWeffZbv3+/evfupp57atm0bEQUEBPz0pz+96N <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function show(idx) { picker.value = idx; render(idx); }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    render(+picker.value);
  });
  window.addEventListener("hashchange", () => show(indexFromHash()));
  show(indexFromHash());
</script>
