mfnxsAADDMj7wEPDQ0dO/evblz5xYXF3d1dbW3t2/dunX69OmTJk3as2fPzp07v3z5kvu8z8yZM0ePHr1w4cKFCxfmzn38+HEikdiwYUNxcXFtbW1VVdXfR37w4EE6nc5ms01NTT8/NwAAYJi8wsLCbzlu8eLFQ0NDjY2Nuc1MJrNq1ar+/v6WlpanT59WVlZu2rRp9erVIYRTp051dnb29vaOGzdu5cqVmzdvTiaTjY2N5eXlt27d6uzsDCHU1dWtWbOmvLz80qVL6XT66tWrX79+DSF0dnauXbu2oaFBAAAAwK+QmDx58ogMlJ+fP3r06E+fPg3bOWrUqNzPAvxdXl7e+PHje3p6hu2fP3/+/v37jx49mltZBAAAjKwf/CGwfzYwMDAwMPAtO0MIg4ODw+7+a2pqtm7dmkwmr1275u4fAAB+kRELgJ/07NmzT58+ZTKZTCbzu68FAAD+b43YEiAAAOC/3498BQgAAPgfJQAAACAiAgAAACIiAAAAICICAAAAIiIAAAAgIgIAAAAiIgAAACAiAgAAACIiAAAAICICAAAAIiIAAAAgIv8ApaqLkbOWpxIAAAAASUVORK5CYII=)\n\n![Status flips to 'Proxy applied'](images/wallet-ui-applied.png)\n\n![Advanced tab rendered](images/wallet-ui-advanced.png)\n\nA rendered, interactive UI whose **Apply proxy** action flips the status\nto *Proxy applied* is end-to-end proof that the QML view, the bundled\n`wallet_backend_module`, and its dependency modules are wired together\nover the Logos bridge \u2014 the call only returns (and the status only\nupdates) because the whole module tree loaded. The captured screenshots\nare embedded above and in the CI report."}]}, {"meta": {"name": "Wallet UI end-to-end: configure a network, import, unlock, send", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Wallet UI end-to-end: configure a network, import, unlock, send\n\nThis doc-test drives the `logos-evm-wallet-ui` standalone app **headless**\nthrough a full wallet flow \u2014 the same end-to-end validation the\n[`wallet-backend` runtime doc-test](https://github.com/logos-co/logos-evm-wallet-backend-module)\nperforms against the coordinator, but here **every step goes through the real\nQML UI** over the Logos bridge.\n\nIt launches the app with `QT_QPA_PLATFORM=offscreen`, drives it with\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp), and on the new\n**Advanced** tab points the wallet at a **local mock JSON-RPC node**, then\nimports Foundry's well-known test account, unlocks it, sends a native transfer,\nand confirms it lands in History \u2014 proving the UI \u2192 C++ backend \u2192\n`wallet_backend_module` \u2192 eth-rpc / keystore round-trips end to end.\n\n**What you'll build:** The wallet UI standalone app, launched headless and driven through its Advanced, Send, and History tabs against a local mock JSON-RPC node.\n\n**What you'll learn:**\n\n- How the Advanced tab repoints the wallet at a custom RPC endpoint (setChains / testEndpoint)\n- How to import and unlock an account and send a native transfer entirely through the UI\n- How a UI-initiated send composes build \u2192 sign \u2192 broadcast \u2192 record across the backend module tree\n\n## Prerequisites\n\n- **Nix** with flakes enabled (see [nixos.org](https://nixos.org/download.html)).\n\n- **A Linux or macOS machine** with `python3` available (for the local mock JSON-RPC node). The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required."}, {"execs": [], "md": "## Step 1: Build the qt-mcp test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) connects to the\napp's QML inspector and drives it. Build it once and link it as\n`./result-mcp`."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-qt-mcp' -o result-mcp --override-input logos-nix github:logos-co/logos-nix/7c1eb8bc390546f32aaf134866a1c7db8e9311cc", "exit_code": 0, "kind": "run", "note": "", "output": "warning: not writing modified lock file of flake 'github:logos-co/logos-qt-mcp':\n\u2022 Updated input 'logos-nix':\n    'github:logos-co/logos-nix/0e9e6d6' (2026-03-19)\n  \u2192 'github:logos-co/logos-nix/7c1eb8b' (2026-09-10)\n\u2022 Added input 'logos-nix/nixpkgs-windows':\n    'github:NixOS/nixpkgs/b5aa0fb' (2026-06-29)\n", "status": "pass"}], "md": "### 1.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-qt-mcp' -o result-mcp\n```"}, {"execs": [], "md": "## Step 2: Start a local mock JSON-RPC node\n\nThe wallet is pointed at this node (chain id 1337) from the UI's Advanced\ntab. It answers the methods the send pipeline needs with canned values, so\nthe run is offline and deterministic."}, {"execs": [{"cmd": "write mock_node.py", "kind": "file", "note": "Wrote mock_node.py", "status": "pass"}], "md": "### 2.1 Write the mock node\n\n```\nimport http.server, json\nRES = {\n    \"eth_chainId\": \"0x539\",                 # 1337\n    \"eth_getTransactionCount\": \"0x0\",\n    \"eth_gasPrice\": \"0x3b9aca00\",\n    \"eth_estimateGas\": \"0x5208\",\n    \"eth_sendRawTransaction\": \"0x\" + \"ab\" * 32,\n}\nclass H(http.server.BaseHTTPRequestHandler):\n    def do_POST(self):\n        n = int(self.headers.get('content-length', 0))\n        req = json.loads(self.rfile.read(n) or b'{}')\n        body = json.dumps({\"jsonrpc\": \"2.0\", \"id\": req.get(\"id\", 1),\n                           \"result\": RES.get(req.get(\"method\"), \"0x0\")}).encode()\n        self.send_response(200)\n        self.send_header('content-length', str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n    def log_message(self, *a): pass\nhttp.server.HTTPServer(('127.0.0.1', 8613), H).serve_forever()\n```"}, {"execs": [{"cmd": "sh -c 'python3 mock_node.py > mock.log 2>&1 & echo $! > mock.pid'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.2 Start the mock node\n\n```bash\npython3 mock_node.py &\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [], "md": "## Step 3: Launch the wallet UI and drive the full flow\n\nLaunch the standalone app with `nix run`. It bundles\n`wallet_backend_module` and its dependency modules and auto-loads them, so a\nUI that can drive a send is itself proof the whole module tree is wired.\n\n> The first launch builds the full app bundle (the UI plugin, the backend and\n> its dependencies, and the standalone-app shell), so we allow a generous\n> timeout."}, {"execs": [{"actions": [{"description": "App window opens on the Balances tab: wait for ['Logos Wallet', 'Accounts']", "duration_ms": 59, "index": 1, "status": "pass"}, {"description": "Switch to the Advanced tab: call 'walletRoot'.selectTab(6)", "duration_ms": 3, "index": 2, "status": "pass"}, {"description": "Advanced tab rendered: wait for ['Custom network']", "duration_ms": 1, "index": 3, "status": "pass"}, {"description": "Enter the chain id: set objectName='advChainIdField' to '1337'", "duration_ms": 3, "index": 4, "status": "pass"}, {"description": "Enter the network name: set objectName='advChainNameField' to 'Local Mock'", "duration_ms": 6, "index": 5, "status": "pass"}, {"description": "Enter the RPC URL (the local mock node): set objectName='advRpcUrlField' to 'http://127.0.0.1:8613'", "duration_ms": 2, "index": 6, "status": "pass"}, {"description": "Enter the native symbol: set objectName='advSymbolField' to 'ETH'", "duration_ms": 1, "index": 7, "status": "pass"}, {"description": "Test the endpoint (UI \u2192 backend \u2192 eth-rpc \u2192 mock node): click 'Test endpoint'", "duration_ms": 1, "index": 8, "status": "pass"}, {"description": "Endpoint is reachable: wait for ['Endpoint reachable']", "duration_ms": 30284, "error": "Expected texts not found: [\"Endpoint reachable\"]", "index": 9, "status": "fail"}, {"description": "Save the chain (repoints the wallet): click 'Save chain'", "index": 10, "status": "not_run"}, {"description": "Chain saved (status flips): wait for ['Chains updated']", "index": 11, "status": "not_run"}, {"description": "Enter the seed phrase: set objectName='advSeedField' to 'test test test test test test test test test test test junk'", "index": 12, "status": "not_run"}, {"description": "Enter the account passphrase: set objectName='advAcctPwField' to 'pw'", "index": 13, "status": "not_run"}, {"description": "Import the account: click 'Import'", "index": 14, "status": "not_run"}, {"description": "Account imported (s <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
